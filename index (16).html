<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script type="module" src="push.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14283b">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<title>ديوني سوفت — نظام محاسبي متكامل</title>
<style>
/* ===== ديوني سوفت — نظام التصميم v2 (ألوان العلامة محفوظة، البنية والأرقام والنصوص أُعيد ترتيبها) ===== */
:root{
--ink:#14283b;--ink2:#1f4466;--am:#f4a93a;
--bg:#f1f4f8;--c:#fff;--t:#13202d;--m:#5d6c7c;--bd:#dce3ea;--bd2:#eaeff4;
--red:#d63a40;--grn:#16885a;--blu:#2c6bcf;--pur:#6a49dc;--org:#d4721a;
--r1:10px;--r2:14px;--r3:20px;--sh:0 1px 2px rgba(20,40,59,.05),0 4px 14px rgba(20,40,59,.04);
--fs:"IBM Plex Sans Arabic",Cairo,Tahoma,system-ui,sans-serif}
:root[data-theme=dark]{
--bg:#0c1520;--c:#14212c;--t:#e9eff5;--m:#93a6b8;--bd:#25384a;--bd2:#1c2d3c;
--red:#ff6b70;--grn:#3ccf91;--org:#f59a4a;--blu:#6aa3ff;--pur:#a38cff;--sh:none}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--fs);-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;color-scheme:light;overflow-x:hidden}
:root[data-theme=dark]{color-scheme:dark}
body{background:var(--bg);color:var(--t);max-width:520px;margin:auto;min-height:100vh;
padding:calc(12px + env(safe-area-inset-top)) 14px 112px;overscroll-behavior-y:contain;
line-height:1.55;font-size:15px;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum","tnum";
-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-size:1.3rem;font-weight:700;line-height:1.3;letter-spacing:-.005em}
h2{font-size:1.08rem;font-weight:700;line-height:1.35}
small{color:var(--m);font-size:.78rem;font-weight:400;line-height:1.5}
b,strong{font-weight:700}
a{color:inherit}
/* منع تحديد النص عند الضغط المطوّل (يبقى التحديد ممكناً داخل الحقول) */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}
:focus-visible{outline:2.5px solid var(--am);outline-offset:2px}

/* ---------- الأسطح والشبكات ---------- */
.card{background:var(--c);border-radius:var(--r2);padding:14px;margin:10px 0;border:1px solid var(--bd);box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g2>*,.g3>*,.g4>*{min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0 6px;gap:10px;min-height:52px}
.top h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top>div:first-child{min-width:0;flex:1}.top>div:last-child{flex:none;white-space:nowrap}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px;font-weight:700;font-size:.96rem;
padding-right:10px;border-right:3px solid var(--am);line-height:1.2}
.sec small{font-weight:400}
.hint{font-size:.8rem;color:var(--m);padding:18px 0;text-align:center}

/* ---------- الأزرار ---------- */
.btn{border:0;border-radius:var(--r1);padding:12px 14px;min-height:46px;font-size:.92rem;background:var(--ink);color:#fff;cursor:pointer;
display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;line-height:1.2;text-decoration:none;
transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.06)}
.btn:active,.act:active,.chip:active,.ic:active{transform:scale(.97)}
:root[data-theme=dark] .btn{background:var(--ink2)}
.btn.am{background:var(--am);color:#2a1d05}
.btn.r{background:var(--red);color:#fff}
.btn.gr{background:var(--grn);color:#fff}
:root[data-theme=dark] .btn.r{color:#2b0709}:root[data-theme=dark] .btn.gr{color:#04281a}
:root[data-theme=dark] .btn.am{background:var(--am);color:#2a1d05}
.btn.o{background:transparent;color:var(--t);border:1.5px solid var(--bd)}
.btn.g{background:var(--bg);color:var(--t);border:1px solid var(--bd)}
.btn.o.r{color:var(--red);background:transparent;border-color:color-mix(in srgb,var(--red) 40%,var(--bd))}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.8rem;border-radius:9px}
.w{width:100%}
.btn:disabled{opacity:.55;pointer-events:none}
.ic{width:40px;height:40px;border-radius:var(--r1);background:var(--c);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.05rem;margin-right:6px}

/* ---------- الحقول ---------- */
input,select,textarea{width:100%;padding:12px 13px;min-height:46px;border:1.5px solid var(--bd);border-radius:var(--r1);margin:5px 0;font-size:.96rem;background:var(--c);color:var(--t);transition:border-color .12s,box-shadow .12s}
input::placeholder,textarea::placeholder{color:var(--m);opacity:.7}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--am);box-shadow:0 0 0 3px color-mix(in srgb,var(--am) 28%,transparent)}
input[type=number],input[type=tel],input[type=email],input[type=date],input[type=time]{direction:ltr;text-align:right}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
label{font-size:.8rem;color:var(--m);display:block;margin-top:10px;font-weight:600}

/* ---------- ألوان الحالة ---------- */
.due{color:var(--red)}.ok{color:var(--grn)}.warn{color:var(--org)}.purple{color:var(--pur)}.blue{color:var(--blu)}

/* ---------- الأرقام ---------- */
.big{font-size:1.9rem;font-weight:700;line-height:1.15;letter-spacing:-.01em;unicode-bidi:isolate}
.big,.stat .n,.mini b,.inv-row .tot,.inv-row .price,.inv-row .qty,.inv-total .v,.pos-total .amt,.scan-info .price,.tx>.row>b,.item>div:last-child>b,td b{font-variant-numeric:lining-nums tabular-nums;unicode-bidi:isolate}

/* ---------- الواجهة الرئيسية ---------- */
.hero{background:linear-gradient(155deg,var(--ink),var(--ink2));color:#fff;border-radius:var(--r3);padding:18px;margin:10px 0;box-shadow:inset 0 3px 0 var(--am)}
.hero small{color:#b9cadb}
.hero .big{color:var(--am);margin:4px 0 14px}
.hero h2{color:#fff}
.hero .mini{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:var(--r1);padding:10px 8px;text-align:center}
.hero .mini small{display:block;font-size:.7rem}
.hero .mini b{display:block;font-size:1rem;margin-top:2px;color:#fff}
.act{background:var(--c);border:1px solid var(--bd);border-radius:var(--r2);padding:13px 4px;text-align:center;cursor:pointer;font-size:.76rem;font-weight:600;line-height:1.3;transition:transform .12s;box-shadow:var(--sh)}
.act i{display:block;font-style:normal;font-size:1.5rem;margin-bottom:4px;line-height:1.2}
.stat{background:var(--c);border-radius:var(--r2);padding:13px;border:1px solid var(--bd);box-shadow:var(--sh);min-width:0}
.stat .l{font-size:.74rem;color:var(--m);font-weight:500}
.stat .n{font-size:1.08rem;font-weight:700;margin-top:4px;overflow-wrap:anywhere}

/* ---------- القوائم ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 15px;border-radius:20px;background:var(--c);border:1px solid var(--bd);font-size:.82rem;white-space:nowrap;cursor:pointer;font-weight:600;transition:transform .12s;flex:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
:root[data-theme=dark] .chip.on{background:var(--am);color:#2a1d05;border-color:var(--am)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd2);cursor:pointer}
.item:last-child{border:0}
.item:active{background:var(--bg)}
.item>div:first-child{min-width:0}
.item>div:last-child{text-align:left;flex:none}
.item b{font-weight:700}
.av{width:44px;height:44px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:1.05rem}
.bar{height:5px;border-radius:5px;background:var(--bd);margin-top:6px;overflow:hidden;width:90px;margin-right:auto}
.bar i{display:block;height:100%;background:var(--grn);border-radius:5px}
.tx{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--bd);gap:10px}
.tx:last-child{border:0}
.tx>div:first-child{min-width:0}
.tx>.row>b{font-size:.95rem;white-space:nowrap}

/* ---------- الجداول ---------- */
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:10px 8px;border-bottom:1px solid var(--bd2);text-align:right;vertical-align:middle}
th{background:var(--bg);color:var(--m);font-weight:700;font-size:.76rem}
tr:last-child td{border-bottom:0}
td:last-child{text-align:left}
.badge{display:inline-block;padding:2px 10px;border-radius:8px;font-size:.7rem;font-weight:700;line-height:1.6;vertical-align:middle}
.badge.cash{background:#16885a22;background:color-mix(in srgb,var(--grn) 15%,transparent);color:var(--grn)}
.badge.due{background:#d63a4022;background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.badge.partial{background:#d4721a22;background:color-mix(in srgb,var(--org) 16%,transparent);color:var(--org)}

/* ---------- الفواتير ونقطة البيع ---------- */
.inv-head{background:linear-gradient(135deg,var(--ink),var(--ink2));color:#fff;border-radius:var(--r2);padding:14px;margin:8px 0}
.inv-head .no{color:var(--am);font-weight:700;font-size:1.1rem}
.inv-table{background:var(--c);border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden;margin:8px 0}
.inv-row{display:grid;grid-template-columns:30px minmax(0,1fr) 52px 72px 84px;gap:6px;padding:11px 12px;border-bottom:1px solid var(--bd2);align-items:center;font-size:.86rem}
.inv-row:last-child{border:0}
.inv-row.head{background:var(--bg);font-weight:700;color:var(--m);font-size:.76rem}
.inv-row .num{color:var(--m);font-weight:600;text-align:center}
.inv-row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-row .qty{text-align:center;font-weight:700}
.inv-row .price{text-align:left;color:var(--m)}
.inv-row .tot{text-align:left;font-weight:700}
.inv-total{background:linear-gradient(135deg,var(--ink),var(--ink2));color:#fff;border-radius:var(--r2);padding:16px;margin:10px 0}
.inv-total .r{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.inv-total .r.grand{border-top:1px solid rgba(255,255,255,.2);margin-top:6px;padding-top:12px;font-size:1.1rem}
.inv-total .grand .v{color:var(--am);font-size:1.5rem;font-weight:700}
.inv-total .r .v{font-weight:700}
.add-row{background:var(--bg);border:1.5px dashed var(--bd);border-radius:var(--r2);padding:10px;margin:8px 0}
.add-row input{background:var(--c);margin:0}
.qty-ctrl{display:flex;align-items:center;gap:6px}
.qty-ctrl button{width:38px;height:38px;border-radius:var(--r1);border:1.5px solid var(--bd);background:var(--c);color:var(--t);font-size:1.2rem;font-weight:700;cursor:pointer}
.pos-total{background:linear-gradient(135deg,var(--ink),var(--ink2));color:#fff;border-radius:var(--r3);padding:16px;margin:10px 0;text-align:center;box-shadow:inset 0 3px 0 var(--am)}
.pos-total .amt{font-size:2.1rem;font-weight:700;color:var(--am);margin:4px 0;line-height:1.15}

/* ---------- التنقل السفلي ---------- */
#nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:var(--c);border-top:1px solid var(--bd);display:flex;align-items:flex-end;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:50;box-shadow:0 -4px 16px rgba(20,40,59,.05)}
#nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--m);font-size:.7rem;padding:5px 4px;flex:1;cursor:pointer;font-weight:600;position:relative}
#nav a span{font-size:1.25rem;line-height:1.2}
#nav a.on{color:var(--t)}
#nav a.on small{color:var(--t);font-weight:700}
#nav a.on:not(.fab)::before{content:'';position:absolute;top:-7px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--am)}
#nav .fab{background:var(--am);color:#2a1d05;width:56px;height:56px;border-radius:var(--r3);flex:none;margin-top:-26px;box-shadow:0 8px 18px rgba(244,169,58,.42);justify-content:center;font-size:1.9rem;font-weight:700}

/* ---------- الإشعارات والنوافذ ---------- */
#toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r2);display:none;z-index:700;font-size:.86rem;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1)}
.modal{position:fixed;inset:0;background:rgba(8,18,28,.58);display:none;align-items:flex-end;justify-content:center;z-index:200}
.modal.open{display:flex}
.modal-box{background:var(--c);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s;position:relative}
.modal-box::before{content:'';display:block;width:38px;height:4px;border-radius:4px;background:var(--bd);margin:-12px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.lg{width:80px;height:80px;border-radius:24px;display:block;margin:0 auto 10px;box-shadow:0 10px 24px rgba(20,40,59,.28)}
.nc{background:linear-gradient(150deg,var(--ink),var(--ink2));color:#fff;text-align:center;padding:18px}
.nc p{font-size:.8rem;opacity:.92;margin:6px 0 12px}
.nc .bell{font-size:2.2rem}
.nc button{background:var(--am);color:#2a1d05;border:0;border-radius:var(--r1);padding:12px;font-weight:700;width:100%;font-size:.92rem;cursor:pointer}
.nc ol{text-align:right;font-size:.8rem;line-height:1.9;padding-right:18px;margin:8px 0}

/* ---------- الاتصال والمزامنة والتحميل ---------- */
#offbar{display:none;position:fixed;top:0;left:0;right:0;background:var(--org);color:#fff;text-align:center;font-size:.76rem;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;z-index:400;font-weight:600}
body.offline #offbar{display:block}
body.offline{padding-top:calc(40px + env(safe-area-inset-top))}
#sync{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;background:var(--am);color:#2a1d05;font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:14px;z-index:350}
body.offline #sync{top:calc(44px + env(safe-area-inset-top))}
.spin{width:34px;height:34px;border:4px solid var(--bd);border-top-color:var(--am);border-radius:50%;animation:rot .8s linear infinite;margin:16px auto}
@keyframes rot{to{transform:rotate(360deg)}}
.sk{background:linear-gradient(90deg,var(--bd),var(--c),var(--bd));background-size:200% 100%;animation:shm 1.2s ease-in-out infinite;border-radius:var(--r2)}
@keyframes shm{to{background-position:-200% 0}}

/* ---------- قفل التطبيق ---------- */
#lock{position:fixed;inset:0;background:var(--bg);z-index:600;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px}
#lock .dots{display:flex;gap:16px;margin:14px 0 6px;direction:ltr}
#lock .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--m);display:block;transition:background .1s}
#lock .dots i.on{background:var(--am);border-color:var(--am)}
#lock .kp{display:grid;grid-template-columns:repeat(3,76px);gap:12px;margin-top:10px;direction:ltr}
#lock .kp button{height:66px;border-radius:50%;border:1.5px solid var(--bd);background:var(--c);color:var(--t);font-size:1.5rem;font-weight:600;cursor:pointer;font-variant-numeric:lining-nums}
#lock .kp button:active{background:var(--am);color:#2a1d05}
#lock.shake .dots{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- الماسح ---------- */
#scanbox{width:100%;min-height:290px;border-radius:var(--r2);overflow:hidden;background:#000;position:relative}
#scanbox video{width:100%!important;height:auto!important;border-radius:var(--r2)}
#scanbox img{display:none}
.scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:75%;height:42%;border-radius:14px;pointer-events:none;z-index:5}
.scan-frame::before,.scan-frame::after,.scan-frame>.c1,.scan-frame>.c2{content:'';position:absolute;width:36px;height:36px;border:4px solid var(--am)}
.scan-frame::before{top:-2px;right:-2px;border-left:0;border-bottom:0;border-top-right-radius:12px}
.scan-frame::after{top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:12px}
.scan-frame>.c1{bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:12px}
.scan-frame>.c2{bottom:-2px;left:-2px;border-right:0;border-top:0;border-bottom-left-radius:12px}
.scan-line{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72%;height:2px;background:linear-gradient(90deg,transparent,var(--am),transparent);animation:scanline 1.6s ease-in-out infinite;pointer-events:none;z-index:6;box-shadow:0 0 12px var(--am)}
@keyframes scanline{0%,100%{top:32%}50%{top:68%}}
.scan-info{background:linear-gradient(135deg,var(--ink),var(--ink2));color:#fff;border-radius:var(--r2);padding:12px;margin-top:10px;text-align:center;display:none}
.scan-info b{color:var(--am);font-size:1.15rem;display:block;margin-top:4px}
.scan-info .price{color:#9fe6b4;font-weight:700;font-size:1.3rem;margin-top:6px;display:block}

/* ---------- الشاشة الرئيسية: أزرار كبيرة + بطاقات الخدمات ---------- */
.pa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.pa a{display:flex;align-items:center;gap:11px;padding:13px 11px;border-radius:var(--r3);color:#fff;cursor:pointer;min-height:78px;min-width:0;box-shadow:0 6px 16px rgba(20,40,59,.14);transition:transform .12s}
.pa a:active{transform:scale(.97)}
.pa i{flex:none;width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:1.7rem}
.pa div{min-width:0}
.pa b{display:block;font-size:1.02rem;line-height:1.3;font-weight:700}
.pa small{display:block;color:rgba(255,255,255,.86);font-size:.7rem;font-weight:500}
.pa .a1{background:linear-gradient(135deg,#f4a93a,#e8862b);color:#2a1d05}.pa .a1 small{color:rgba(42,29,5,.75)}
.pa .a2{background:linear-gradient(135deg,#e5484d,#c4292f)}
.pa .a3{background:linear-gradient(135deg,#1f9d6b,#127048)}
.pa .a4{background:linear-gradient(135deg,#2e6a9e,#1f4466)}
@media (max-width:350px){.pa a{gap:8px;padding:12px 8px}.pa i{width:40px;height:40px;font-size:1.4rem;border-radius:13px}.pa b{font-size:.92rem}}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.svc a{background:var(--c);border:1px solid var(--bd);border-radius:var(--r3);padding:14px 6px 12px;text-align:center;cursor:pointer;position:relative;min-width:0;box-shadow:var(--sh);transition:transform .12s}
.svc a:active{transform:scale(.96)}

/* حفظ ذري: كل عملية مالية تُكتب دفعة واحدة أو لا تُكتب — ولا ينتظر الإنترنت */
async function commit(ops){
  await Promise.race([fbReady(),sleep(8000).then(()=>{throw new Error('الخدمة لم تُحمَّل بعد — تحقق من الإنترنت')})]);
  const run=()=>{const b=L.writeBatch(L.db);for(const o of ops){if(o.del)b.delete(R(o.del));else if(o.merge)b.set(R(o.ref),M(o.data),{merge:true});else b.set(R(o.ref),M(o.data))}return b.commit()};
  const report=e=>{console.error(e);toast('تعذّرت المزامنة: '+(e.code||e.message||''))};
  let p=run(),timedOut=false;
  if(!navigator.onLine){p.catch(report);return}
  try{await Promise.race([p,sleep(1500).then(()=>{timedOut=true})])}
  catch(e){
    if(/INTERNAL|UNAVAILABLE/i.test(String(e.message||e.code||''))){await sleep(900);p=run();await Promise.race([p,sleep(1500).then(()=>{timedOut=true})])}
    else throw e;
  }
  if(timedOut)p.catch(report);
}

const playScanSound=()=>{
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!window._ac)window._ac=new AC();
    const ctx=window._ac;if(ctx.state==='suspended')ctx.resume();
    const now=ctx.currentTime,master=ctx.createGain();master.gain.value=0.9;master.connect(ctx.destination);
    [[1046.5,0],[1318.5,0.05],[1568,0.1],[2093,0.15]].forEach(([freq,delay])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(freq,now+delay);
      g.gain.setValueAtTime(0,now+delay);g.gain.linearRampToValueAtTime(0.14,now+delay+0.008);
      g.gain.exponentialRampToValueAtTime(0.001,now+delay+0.32);
      o.connect(g);g.connect(master);o.start(now+delay);o.stop(now+delay+0.35);
    });
    const o2=ctx.createOscillator(),g2=ctx.createGain();
    o2.type='triangle';o2.frequency.setValueAtTime(523.25,now);o2.frequency.exponentialRampToValueAtTime(1046.5,now+0.22);
    g2.gain.setValueAtTime(0.09,now);g2.gain.exponentialRampToValueAtTime(0.001,now+0.4);
    o2.connect(g2);g2.connect(master);o2.start(now);o2.stop(now+0.45);
    if(navigator.vibrate)navigator.vibrate([25,40,35]);
  }catch(e){}
};

const bioHas=()=>{try{return !!localStorage.bio}catch(e){return false}};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const b64u=b=>b64(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function bioAvailable(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function bioEnable(){
  if(!pinOn())return toast('فعّل رمز القفل أولاً ثم البصمة');
  if(!(await bioAvailable()))return toast('جهازك أو متصفحك لا يدعم البصمة، أو لم تُسجَّل بصمة في الجهاز');
  try{
    const nm=S.settings.name||'user';
    const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Dyouni Soft',id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:nm,displayName:nm},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
    localStorage.bio=b64(cred.rawId);toast('👆 تم تفعيل البصمة');if(S.view==='settings')settingsView();
  }catch(e){console.warn('bio',e);toast(e&&e.name==='NotAllowedError'?'أُلغيت العملية':'تعذّر تفعيل البصمة')}
}
async function bioAuth(){
  try{
    const ch=crypto.getRandomValues(new Uint8Array(32));
    const a=await navigator.credentials.get({publicKey:{challenge:ch,rpId:location.hostname,userVerification:'required',timeout:60000,
      allowCredentials:[{type:'public-key',id:unb64(localStorage.bio),transports:['internal']}]}});
    if(!a)return false;
    const cd=JSON.parse(new TextDecoder().decode(a.response.clientDataJSON));
    return cd.type==='webauthn.get'&&cd.challenge===b64u(ch);
  }catch(e){return false}

  return new Promise(res=>{
    S.locked=true;const el=$('#lock');el.style.display='flex';let v='',busy=false,fails=0;
    const unlock=()=>{el.style.display='none';S.locked=false;res()};
    const bioGo=async()=>{if(!bioHas()||busy)return;if(await bioAuth())unlock()};
    const draw=()=>{el.innerHTML=`<img class="lg" src="icon-192.png" alt=""><h2>${esc(S.settings.name)}</h2><small id="lkm">أدخل رمز القفل</small>
      <div class="dots">${[0,1,2,3].map(i=>`<i class="${i<v.length?'on':''}"></i>`).join('')}</div>
      <div class="kp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div>
      ${bioHas()?'<button class="btn o" id="lkb" style="margin-top:12px">👆 فتح بالبصمة</button>':''}
      <a id="lkf" style="font-size:.8rem;margin-top:14px;cursor:pointer;color:var(--m)">نسيت الرمز؟</a><small style="margin-top:18px;direction:ltr">Eng. Waseem Al-Hadrani</small>`;
      el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));if($('#lkb'))$('#lkb').onclick=bioGo;
      $('#lkf').onclick=async()=>{if(!confirm('نسيت الرمز؟ سيتم تسجيل الخروج ومسح النسخة المحلية من هذا الجهاز (بياناتك محفوظة على السيرفر).'))return;
        el.style.display='none';S.locked=false;
        try{await fbReady();await L.signOut(L.auth)}catch(e){await wipeLocal();render()}res()}};
    const press=async k=>{if(busy)return;if(k==='⌫')v=v.slice(0,-1);else if(v.length<4)v+=k;draw();
      if(v.length===4){busy=true;const ok=(await hashPin(v,localStorage.pins||''))===localStorage.pinh;
        if(ok){el.style.display='none';S.locked=false;res();return}
        fails++;el.classList.add('shake');navigator.vibrate&&navigator.vibrate(120);
        setTimeout(async()=>{el.classList.remove('shake');v='';busy=false;draw();
          const m=$('#lkm');if(m)m.textContent='الرمز غير صحيح';
          if(fails>=5){busy=true;for(let s=30;s>0;s--){const mm=$('#lkm');if(mm)mm.textContent='محاولات كثيرة — انتظر '+s+' ث';await sleep(1000)}fails=0;busy=false;const mm=$('#lkm');if(mm)mm.textContent='أدخل رمز القفل'}},380)}};
    draw();if(bioHas())setTimeout(bioGo,450);
  });
}

/* العمليات: دين / دفعة مع الرصيد بعد كل عملية */
function opsHTML(txs,b,cu){
  let run=b;
  const D=sum(txs.filter(l=>l.dir==='out'),l=>l.amount),P=sum(txs.filter(l=>l.dir==='in'),l=>l.amount);
  const rows=txs.map(l=>{
    const out=l.dir==='out',can=(l.type==='debt'||l.type==='payment')&&!l.ref,after=run;run-=out?l.amount:-l.amount;
    const kind=l.type==='return'?'مرتجع':out?(cu?'دين':'مشتريات'):'دفعة';
    return `<div class="tx" style="align-items:flex-start"><div style="min-width:0"><span class="badge ${out?'due':'cash'}">${kind}</span> <b style="font-size:.86rem">${esc(l.label||kind)}</b><br><small>${dt(l.ts)}${l.note?' · '+esc(l.note):''}${l.edited?' · ✏️ معدّل':''}</small><br><small>الرصيد بعدها: <b>${n2(after)}</b></small></div><div style="text-align:left;flex:none"><b class="${out?'due':'ok'}" style="font-size:1.02rem">${out?'+':'−'}${n2(l.amount)}</b>${can?`<br><a class="btn g sm" data-edtx="${l.id}">✏️</a> <a class="btn g sm" data-deltx="${l.id}">🗑</a>`:''}</div></div>`}).join('');

async function delTx(l,ent,kind){
  if(!l||!confirm('حذف هذه الحركة ('+n2(l.amount)+')؟ سيُعاد احتساب الرصيد.'))return;
  try{
    const delta=l.dir==='out'?-l.amount:l.amount;
    const col=kind==='customer'?'accounts':'suppliers';
    await commit([DEL(doc(db,'ledger',l.id)),SET(doc(db,col,ent.id),{balance:increment(delta)},true)]);
    okMsg('تم حذف الحركة');
  }catch(err){console.error(err);toast('تعذّر الحذف: '+(err.code||err.message||''));}
}

/* ===== تعديل دين/دفعة (المبلغ، التاريخ، الملاحظة) — ذرّي: يحذف القديم وينشئ المعدّل ويصحّح الرصيد ===== */
function editTx(l,ent,kind){
  if(!l)return;
  const isDebt=l.type==='debt',cust=kind==='customer';
  modal(`<h2>✏️ تعديل ${isDebt?'الدين':'الدفعة'}</h2><small>${esc(ent.name)} · الرصيد الحالي ${fmt(ent.balance||0)}</small>
  <label>المبلغ</label><input id="eam" type="number" inputmode="decimal" value="${l.amount}">
  <label>التاريخ</label><input id="edt" type="date" value="${ldate(l.ts)}">
  <label>ملاحظة</label><input id="eno" value="${esc(l.note||'')}">
  <div class="card" id="epv" style="font-size:.82rem;margin:8px 0"></div>${btns('حفظ التعديل')}`);
  const pv=()=>{const a=Number($('#eam').value)||0,d=isDebt?a-l.amount:-(a-l.amount);$('#epv').innerHTML=d===0?'لا تغيير في الرصيد':`الرصيد سيصبح <b class="${(ent.balance||0)+d>0?'due':'ok'}">${fmt((ent.balance||0)+d)}</b> (${d>0?'+':''}${n2(d)})`};
  $('#eam').oninput=pv;pv();
  $('#modalBox #sv').onclick=async()=>{
    const amt=Number($('#eam').value);if(!(amt>0))return toast('أدخل مبلغاً صحيحاً');
    const dv=$('#edt').value;let ts=l.ts;
    if(dv&&dv!==ldate(l.ts)){const o=new Date(l.ts),d=new Date(dv+'T00:00:00');d.setHours(o.getHours(),o.getMinutes(),o.getSeconds());ts=d.getTime()}
    const delta=isDebt?(amt-l.amount):-(amt-l.amount);
    const bn=$('#modalBox #sv');bn.disabled=true;bn.textContent='جارٍ الحفظ...';
    try{
      const{id,...rest}=l,col=cust?'accounts':'suppliers';
      const nd={...rest,amount:amt,ts,note:$('#eno').value.trim(),cash:isDebt?0:(cust?amt:-amt),edited:true,editedAt:Date.now(),oldAmount:l.amount};
      const ops=[DEL(doc(db,'ledger',l.id)),SET(newLedgerRef(),nd)];
      if(delta!==0)ops.push(SET(doc(db,col,ent.id),{balance:increment(delta)},true));
      await commit(ops);closeModal();okMsg('✅ تم تعديل الحركة');
    }catch(e){console.error(e);toast('تعذّر التعديل: '+(e.code||e.message||''));bn.disabled=false;bn.textContent='حفظ التعديل'}
  };
}

/* ===== كشف حساب بفترة: من تاريخ إلى تاريخ ===== */
function stmtView(){
  const id=S.stId,cu=!!S.customers.find(x=>x.id===id),e=(cu?S.customers:S.suppliers).find(x=>x.id===id);
  if(!e)return go('customers',null,true);
  const now=new Date(),key=cu?'accountId':'supplierId';
  if(!S.stFrom)S.stFrom=ldate(new Date(now.getFullYear(),now.getMonth(),1));
  if(!S.stTo)S.stTo=ldate(now.getTime());
  let fromD=S.stFrom,toD=S.stTo;if(fromD>toD){[fromD,toD]=[toD,fromD]}
  const from=dayStart(fromD),to=dayEnd(toD);
  const all=S.ledger.filter(l=>l[key]===id).sort((a,b)=>a.ts-b.ts);
  const signed=l=>l.dir==='out'?l.amount:-l.amount;
  const open=sum(all.filter(l=>l.ts<from),signed);
  const inP=all.filter(l=>l.ts>=from&&l.ts<=to);
  const debts=sum(inP.filter(l=>l.dir==='out'),l=>l.amount),pays=sum(inP.filter(l=>l.dir==='in'),l=>l.amount);
  const net=debts-pays,close=open+net;
  let run=open;const rows=inP.map(l=>{run+=signed(l);return{l,run}});
  const W1=cu?'ديون مسجّلة':'مشتريات',W2=cu?'المسدَّد':'المدفوع';
  const y=now.getFullYear(),m=now.getMonth();
  const presets=[['هذا الشهر',new Date(y,m,1),now],['الشهر الماضي',new Date(y,m-1,1),new Date(y,m,0)],['1 – 15',new Date(y,m,1),new Date(y,m,15)],['16 – نهاية الشهر',new Date(y,m,16),new Date(y,m+1,0)],['آخر 7 أيام',new Date(now.getTime()-6*864e5),now],['الكل',new Date(2000,0,1),now]];
  A.innerHTML=`<div class="top"><button class="btn g sm" id="bk">→ رجوع</button><h1>📅 كشف بفترة</h1><span></span></div>
  <div class="card"><b>${esc(e.name)}</b>
  <div class="g2" style="margin-top:6px"><div><label>من تاريخ</label><input id="sf" type="date" value="${fromD}"></div><div><label>إلى تاريخ</label><input id="st2" type="date" value="${toD}"></div></div>
  <div class="chips" style="margin-top:6px">${presets.map(([n],i)=>`<div class="chip" data-pr="${i}">${n}</div>`).join('')}</div></div>
  <div class="hero" style="text-align:center"><small>إجمالي ${W1} في الفترة</small><div class="big">${fmt(debts)}</div>
  <div class="g3"><div class="mini"><small>${W2}</small><b>${n2(pays)}</b></div><div class="mini"><small>صافي الفترة</small><b>${net>0?'+':''}${n2(net)}</b></div><div class="mini"><small>عدد الحركات</small><b>${inP.length}</b></div></div></div>
  <div class="card"><table><tr><td>الرصيد قبل ${dOnly(from)}</td><td><b>${fmt(open)}</b></td></tr><tr><td>+ ${W1}</td><td class="due"><b>${fmt(debts)}</b></td></tr><tr><td>− ${W2}</td><td class="ok"><b>${fmt(pays)}</b></td></tr>
  <tr><td><b>الرصيد في ${dOnly(to)}</b></td><td class="${close>0?'due':'ok'}"><b>${fmt(close)}</b></td></tr></table></div>
  <div class="row" style="gap:8px"><button class="btn o w sm" id="sp">📄 PDF</button><button class="btn gr w sm" id="sw2">📱 إرسال بواتساب</button></div>
  <div class="sec">حركات الفترة (${inP.length})</div>
  <div class="card">${rows.map(({l,run})=>`<div class="tx"><div><b style="font-size:.86rem">${esc(l.label||l.type)}</b><br><small>${dt(l.ts)}${l.note?' · '+esc(l.note):''}</small></div><div style="text-align:left"><b class="${l.dir==='in'?'ok':'due'}">${l.dir==='in'?'-':'+'}${n2(l.amount)}</b><br><small>الرصيد ${n2(run)}</small></div></div>`).join('')||'<p class="hint">لا توجد حركات في هذه الفترة</p>'}</div>`;
  $('#bk').onclick=back;
  $('#sf').onchange=ev=>{S.stFrom=ev.target.value||S.stFrom;stmtView()};
  $('#st2').onchange=ev=>{S.stTo=ev.target.value||S.stTo;stmtView()};
  A.querySelectorAll('[data-pr]').forEach(c=>c.onclick=()=>{const p=presets[+c.dataset.pr];S.stFrom=ldate(p[1]);S.stTo=ldate(p[2]);stmtView()});
  $('#sp').onclick=()=>exportPDF('كشف حساب بفترة - '+e.name,
    `<p style="font-size:13px;margin-bottom:8px"><b>الفترة:</b> من ${fromD} إلى ${toD}</p>`+
    `<table border="1" cellspacing="0" cellpadding="6" style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px"><tr><td>الرصيد قبل الفترة</td><td>${fmt(open)}</td></tr><tr><td>${W1}</td><td>${fmt(debts)}</td></tr><tr><td>${W2}</td><td>${fmt(pays)}</td></tr><tr style="font-weight:bold"><td>الرصيد في نهاية الفترة</td><td>${fmt(close)}</td></tr></table>`+
    tbl(['التاريخ','البيان','ملاحظة','المبلغ','الرصيد'],rows.map(({l,run})=>`<tr><td>${dOnly(l.ts)}</td><td>${esc(l.label)}</td><td>${esc(l.note||'')}</td><td style="color:${l.dir==='in'?'#1f9d6b':'#e5484d'}">${l.dir==='in'?'-':'+'}${n2(l.amount)}</td><td>${n2(run)}</td></tr>`).join('')));
  $('#sw2').onclick=()=>{
    const cur=S.settings.currency,txt=`📅 كشف حسابك من ${fromD} إلى ${toD}\n\nالرصيد قبل الفترة: ${n2(open)} ${cur}\n${W1}: *${n2(debts)} ${cur}*\n${W2}: ${n2(pays)} ${cur}\n*الرصيد في نهاية الفترة: ${n2(close)} ${cur}*`;
    if(!e.phone)return toast('لا يوجد رقم هاتف مسجل');whatsappSend(e.phone,e.name,txt)};
}

      m+=`📊 إجمالي حسابك الحالي: ${newB} ${cur}\n📅 التاريخ: ${now.toLocaleDateString('ar-EG')} - ${now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}\n\n`+(isDebt?'شكراً لثقتكم بنا 🌹':'شكراً لالتزامكم بالسداد 💚');
      if(isCust&&navigator.onLine&&window.notifyCustomer)try{window.notifyCustomer(ent.id,m,S.settings.name)}catch(e){}

    }catch(e){console.error(e);if($('#err')){$('#err').textContent='فشل: '+(e.code||e.message||'خطأ');$('#err').style.display='block'}svBtn.disabled=false;svBtn.textContent='تأكيد'}};
}

function productForm(p,presetBarcode,dr){
  const e=!!p,DEF=['باكت','كرتون'],ex=(p?.units||[]).filter(u=>u&&u.name&&Number(u.factor)>1),used=new Set(ex.map(u=>u.name));
  const lv=[{name:p?.unit||'حبة',factor:1,price:Number(p?.price)||0}];
  [0,1].forEach(k=>{const x=ex[k];if(x)lv.push({name:x.name,factor:Number(x.factor),price:Number(x.price)||0});else{const n=DEF.find(n=>!used.has(n))||'وحدة';used.add(n);lv.push({name:n,factor:0,price:0})}});
  const st=Math.max(0,Number(p?.stock)||0),lo=Math.min(Math.max(0,Number(p?.loose)||0),st);let sl=st-lo;const qt=[0,0,0];
  lv.map((u,i)=>({u,i})).filter(x=>x.i&&x.u.factor>1).sort((a,b)=>b.u.factor-a.u.factor).forEach(({u,i})=>{const n=Math.floor(sl/u.factor+1e-9);qt[i]=n;sl-=n*u.factor});qt[0]=sl+lo;
  const row=k=>`<div style="display:grid;grid-template-columns:.9fr .8fr 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px"><b style="font-size:.85rem">${esc(lv[k].name)}</b>${k?`<input id="lf${k}" type="number" inputmode="decimal" placeholder="كم حبة" value="${lv[k].factor||''}" style="margin:0">`:'<small style="text-align:center">1</small>'}<input id="lp${k}" type="number" inputmode="decimal" placeholder="السعر" value="${lv[k].price||''}" style="margin:0"><input id="lq${k}" type="number" inputmode="decimal" placeholder="الكمية" value="${qt[k]||''}" style="margin:0"></div>`;
  modal(`<h2>${e?'تعديل منتج':'منتج جديد'}</h2><label>اسم المنتج *</label><input id="n" value="${esc(p?.name||'')}">
  <label>الباركود (اختياري)</label>

    <div style="display:grid;grid-template-columns:.9fr .8fr 1fr 1fr;gap:6px;margin-bottom:4px"><small></small><small>كم حبة؟</small><small>سعر البيع</small><small>الكمية</small></div>
    ${[0,1,2].map(row).join('')}
    <label>تنبيه عند بقاء أقل من (حبة)</label><input id="mn" type="number" inputmode="decimal" value="${p?.min??0}" style="margin:0">
  </div>
  <label>تاريخ الانتهاء (اختياري)</label><input id="ex" type="date" value="${esc(p?.exp||'')}">
  ${btns()}${e?delBtn:''}`);
  if(dr)Object.entries(dr).forEach(([id,v])=>{const el=$('#'+id);if(el&&id!=='bc')el.value=v});
  if(presetBarcode)$('#bc').value=presetBarcode;

    window.openScanner(code=>productForm(p,code,d),'📷 امسح الباركود',()=>productForm(p,null,d))};
  $('#sv').onclick=async()=>{
    const name=$('#n').value.trim();if(!name)return toast('اكتب الاسم');
    const g=id=>Number($(id).value)||0,pr0=g('#lp0');
    const units=[1,2].map(k=>({name:lv[k].name,factor:g('#lf'+k),price:g('#lp'+k),q:g('#lq'+k)})).filter(u=>u.factor>1);

  };
}

/* ترحيل الفاتورة (ذري): الفاتورة + المخزون + الحركات المالية + الرصيد */
function invoiceOps(kind,o){
  const sl=kind==='sale',due=Math.round((o.total-o.paid)*100)/100,idf=sl?'accountId':'supplierId',pc=sl?'accounts':'suppliers';
  const ref=doc(collection(db,sl?'sales':'purchases'));
  const rec={owner:S.user.uid,ts:Date.now(),[sl?'customerId':'supplierId']:o.pid||null,[sl?'customerName':'supplierName']:o.p?.name||(sl?'عميل نقدي':'مورد نقدي'),
    items:o.items.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price,unit:i.unit||'',factor:i.factor||1})),total:o.total,paid:o.paid,due};
  const ops=[SET(ref,rec)];NOOPEN.clear();
  for(const i of o.items){
    if(i.noStock||!S.products.find(x=>x.id===i.id))continue;
    const f=i.factor||1;
    const pr=S.products.find(x=>x.id===i.id),lo=Number(pr.loose)||0,dl=f===1?(sl?-i.qty:i.qty):0;
    ops.push(SET(doc(db,'products',i.id),{...(sl?{stock:increment(-i.qty*f)}:{stock:increment(i.qty*f),cost:i.price/f}),...(dl?{loose:Math.max(0,lo+dl)}:{})},true));
  }
  if(o.paid>0)ops.push(SET(newLedgerRef(),ledgerData(sl?'sale':'purchase',sl?'فاتورة بيع':'فاتورة شراء',o.paid,sl?'in':'out',sl?o.paid:-o.paid,{ref:ref.id})));
  if(due>0){
    ops.push(SET(newLedgerRef(),ledgerData(sl?'sale':'purchase',sl?'فاتورة بيع آجل':'فاتورة شراء آجل',due,'out',0,{[idf]:o.pid,ref:ref.id})));
    ops.push(SET(doc(db,pc,o.pid),{balance:increment(due)},true));
  }
  return{ops,id:ref.id,rec};
}


/* ===== وحدات البيع (حبة / كرتون ...) ===== */
const unitLbl=n=>'بال'+String(n||'').replace(/^ال/,'');
const rk=i=>(i.id||i.name)+(i.unit?'|'+i.unit:'');
function unitsOf(p){
  return [{name:p.unit||'حبة',factor:1,price:Number(p.price)||0,cost:Number(p.cost)||0},
    ...(p.units||[]).filter(u=>u&&u.name&&Number(u.factor)>1).map(u=>({name:u.name,factor:Number(u.factor),price:Number(u.price)||Number(u.factor)*(Number(p.price)||0),cost:(Number(p.cost)||0)*Number(u.factor)}))];
}

/* ===== تفصيل المخزون + فتح كرتون/باكت جديد ===== */
const NOOPEN=new Set();
function stockParts(p){
  const st=Math.max(0,Number(p.stock)||0),lo=Math.min(Math.max(0,Number(p.loose)||0),st);
  let sealed=st-lo;const out=[];
  unitsOf(p).slice(1).sort((a,b)=>b.factor-a.factor).forEach(u=>{const n=Math.floor(sealed/u.factor+1e-9);if(n>0){out.push(n2(n)+' '+u.name);sealed-=n*u.factor}});
  const pcs=sealed+lo;if(pcs>0||!out.length)out.push(n2(pcs)+' '+(p.unit||'حبة'));
  return out.join(' + ');
}
function cartBase(p){return sum(S.cart.filter(x=>x.id===p.id&&(x.factor||1)===1),x=>x.qty)}
function needOpen(p,extra){
  if(NOOPEN.has(p.id))return null;
  const us=unitsOf(p).slice(1);if(!us.length)return null;
  const st=Number(p.stock)||0,lo=Math.min(Math.max(0,Number(p.loose)||0),st);
  if(lo>=cartBase(p)+extra)return null;
  const o=us.filter(u=>st-lo>=u.factor).sort((a,b)=>a.factor-b.factor);
  return o.length?o:null;
}
function askOpen(p,extra,done){
  const old=$('#openBar');if(old)old.remove();
  const o=needOpen(p,extra);if(!o){done();return}
  const base=p.unit||'حبة',lo=Math.min(Math.max(0,Number(p.loose)||0),Number(p.stock)||0);
  const bar=document.createElement('div');bar.id='openBar';
  bar.style.cssText='position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(16px + env(safe-area-inset-bottom))';
  bar.innerHTML=`<div style="width:100%;max-width:496px;background:var(--c);color:var(--t);border-radius:18px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.3)"><b>📦 ${esc(p.name)}</b><div style="margin:6px 0 10px;font-size:.9rem">الكمية المفتوحة (${esc(base)}) انتهت — المتبقي ${n2(lo)}. هل تريد فتح جديد؟</div>${o.map((u,x)=>`<button class="btn w" data-op="${x}" style="margin-bottom:8px">فتح ${esc(u.name)} جديد (+${n2(u.factor)} ${esc(base)})</button>`).join('')}<button class="btn o w" id="opNo">لا، متابعة بدون فتح</button></div>`;
  document.body.appendChild(bar);
  $('#opNo').onclick=()=>{NOOPEN.add(p.id);bar.remove();done()};
  bar.querySelectorAll('[data-op]').forEach(e=>e.onclick=async()=>{
    const u=o[+e.dataset.op];p.loose=lo+u.factor;bar.remove();
    try{await commit([SET(doc(db,'products',p.id),{loose:p.loose},true)])}catch(err){console.error(err);toast('تعذّر حفظ الفتح')}
    askOpen(p,extra,done)});
}
function cartPush(p,u,qty,price){
  qty=qty||1;price=price!=null?price:u.price;
  const ex=S.cart.find(x=>x.id===p.id&&(x.unit||'')===u.name&&!x.noStock);
  if(ex)ex.qty+=qty;
  else S.cart.push({id:p.id,name:p.name,qty,price,unit:u.name,factor:u.factor,addedAt:Date.now()});
}
function pickUnit(p,done){

async function voidInvoice(inv,isSale,rets){
  if(rets.length)return toast('لا يمكن إلغاء فاتورة لها مرتجعات');
  if(!confirm('إلغاء الفاتورة نهائياً؟\nسيُعاد المخزون وتُعكس الحركات المالية والرصيد.'))return;
  try{
    const ops=[DEL(doc(db,isSale?'sales':'purchases',inv.id))];
    S.ledger.filter(l=>l.ref===inv.id).forEach(l=>ops.push(DEL(doc(db,'ledger',l.id))));
    (inv.items||[]).forEach(i=>{if(i.id&&S.products.find(p=>p.id===i.id))ops.push(SET(doc(db,'products',i.id),{stock:increment((isSale?i.qty:-i.qty)*(i.factor||1))},true))});
    const pid=isSale?inv.customerId:inv.supplierId,pc=isSale?'accounts':'suppliers';
    if((inv.due||0)>0&&pid&&(isSale?S.customers:S.suppliers).find(x=>x.id===pid))ops.push(SET(doc(db,pc,pid),{balance:increment(-inv.due)},true));
    await commit(ops);toast('تم إلغاء الفاتورة');go(isSale?'sales':'purchases',null,true);
  }catch(e){console.error(e);toast('تعذّر الإلغاء: '+(e.code||e.message||''))}
}
function returnForm(inv,isSale,retQty){

  const pid=isSale?inv.customerId:inv.supplierId,party=(isSale?S.customers:S.suppliers).find(x=>x.id===pid);
  modal(`<h2>↩️ مرتجع من الفاتورة</h2>
  ${items.map((i,x)=>`<div class="tx"><div><b>${esc(i.name)}${i.unit?' ('+esc(unitLbl(i.unit))+')':''}</b><br><small>${n2(i.price)} · المتاح للإرجاع ${n2(i.left)}</small></div><input type="number" inputmode="decimal" min="0" max="${i.left}" data-rq="${x}" placeholder="0" style="width:80px;margin:0;text-align:center"></div>`).join('')}
  <label>طريقة التسوية</label><select id="rmode">${party?`<option value="bal">${isSale?'خصم من دين العميل':'خصم من مستحق المورد'}</option>`:''}<option value="cash">${isSale?'رد نقدي للعميل':'استلام نقد من المورد'}</option></select>
  <div class="card row"><span>قيمة المرتجع</span><b id="rtot">0</b></div>${btns('تأكيد المرتجع')}`);
  const pick=()=>{const out=[];$('#modalBox').querySelectorAll('[data-rq]').forEach(e=>{const i=items[+e.dataset.rq],q=Math.min(Number(e.value)||0,i.left);if(q>0)out.push({id:i.id||'',name:i.name,qty:q,price:i.price,unit:i.unit||'',factor:i.factor||1})});return out};
  $('#modalBox').querySelectorAll('[data-rq]').forEach(e=>e.oninput=()=>{$('#rtot').textContent=fmt(sum(pick(),r=>r.qty*r.price))});
  $('#sv').onclick=async()=>{
    const sel=pick();if(!sel.length)return toast('حدّد كمية للإرجاع');
    const amount=sum(sel,r=>r.qty*r.price),mode=$('#rmode').value,bn=$('#sv');bn.disabled=true;bn.textContent='جارٍ الحفظ...';
    try{
      const ops=[],lbl='مرتجع فاتورة #'+(inv.id||'').slice(-6).toUpperCase(),base={ref:inv.id,rk:isSale?'sale':'purchase',ritems:sel};
      sel.forEach(r=>{if(r.id&&S.products.find(p=>p.id===r.id))ops.push(SET(doc(db,'products',r.id),{stock:increment((isSale?r.qty:-r.qty)*(r.factor||1))},true))});
      if(mode==='bal'){

        ops.push(SET(doc(db,isSale?'accounts':'suppliers',pid),{balance:increment(-amount)},true));
      }else ops.push(SET(newLedgerRef(),ledgerData('return',lbl,amount,isSale?'out':'in',isSale?-amount:amount,base)));
      await commit(ops);closeModal();okMsg('✅ تم تسجيل المرتجع');
    }catch(e){console.error(e);toast('تعذّر: '+(e.code||e.message||''));bn.disabled=false;bn.textContent='تأكيد المرتجع'}
  };
}

async function saveInv(kind){
  if(!S.cart.length)return toast('أضف أصنافاً');
  const sl=kind==='sale',pid=$('#party').value,p=(sl?S.customers:S.suppliers).find(x=>x.id===pid);
  const total=sum(S.cart,i=>i.qty*i.price),paid=Math.max(0,Math.min(Number($('#paid').value)||0,total)),due=total-paid;
  if(due>0&&!p)return toast(sl?'اختر عميلاً للبيع الآجل':'اختر مورداً للشراء الآجل');
  const svBtn=$('#save');svBtn.disabled=true;svBtn.textContent='جارٍ الحفظ...';
  try{
    const inv=invoiceOps(kind,{pid,p,items:S.cart,total,paid});
    await commit(inv.ops);
    S.formOpen=false;
    const savedCart=[...S.cart],savedTotal=total,savedPaid=paid,savedDue=due,savedParty=p;
    S.cart=[];okMsg('✅ تم حفظ الفاتورة');
    setTimeout(()=>go('invoice',inv.id,true),200);
    if(sl && savedParty && savedParty.phone && AUTO_WA){
      const newBalance=Number(savedParty.balance||0)+savedDue;
      const msg=`فاتورة جديدة 🧾\n${savedCart.map(i=>`• ${i.name} × ${i.qty} = ${n2(i.qty*i.price)}`).join('\n')}\n\n*الإجمالي:* ${n2(savedTotal)} ${S.settings.currency}\n${savedPaid>0?`*المدفوع نقداً:* ${n2(savedPaid)}\n`:''}${savedDue>0?`*المتبقي (آجل):* ${n2(savedDue)}\n*رصيدك الحالي:* ${n2(newBalance)}\n`:''}\nشكراً لتعاملك معنا 🌹`;
      setTimeout(()=>{
        modal(`<h2>📱 إشعار واتساب</h2><p style="margin:8px 0;font-size:.9rem;color:var(--m)">إرسال إشعار إلى <b>${esc(savedParty.name)}</b>؟</p>
        <div class="card" style="font-size:.82rem;white-space:pre-wrap;max-height:35vh;overflow:auto">${esc(msg)}</div>
        <div class="row"><button class="btn o w" onclick="closeModal()">لاحقاً</button><button class="btn gr w" id="wa-go">📱 إرسال</button></div>`);
        $('#wa-go').onclick=()=>{whatsappSend(savedParty.phone,savedParty.name,msg);closeModal()};
      },1000);
    }
  }catch(err){console.error(err);toast('فشل حفظ الفاتورة: '+(err.code||err.message||''));if($('#save')){svBtn.disabled=false;svBtn.textContent='💾 حفظ الفاتورة'}}
}

/* ===== جرد المخزون (عدّ فعلي وتسوية) ===== */
function stockTake(){
  const P=S.products.slice().sort((a,b)=>a.name.localeCompare(b.name)),TK={};

    $('#tk').innerHTML=P.filter(p=>!q||p.name.toLowerCase().includes(q)||(p.barcode||'').includes(q)).map(p=>`<div style="padding:8px 0;border-bottom:1px solid var(--bd2)"><b>${esc(p.name)}</b> <small>الحالي: ${esc(stockParts(p))}</small><div style="display:flex;gap:6px;margin-top:6px">${lv(p).map(u=>`<input type="number" inputmode="decimal" data-k="${p.id}|${u.factor}" placeholder="${esc(u.name)}" value="${TK[p.id+'|'+u.factor]??''}" style="margin:0;text-align:center">`).join('')}</div></div>`).join('')||'<p class="hint">لا توجد منتجات</p>';

  $('#tkok').onclick=async()=>{
    const ch=[];
    P.forEach(p=>{const us=lv(p);if(!us.some(u=>String(TK[p.id+'|'+u.factor]??'')!==''))return;
      const tot=sum(us,u=>(Number(TK[p.id+'|'+u.factor])||0)*u.factor),pcs=Number(TK[p.id+'|1'])||0,cur=Number(p.stock)||0;

/* ===== تقارير المخزون (مثل MicroPOS) ===== */
function stockRep(){
  const R=[['inv','جرد'],['avail','المتوفرة'],['out','النافذة'],['low','قارب النفاد'],['sell','بسعر البيع'],['buy','بسعر الشراء'],['exp','الصلاحية'],['dead','الراكدة'],['ph','آخر 10 أسعار شراء']];
  const t=S.srT||'inv',now=Date.now(),td=new Date().toISOString().slice(0,10),lim=new Date(now+30*864e5).toISOString().slice(0,10);
  const sold={},last={};S.sales.forEach(x=>(x.items||[]).forEach(i=>{if(!i.id)return;sold[i.id]=(sold[i.id]||0)+i.qty*(i.factor||1);last[i.id]=Math.max(last[i.id]||0,x.ts)}));
  const st=p=>Number(p.stock)||0,cs=p=>Number(p.cost)||0,P=S.products.slice().sort((a,b)=>a.name.localeCompare(b.name));
  let head=[],rows=[],total=null,sel='';
  if(t==='inv'){head=['المنتج','في المخزن','المباع','التكلفة','الإجمالي'];rows=P.map(p=>[p.name,stockParts(p),n2(sold[p.id]),n2(cs(p)),n2(st(p)*cs(p))]);total=sum(P,p=>st(p)*cs(p))}
  else if(t==='avail'){head=['المنتج','الكمية'];rows=P.filter(p=>st(p)>0).map(p=>[p.name,stockParts(p)])}
  else if(t==='out'){head=['المنتج','الكمية'];rows=P.filter(p=>st(p)<=0).map(p=>[p.name,n2(st(p))])}
  else if(t==='low'){head=['المنتج','الكمية','حد التنبيه'];rows=P.filter(p=>st(p)>0&&st(p)<=(p.min||0)).map(p=>[p.name,stockParts(p),n2(p.min)])}
  else if(t==='sell'){head=['المنتج','الكمية','سعر البيع'];rows=P.map(p=>[p.name,stockParts(p),n2(p.price)])}
  else if(t==='buy'){head=['المنتج','الكمية','سعر الشراء','الإجمالي'];rows=P.map(p=>[p.name,stockParts(p),n2(cs(p)),n2(st(p)*cs(p))]);total=sum(P,p=>st(p)*cs(p))}
  else if(t==='exp'){head=['المنتج','الكمية','الانتهاء','الحالة'];rows=P.filter(p=>p.exp&&p.exp<=lim).sort((a,b)=>a.exp.localeCompare(b.exp)).map(p=>[p.name,stockParts(p),p.exp,p.exp<td?'منتهي':'ينتهي قريباً'])}
  else if(t==='dead'){head=['المنتج','الكمية','آخر بيع','قيمة راكدة'];const D=P.filter(p=>st(p)>0&&(last[p.id]||0)<now-30*864e5);rows=D.map(p=>[p.name,stockParts(p),last[p.id]?dt(last[p.id]):'لم يُبع',n2(st(p)*cs(p))]);total=sum(D,p=>st(p)*cs(p))}
  else{
    const pid=S.srP||(P[0]||{}).id;
    sel=`<select id="srp" style="margin:8px 0">${P.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`;
    head=['التاريخ','المورد','الكمية','السعر'];
    rows=S.purchases.slice().sort((a,b)=>b.ts-a.ts).flatMap(x=>(x.items||[]).filter(i=>i.id===pid).map(i=>[dt(x.ts),x.supplierName||'',n2(i.qty)+' '+(i.unit||''),n2(i.price)])).slice(0,10);
  }
  const label=(R.find(r=>r[0]===t)||[])[1],th=h=>`<th>${h}</th>`;
  const tbl=`<div style="overflow:auto"><table><tr>${head.map(th).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(String(c))}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${head.length}">لا توجد نتائج</td></tr>`}</table></div>`;
  A.innerHTML=`<div class="top"><h1>تقارير المخزون</h1><button class="btn o sm" id="bk2">‹ المخزون</button></div>
  <div class="chips">${R.map(([v,l])=>`<div class="chip ${t===v?'on':''}" data-t="${v}">${l}</div>`).join('')}</div>${sel}
  <div class="card">${tbl}${total!=null?`<div class="row" style="margin-top:10px"><span>الإجمالي</span><b class="blue">${fmt(total)}</b></div>`:''}</div>
  <div class="g2" style="margin-top:10px"><button class="btn o" id="csv">📊 تصدير Excel</button><button class="btn am" id="pdf">📄 PDF</button></div>
  <button class="btn o w" id="stk2" style="margin-top:8px">🧮 جرد المخزون (عدّ فعلي)</button>`;
  A.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{S.srT=e.dataset.t;stockRep()});
  $('#bk2').onclick=()=>go('products');$('#stk2').onclick=()=>go('stocktake');
  if($('#srp'))$('#srp').onchange=e=>{S.srP=e.target.value;stockRep()};
  $('#csv').onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const c='\ufeff'+[head].concat(rows).map(r=>r.map(q).join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv;charset=utf-8'}));a.download='مخزون-'+t+'.csv';a.click()};
  $('#pdf').onclick=()=>exportPDF('تقرير المخزون — '+label,`<table border="1" cellspacing="0" cellpadding="8" style="width:100%;border-collapse:collapse;font-size:13px"><tr style="background:#eef3f0">${head.map(th).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(String(c))}</td>`).join('')}</tr>`).join('')}</table>${total!=null?`<p style="margin-top:10px"><b>الإجمالي: ${fmt(total)}</b></p>`:''}`);
}

function restoreBackup(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;let d;

    const MAP={customers:'accounts',suppliers:'suppliers',products:'products',sales:'sales',purchases:'purchases',expenses:'expenses',ledger:'ledger',employees:'employees'};
    const ops=[],cnt={};
    for(const [k,col] of Object.entries(MAP)){
      const have=new Set((S[k]||[]).map(x=>x.id)),arr=Array.isArray(d[k])?d[k]:[];let n=0;
      for(const x of arr){if(!x||!x.id||have.has(x.id))continue;const{id,...rest}=x;ops.push(SET(doc(db,col,id),{...rest,owner:S.user.uid}));n++}
      cnt[k]=n;
    }
    if(!ops.length)return toast('لا توجد بيانات مفقودة — كل شيء موجود');
    if(!confirm(`سيتم استعادة ${ops.length} سجل مفقود:\nعملاء ${cnt.customers} · موردين ${cnt.suppliers} · منتجات ${cnt.products}\nمبيعات ${cnt.sales} · مشتريات ${cnt.purchases} · مصروفات ${cnt.expenses}\nحركات ${cnt.ledger} · موظفين ${cnt.employees}\n\nمتابعة؟`))return;

/* ===== إشعارات التاجر (تنبيهات من إدارة المنصة) — إضافة مستقلة ===== */
const mnSupported=()=>('Notification' in window)&&('serviceWorker' in navigator)&&('PushManager' in window);
const mnId=()=>{try{return localStorage.mn||''}catch(e){return ''}};
const mnSha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const mnU8=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const mnTO=(p,ms,m)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error(m)),ms))]);
function mnCardHTML(){
  if(!mnSupported())return `<div class="card"><b>🔔 إشعارات المنصة</b><br><small>متصفحك لا يدعم الإشعارات — استخدم Chrome أو Safari حديث</small></div>`;
  const p=Notification.permission,on=p==='granted'&&mnId().startsWith(S.user.uid+'_');
  return `<div class="card"><div class="row"><div><b>🔔 إشعارات المنصة</b><br><small>${on?'مُفعّلة — تصلك تنبيهات وأخبار من إدارة ديوني سوفت':p==='denied'?'محظورة من المتصفح — اضغط 🔒 بجانب الرابط ثم «الإشعارات» ← «السماح»':'تنبيهات وأخبار من إدارة ديوني سوفت'}</small></div>${p==='denied'?'':`<button class="btn ${on?'o':'am'} sm" id="mnb">${on?'إيقاف':'تفعيل'}</button>`}</div></div>`;
}
async function mnEnable(){
  if(!mnSupported())return toast('متصفحك لا يدعم الإشعارات');
  if(/iPad|iPhone|iPod/.test(navigator.userAgent)&&!(matchMedia('(display-mode: standalone)').matches||navigator.standalone===true))
    return alert('لتشغيل الإشعارات على iPhone:\n\n1) اضغط زر المشاركة 📤 في Safari\n2) اختر «إضافة إلى الشاشة الرئيسية»\n3) افتح التطبيق من الأيقونة الجديدة\n4) اضغط «تفعيل» مرة أخرى');
  if(!navigator.onLine)return toast('التفعيل يحتاج اتصالاً بالإنترنت');
  const b=$('#mnb');if(b){b.disabled=true;b.textContent='⏳ جارٍ التفعيل...'}
  try{
    if(Notification.permission!=='granted'){const p=await mnTO(Notification.requestPermission(),15000,'لم تستجب نافذة الإذن');if(p!=='granted')throw new Error('لم يُمنح الإذن')}
    const reg=await mnTO(navigator.serviceWorker.register('sw.js'),10000,'فشل تسجيل Service Worker');
    await mnTO(navigator.serviceWorker.ready,10000,'Service Worker لم يُنشَّط');
    const r=await mnTO(fetch('/api/notify'),10000,'تعذّر الوصول لخادم الإشعارات');
    const{key}=await r.json();if(!key)throw new Error('لم يُرجع الخادم المفتاح');
    let sub=await reg.pushManager.getSubscription();
    if(sub){const cur=sub.options&&sub.options.applicationServerKey;if(cur&&b64u(cur)!==key.replace(/=+$/,'')){try{await sub.unsubscribe()}catch(e){}sub=null}}
    if(!sub)sub=await mnTO(reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:mnU8(key)}),15000,'المتصفح رفض الاشتراك أو تأخر');
    const id=S.user.uid+'_'+(await mnSha(sub.endpoint)).slice(0,32);
    await commit([SET(doc(db,'merchantSubs',id),{owner:S.user.uid,sub:JSON.stringify(sub),ts:Date.now()})]);
    try{localStorage.mn=id}catch(e){}
    toast('✅ تم تفعيل إشعارات المنصة');
  }catch(e){console.error('mn',e);toast('تعذّر التفعيل: '+(e.message||''))}
  if(S.view==='settings')settingsView();
}
async function mnDisable(){
  try{const id=mnId();if(id)await commit([DEL(doc(db,'merchantSubs',id))]);localStorage.removeItem('mn');toast('تم إيقاف إشعارات المنصة')}catch(e){toast('تعذّر الإيقاف')}
  if(S.view==='settings')settingsView();
}
function mnBind(){const b=$('#mnb');if(!b)return;b.onclick=()=>(mnId().startsWith(S.user.uid+'_')&&Notification.permission==='granted')?mnDisable():mnEnable()}

/* PDF */
const PDF_FONT="'IBM Plex Sans Arabic','Tajawal',Tahoma,Arial,sans-serif";
const P={navy:'#14283b',gold:'#f5a53a',line:'#dfe7ee',soft:'#f4f8fb',mut:'#6b7b8a',grn:'#13794f',grnBg:'#e5f6ee',red:'#c0272d',redBg:'#fdecec'};
/* أرقام لاتينية آمنة من اتجاه RTL */
const pNum=n=>`<span dir="ltr" style="unicode-bidi:isolate;display:inline-block">${n2(n)}</span>`;
const pMoney=n=>`${pNum(n)} <span style="font-size:.85em">${esc(S.settings.currency)}</span>`;
const pDate=ts=>{const d=new Date(ts),z=x=>String(x).padStart(2,'0');return `<span dir="ltr" style="unicode-bidi:isolate;display:inline-block">${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())}</span>`};
const pTime=ts=>{const d=new Date(ts);let h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0'),ap=h>=12?'م':'ص';h=h%12||12;return `<span dir="ltr" style="unicode-bidi:isolate;display:inline-block">${h}:${m}</span> ${ap}`};
function exportPDF(title,html,opt){

}
/* جدول: cols=[{h,w,a}] */
const tbl=(h,r,o)=>{o=o||{};const w=o.w||[],al=o.a||[];
  return `<table style="width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;border:1px solid ${P.line}">
  <thead><tr style="background:${P.navy};color:#fff">${h.map((x,i)=>`<th style="padding:10px 8px;font-weight:700;text-align:${al[i]||'right'};box-sizing:border-box;${w[i]?'width:'+w[i]+'px':''}">${x}</th>`).join('')}</tr></thead>
  <tbody>${r||`<tr><td colspan="${h.length}" style="padding:16px;text-align:center;color:${P.mut}">لا توجد حركات</td></tr>`}</tbody></table>`};
const trS=(x,cells)=>`<tr style="background:${x%2?P.soft:'#fff'};page-break-inside:avoid">${cells}</tr>`;
const tdS=(v,st)=>`<td style="padding:9px 8px;border-bottom:1px solid #e8eef3;vertical-align:middle;${st||''}">${v}</td>`;
const pill=(txt,bg,fg)=>`<span style="display:inline-block;background:${bg};color:${fg};font-weight:700;font-size:11.5px;padding:2px 12px;border-radius:20px">${txt}</span>`;

const cards=(arr,mt)=>`<div style="margin:${mt||0}px -8px 12px"><table style="width:100%;border-collapse:separate;border-spacing:8px 0;table-layout:fixed"><tr>${arr.join('')}</tr></table></div>`;
const infoBox=(label,val,color)=>`<td style="background:${P.soft};border:1px solid ${P.line};border-right:4px solid ${color||P.gold};padding:9px 12px;text-align:right;vertical-align:top"><div style="font-size:11px;color:${P.mut}">${label}</div><div style="font-weight:700;font-size:13.5px;color:${P.navy};margin-top:1px;word-break:break-word">${val}</div></td>`;
const sumBox=(label,val,bg,fg)=>`<td style="background:${bg};color:${fg};padding:11px 8px;text-align:center;vertical-align:middle;border-radius:10px"><div style="font-size:11.5px;opacity:.9">${label}</div><div style="font-weight:700;font-size:16px;margin-top:2px">${val}</div></td>`;

function refreshPubNotifCard(){

  if(p==='granted'){card.innerHTML='<span class="bell">🔔</span><h3>الإشعارات مُفعّلة ✅</h3><p>ستصلك الفواتير والدفعات لحظة تسجيلها</p>';return}
  if(p==='denied'){
    card.innerHTML='<span class="bell">🔕</span><h3>الإشعارات محظورة</h3><p>لتفعيلها اتبع:</p><ol><li>اضغط على 🔒 بجانب الرابط</li><li>اختر «الإشعارات» ← «السماح»</li><li>أعد تحميل الصفحة</li></ol><button id="pubNotifBtn">🔄 أعد المحاولة</button>';
  }else{
    card.innerHTML='<span class="bell">🔔</span><h3>فعّل الإشعارات</h3><p>لتصلك الفواتير والدفعات لحظة تسجيلها على حسابك</p><button id="pubNotifBtn">✅ تفعيل الإشعارات الآن</button>';
  }
  $('#pubNotifBtn').onclick=()=>activateCustomerNotifications(new URLSearchParams(location.search).get('c'));
}
async function activateCustomerNotifications(tk){
  if(!(('Notification' in window)&&('serviceWorker' in navigator)&&('PushManager' in window)))
    return alert('متصفحك لا يدعم الإشعارات.\nاستخدم Chrome أو Safari حديث.');
  if(/iPad|iPhone|iPod/.test(navigator.userAgent)&&!(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true))
    return alert('لتشغيل الإشعارات على iPhone:\n\n1) اضغط زر المشاركة 📤 في Safari\n2) اختر «إضافة إلى الشاشة الرئيسية»\n3) افتح التطبيق من الأيقونة الجديدة\n4) اضغط «تفعيل» مرة أخرى');
  if(Notification.permission==='denied'){
    alert('الإشعارات محظورة من إعدادات المتصفح.\n\nلتفعيلها:\n1) اضغط على 🔒 بجانب الرابط\n2) اختر «الإشعارات» ← «السماح»\n3) أعد تحميل الصفحة');
    refreshPubNotifCard();return;
  }
  const btn=$('#pubNotifBtn');
  if(btn){btn.disabled=true;btn.textContent='⏳ جارٍ التفعيل...'}
  try{
    const t0=Date.now();
    while(typeof window.enablePushNotifications!=='function'){
      if(Date.now()-t0>8000)throw new Error('لم يُحمَّل push.js — أعد تحميل الصفحة');
      await new Promise(r=>setTimeout(r,100));
    }
    await Promise.race([
      window.enablePushNotifications(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('انتهت مهلة التفعيل — تحقق من الإنترنت')),25000))
    ]);
    toast('✅ تم تفعيل الإشعارات بنجاح');
    setTimeout(refreshPubNotifCard,600);
  }catch(e){
    console.error('push error:',e);
    toast('تعذّر التفعيل: '+(e.message||''));
    setTimeout(refreshPubNotifCard,400);
  }finally{
    if(btn&&btn.isConnected){btn.disabled=false;btn.textContent='✅ تفعيل الإشعارات الآن'}
  }
}

/* التزامن مع السيرفر + الإقلاع */
try{Object.assign(S.settings,JSON.parse(localStorage.st||'{}'))}catch(e){}
async function loadSettings(){try{const d=await L.getDoc(L.doc(L.db,'settings',S.user.uid));if(d.exists()){S.settings={...S.settings,...d.data()};try{localStorage.st=JSON.stringify(S.settings)}catch(e){}}}catch(e){}}
function attach(){
  S.unsubs.forEach(u=>u());S.unsubs=[];S.pend={};const u=S.user.uid;
  if(!S.cached)S.ready=false;
  S.full=false;
  const TOTAL=8;let got=0;
  clearTimeout(S._rt);S._rt=setTimeout(()=>{if(!S.ready){S.ready=true;schedule()}},2500);
  const sub=(col,key,cb)=>{let first=true;
    const markFirst=()=>{if(first){first=false;if(++got>=TOTAL){S.ready=true;S.full=true;clearTimeout(S._rt)}}};
    S.unsubs.push(L.onSnapshot(L.query(L.collection(L.db,col),L.where('owner','==',u)),{includeMetadataChanges:true},s=>{
      S.pend[col]=s.metadata.hasPendingWrites;setSync();
      /* لا نمسح بيانات النسخة المحلية بنتيجة فارغة قادمة من كاش فارغ */
      if(s.metadata.fromCache&&!s.docs.length&&S.cached&&(S[key]||[]).length)return;
      if(first||s.docChanges().length){const wasFirst=first;cb(s.docs.map(d=>({id:d.id,...d.data()})));if(wasFirst)markFirst();schedule()}
    },e=>{console.warn(col,e.code);markFirst();schedule()}))};
  const byTs=d=>d.sort((a,b)=>b.ts-a.ts);
  sub('accounts','customers',d=>S.customers=d);sub('suppliers','suppliers',d=>S.suppliers=d);sub('products','products',d=>S.products=d);
  sub('sales','sales',d=>S.sales=byTs(d));sub('purchases','purchases',d=>S.purchases=byTs(d));sub('expenses','expenses',d=>S.expenses=byTs(d));sub('ledger','ledger',d=>S.ledger=byTs(d));
  sub('employees','employees',d=>S.employees=d.sort((a,b)=>String(a.name).localeCompare(String(b.name))));
}
function onAuth(u){
  if(u){
    try{localStorage.uid=u.uid;localStorage.removeItem('out')}catch(e){}
    if(S.user&&S.user.prov&&S.user.uid!==u.uid){resetData();S.cached=false;S.ready=false}
    S.user=u;setSync();
    loadSettings().then(schedule);attach();
    if(S.cached)schedule();else render();
  }else{
    S.unsubs.forEach(x=>x());S.unsubs=[];S.pend={};
    wipeLocal().then(()=>{setSync();render()});
  }
}
async function startFB(){
  for(;;){try{await loadFB();break}catch(e){console.warn('firebase load failed',e);setSync();await sleep(4000)}}
  L.onAuthStateChanged(L.auth,onAuth);
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async function boot(){
  const tk=new URLSearchParams(location.search).get('c');
  if(tk){await publicView(tk);return}
  history.replaceState({root:1},'');history.pushState({v:'dashboard',d:1},'');D=1;
  startFB();
  const snap=await idbGet('snap');
  let uid=null,out=false;try{uid=localStorage.uid;out=localStorage.out==='1'}catch(e){}
  if(snap&&uid&&snap.uid===uid){
    applySnap(snap);S.user={uid,prov:true};S.ready=true;S.cached=true;
    if(pinOn())await lockScreen();
    render();setSync();
  }else if(out){render()}
})();
</script>
