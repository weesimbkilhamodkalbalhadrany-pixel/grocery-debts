<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Cairo,Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);max-width:520px;margin:auto;min-height:100vh;padding:12px 14px 110px;overscroll-behavior-y:contain}
h1{font-size:1.25rem;font-weight:800}h2{font-size:1.05rem;font-weight:800}small{color:var(--m);font-size:.76rem}

.card{background:var(--c);border-radius:18px;padding:14px;margin:10px 0;border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{border:0;border-radius:14px;padding:12px 14px;font-size:.92rem;background:var(--ink);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;transition:transform .12s}
.btn:active,.act:active,.chip:active,.ic:active,.mi:active,.tb:active{transform:scale(.96)}

.btn.am{background:var(--am);color:#2a1d05}.btn.r{background:var(--red)}.btn.gr{background:var(--grn)}
.btn.o{background:transparent;color:var(--t);border:1.5px solid var(--bd)}.btn.g{background:var(--bg);color:var(--t)}
.btn.o.r{color:var(--red)}
.btn.sm{padding:7px 11px;font-size:.78rem;border-radius:10px}.w{width:100%}.btn:disabled{opacity:.6}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:13px;margin:5px 0;font-size:.95rem;background:var(--c);color:var(--t)}
input:focus,select:focus{outline:0;border-color:var(--am)}
label{font-size:.8rem;color:var(--m);display:block;margin-top:6px}
.due{color:var(--red)}.ok{color:var(--grn)}.warn{color:var(--org)}.purple{color:var(--pur)}.blue{color:var(--blu)}
.big{font-size:1.8rem;font-weight:800}.hint{font-size:.78rem;color:var(--m);padding:14px 0;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 4px}
.ic{width:38px;height:38px;border-radius:12px;background:var(--c);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;margin-right:6px;position:relative}
.badge{position:absolute;top:-6px;left:-6px;background:var(--red);color:#fff;font-size:.62rem;border-radius:10px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;font-weight:800;padding:0 4px}
.hero{background:linear-gradient(150deg,var(--ink),var(--ink2));color:#fff;border-radius:22px;padding:18px;margin:10px 0}
.hero small{color:#b9cadb}.hero .big{color:var(--am);margin:2px 0 12px}
.hero .mini{background:rgba(255,255,255,.09);border-radius:14px;padding:10px}.hero .mini b{display:block;font-size:1rem}
.act{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:12px 4px;text-align:center;cursor:pointer;font-size:.74rem;font-weight:600;transition:transform .12s}

.sec{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 6px;font-weight:800;font-size:.95rem}
.stat{background:var(--c);border-radius:16px;padding:12px;border:1px solid var(--bd)}.stat .l{font-size:.72rem;color:var(--m)}.stat .n{font-size:1.02rem;font-weight:800;margin-top:3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}.chip{padding:7px 14px;border-radius:20px;background:var(--c);border:1px solid var(--bd);font-size:.8rem;white-space:nowrap;cursor:pointer;font-weight:600;transition:transform .12s}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);cursor:pointer}.item:last-child{border:0}
.av{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-size:1.05rem}

#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;display:none;z-index:300;font-size:.85rem;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(8,18,28,.55);display:none;align-items:flex-end;justify-content:center;z-index:200}.modal.open{display:flex}
.modal-box{background:var(--c);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px;max-height:88vh;overflow:auto;animation:up .22s}

.lg{width:80px;height:80px;border-radius:24px;display:block;margin:0 auto 10px;box-shadow:0 10px 24px rgba(20,40,59,.28)}

body.offline #offbar{display:block}body.offline{padding-top:36px}
#sync{display:none;position:fixed;top:10px;left:10px;background:var(--am);color:#2a1d05;font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:14px;z-index:350}

.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:.7rem;font-weight:800}
.p-new{background:#3b7de022;color:var(--blu)}.p-prep{background:#e8862b22;color:var(--org)}.p-ready{background:#1f9d6b22;color:var(--grn)}.p-done{background:#6c7a8922;color:var(--m)}.p-cancel{background:#e5484d22;color:var(--red)}
.al{display:flex;gap:10px;align-items:flex-start;padding:11px 10px;border-radius:14px;margin:7px 0;background:var(--bg);border-right:4px solid var(--m);cursor:pointer}
.al.r{border-color:var(--red)}.al.o{border-color:var(--org)}.al.g{border-color:var(--grn)}.al.b{border-color:var(--blu)}
.al i{font-style:normal;font-size:1.3rem}
.tbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tb{border-radius:16px;padding:16px 4px;text-align:center;font-weight:800;cursor:pointer;border:1.5px solid var(--bd);background:var(--c);transition:transform .12s}
.tb.busy{background:#e8862b22;border-color:var(--org);color:var(--org)}.tb.free{border-color:var(--grn);color:var(--grn)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mi{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:10px 4px;text-align:center;font-size:.78rem;font-weight:700;cursor:pointer;transition:transform .12s}.mi small{display:block;margin-top:2px}
.bz{background:var(--bg);border:2px solid var(--bd);border-radius:18px;padding:16px;text-align:center;cursor:pointer;font-weight:800}.bz i{display:block;font-style:normal;font-size:2rem;margin-bottom:4px}
@media print{#nav,.btn,.nc,.ic,#sync{display:none!important}body{background:#fff;padding:0}}
</style>

<script>

a.innerHTML='<div style="text-align:center;padding:70px 20px"><div style="font-size:3rem">📡</div><h2>تعذّر تشغيل التطبيق</h2><p style="color:#6c7a89;margin:10px 0;font-size:.9rem">افتح التطبيق مرة واحدة مع إنترنت ليحفظ ملفاته، ثم جرّبه بدونه.</p><button class="btn" onclick="location.reload()">إعادة المحاولة</button><p style="color:#999;font-size:.65rem;margin-top:14px;direction:ltr">'+window._err.join(' | ')+'</p></div>'}},6000);

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,getDoc,collection,query,where,orderBy,onSnapshot,increment,updateDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fb=initializeApp({apiKey:"AIzaSyDaLsIF93OD-Lr9y51j_s4wB9OzahLUiTQ",authDomain:"grocery-debts.firebaseapp.com",projectId:"grocery-debts",storageBucket:"grocery-debts.firebasestorage.app",messagingSenderId:"484535933298",appId:"1:484535933298:web:87f8e2ea08a6d26231e5eb"});
const auth=getAuth(fb);let db;
try{db=initializeFirestore(fb,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(fb)}

/* ===== أدوات ===== */
const $=s=>document.querySelector(s),A=$('#app'),N=$('#nav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const fmt=n=>n2(n)+' '+S.settings.currency;
const dt=ts=>new Date(ts).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
const dOnly=ts=>new Date(ts).toLocaleDateString('ar-EG');
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)};
const newToken=()=>[...crypto.getRandomValues(new Uint8Array(20))].map(b=>b.toString(16).padStart(2,'0')).join('');
const link=t=>location.origin+location.pathname+'?c='+t;
const initials=s=>(s||'?').trim()[0]||'?';
const startDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime()};
const sum=(a,f)=>a.reduce((n,x)=>n+(f(x)||0),0);
const pos=b=>Math.max(b||0,0);
const dayTs=v=>v?new Date(v+'T12:00:00').getTime():0;
const dstr=ts=>ts?new Date(ts).toISOString().slice(0,10):'';
const daysTo=ts=>Math.ceil((ts-Date.now())/864e5);
const setNet=()=>document.body.classList.toggle('offline',!navigator.onLine);
addEventListener('online',()=>{setNet();toast('🌐 عاد الاتصال — جارٍ المزامنة')});addEventListener('offline',()=>{setNet();toast('📡 لا يوجد إنترنت — التسجيل يُحفظ محلياً')});setNet();

/* الكتابة المحلية أولاً */
const fire=p=>{p.catch(e=>{console.error(e);toast('تعذّرت المزامنة: '+(e.code||e.message||''))});
  return navigator.onLine?Promise.race([p.catch(()=>{}),new Promise(r=>setTimeout(r,1500))]):Promise.resolve()};
const okMsg=m=>{buzz();toast(navigator.onLine?m:'✅ حُفظ على جهازك — سيُزامن عند عودة الإنترنت')};

const LIBS={qr:['https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',()=>window.QRCode],chart:['https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js',()=>window.Chart],pdf:['https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js',()=>window.html2pdf]};
const _lp={};
const need=k=>{const[u,t]=LIBS[k];if(t())return Promise.resolve();return _lp[k]||(_lp[k]=new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>{delete _lp[k];no()};document.head.appendChild(e)}))};
try{document.documentElement.dataset.theme=localStorage.th||''}catch(e){}

const S={user:null,view:'dashboard',_authTab:'login',customerId:null,supplierId:null,employeeId:null,
customers:[],suppliers:[],products:[],sales:[],purchases:[],expenses:[],ledger:[],employees:[],orders:[],checks:[],
settings:{name:'الكامل سوفت',currency:'ر.ي',phone:'',address:'',autoWhatsApp:true,biz:'grocery',tables:10,tax:0,fee:0},
cart:[],formOpen:false,q:'',cf:'all',per:'d',lt:'',unsubs:[],chart:null,pend:{},
pk:'all',of:'act',ef:'all',kf:'pending',otable:null,notified:false};

/* ===== الأقسام (الأنشطة التجارية) ===== */
const BIZ={
  grocery:{n:'بقالة / سوبرماركت',i:'🛒',cu:'العملاء',c1:'عميل',pr:'المخزون',tag:'حساباتك وديونك في جيبك'},
  pharmacy:{n:'صيدلية',i:'💊',cu:'المرضى',c1:'مريض',pr:'الأدوية',tag:'ديون وصلاحيات وتجديدات دواء'},
  trader:{n:'تاجر / جملة',i:'🏬',cu:'العملاء',c1:'عميل',pr:'البضائع',tag:'ذمم وشيكات وفواتير جملة'},
  restaurant:{n:'مطعم / كافيه',i:'🍽️',cu:'الزبائن',c1:'زبون',pr:'المنيو والمواد',tag:'طلبات وطاولات ومبيعات'}
};
const SB=()=>BIZ[S.settings.biz]?S.settings.biz:'grocery';
const bz=()=>BIZ[SB()];

/* قوالب رسائل واتساب/الإشعارات لكل قسم لوحده */
function sMsg(kind,o){
  const c=o.cur||S.settings.currency,A=n2(o.amount),B=n2(o.balance),n=o.note?`\n📝 ${o.note}`:'';
  const T={
    grocery:{debt:`🛒 تم تسجيل دين جديد بقيمة *${A} ${c}*${n}\nإجمالي حسابك: *${B} ${c}*\nشكراً لثقتكم بنا 🌹`,
      payment:`🛒 تم استلام دفعة بقيمة *${A} ${c}*${n}\nالمتبقي: *${B} ${c}*\nشكراً لالتزامكم بالسداد 💚`,
      remind:`🛒 نذكّرك بأن رصيد حسابك المستحق *${B} ${c}*.`},
    pharmacy:{debt:`💊 تم تسجيل مبلغ آجل (أدوية) بقيمة *${A} ${c}*${n}\nإجمالي حسابك: *${B} ${c}*\nنتمنى لك الشفاء العاجل 🌿`,
      payment:`💊 تم استلام دفعة بقيمة *${A} ${c}*${n}\nالمتبقي: *${B} ${c}*\nشكراً لك، دمتم بصحة وعافية 🌿`,
      remind:`💊 تذكير لطيف: رصيد حسابك في الصيدلية *${B} ${c}*.`,
      refill:`💊 حان موعد تجديد دوائك${o.note?' ('+o.note+')':''}.\nتفضّل بزيارتنا أو أخبرنا لنجهّزه لك.\nنتمنى لك دوام الصحة 🌿`},
    trader:{debt:`🏬 *إشعار مدين*\nتم قيد مبلغ *${A} ${c}* على حسابكم${n}\nالرصيد المستحق: *${B} ${c}*`,
      payment:`🏬 *إشعار دائن*\nتم استلام دفعتكم *${A} ${c}*${n}\nالرصيد المتبقي: *${B} ${c}*\nشكراً لتعاملكم معنا 🤝`,
      remind:`🏬 تذكير بموعد السداد: الرصيد المستحق على حسابكم *${B} ${c}*${o.days?` (متأخر ${o.days} يوماً)`:''}.`,
      check:`🏬 تذكير: شيك رقم ${o.no||'—'} بمبلغ *${A} ${c}* يستحق بتاريخ ${o.date||''}.`},
    restaurant:{debt:`🍽️ تم تسجيل مبلغ آجل بقيمة *${A} ${c}*${n}\nإجمالي حسابك: *${B} ${c}*\nبالهناء والعافية 🌹`,
      payment:`🍽️ تم استلام دفعة بقيمة *${A} ${c}*${n}\nالمتبقي: *${B} ${c}*\nشكراً لك ونتشرف بزيارتك 💚`,
      remind:`🍽️ نذكّرك بأن رصيد حسابك *${B} ${c}*.`}
  };
  return (T[SB()]&&T[SB()][kind])||T.grocery[kind]||'';
}
const pushTitle=()=>bz().i+' '+S.settings.name;

/* ===== التنقل مع زر الرجوع ===== */
let D=1,mOpen=false,mPushed=false,pend=false,hq=[],lastBack=0;
const H=f=>pend?hq.push(f):f();
function modal(h){$('#modalBox').innerHTML=h;$('#modal').classList.add('open');
  if(!mOpen){mOpen=true;H(()=>{if(mOpen){history.pushState({m:1,d:D},'');mPushed=true}})}}
window.closeModal=()=>{if(!mOpen)return;mOpen=false;$('#modal').classList.remove('open');if(mPushed){mPushed=false;pend=true;history.back()}};
const back=()=>D>1?history.back():go('dashboard',null,true);
addEventListener('popstate',e=>{
  if(pend){pend=false;const q=hq;hq=[];q.forEach(f=>f());return}
  if(mOpen){mOpen=false;mPushed=false;$('#modal').classList.remove('open');return}
  const st=e.state||{root:1};
  if(st.root){if(Date.now()-lastBack<2000){history.back();return}
    lastBack=Date.now();toast('اضغط رجوع مرة أخرى للخروج');
    history.pushState({v:'dashboard',d:1},'');D=1;S.view='dashboard';S.formOpen=false;render();return}
  D=st.d||1;S.view=st.v||'dashboard';S.formOpen=false;S.cart=[];S.q='';
  if(st.v==='customer')S.customerId=st.id;if(st.v==='supplier')S.supplierId=st.id;if(st.v==='employee')S.employeeId=st.id;
  window.scrollTo(0,0);render()});
function go(v,id,rep){
  if(!rep&&v===S.view&&!id&&!['customer','supplier','employee'].includes(v)){S.formOpen=false;return render()}
  S.view=v;S.formOpen=false;S.q='';S.cart=[];
  if(v==='customer')S.customerId=id;if(v==='supplier')S.supplierId=id;if(v==='employee')S.employeeId=id;
  if(!rep)D++;const st={v,id:id||null,d:D};
  H(()=>history[rep?'replaceState':'pushState'](st,''));
  window.scrollTo(0,0);render();
}

/* ===== أعمار الديون (FIFO) ===== */
function agingOf(list){
  const ds=list.filter(l=>l.dir==='out').sort((a,b)=>a.ts-b.ts).map(l=>({ts:l.ts,amt:l.amount}));
  let paid=sum(list.filter(l=>l.dir==='in'),l=>l.amount);
  for(const d of ds){if(paid<=0)break;const u=Math.min(paid,d.amt);d.amt-=u;paid-=u}
  return ds.filter(d=>d.amt>0.0001);
}
function ageIndex(){
  const m={};S.ledger.forEach(l=>{if(l.accountId)(m[l.accountId]=m[l.accountId]||[]).push(l)});
  const parts=id=>agingOf(m[id]||[]);
  return{parts,age:id=>{const p=parts(id);return p.length?Math.floor((Date.now()-p[0].ts)/864e5):0}};
}

async function delTx(l,ent,kind){
  if(!l||!confirm('حذف هذه الحركة ('+n2(l.amount)+')؟ سيُعاد احتساب الرصيد.'))return;
  try{
    const delta=l.dir==='out'?-l.amount:l.amount;
    const col=kind==='customer'?'accounts':'suppliers';
    await deleteDoc(doc(db,'ledger',l.id));
    await setDoc(doc(db,col,ent.id),{balance:increment(delta)},{merge:true});
    okMsg('تم حذف الحركة');
  }catch(err){
    console.error(err);toast('تعذّر الحذف: '+(err.code||err.message||''));
  }
}

  listPage({title:bz().pr,add:'+ '+(rs?'صنف':b==='pharmacy'?'دواء':'منتج'),onAdd:()=>productForm(),cur:S.pk,chips,onChip:v=>{S.pk=v;productsList()},
    head:`<div class="g2"><div class="stat"><div class="l">عدد الأصناف</div><div class="n">${S.products.length}</div></div><div class="stat"><div class="l">قيمة المخزون</div><div class="n blue">${fmt(sum(S.products,p=>(p.stock||0)*(p.cost||0)))}</div></div></div>`,
    rows:q=>S.products.filter(p=>(!q||[p.name,p.bc,p.generic,p.cat].some(x=>(x||'').toLowerCase().includes(q)))&&

    click:id=>productForm(S.products.find(p=>p.id===id))});
}

  <div class="g2"><div class="stat"><div class="l">مستلمة قيد الانتظار</div><div class="n ok">${fmt(sum(pc.filter(c=>c.dir==='in'),c=>c.amount))}</div></div><div class="stat"><div class="l">صادرة قيد الانتظار</div><div class="n warn">${fmt(sum(pc.filter(c=>c.dir==='out'),c=>c.amount))}</div></div></div>

  <div class="card">${L.map(c=>{const d=daysTo(c.due),od=c.status==='pending'&&d<0;return `<div class="item" data-id="${c.id}"><div><b>${c.dir==='in'?'📥 مستلم من':'📤 صادر إلى'} ${esc(c.party||'—')}</b><br><small>رقم ${esc(c.no||'—')} · ${esc(c.bank||'')} · ${dOnly(c.due)}</small></div><div style="text-align:left"><b class="${c.dir==='in'?'ok':'warn'}">${fmt(c.amount)}</b><br><small class="${od?'due':''}">${c.status==='cleared'?'✅ تم':c.status==='bounced'?'❌ مرتجع':od?'متأخر '+(-d)+' يوم':'بعد '+d+' يوم'}</small></div></div>`}).join('')||'<p class="hint">لا توجد شيكات</p>'}</div>`;

function checkForm(c){

  modal(`<h2>${e?'تعديل شيك':'تسجيل شيك'}</h2>

  fillSel();
  $('#d-in').onclick=()=>{dir='in';$('#d-in').className='btn';$('#d-out').className='btn g';fillSel()};
  $('#d-out').onclick=()=>{dir='out';$('#d-out').className='btn';$('#d-in').className='btn g';fillSel()};

    try{
      const d={dir,party,partyId:pid||'',no:$('#no').value.trim(),bank:$('#bk').value.trim(),amount,due,note:$('#nt').value.trim()};
      if(e)await setDoc(doc(db,'checks',c.id),d,{merge:true});
      else await setDoc(doc(collection(db,'checks')),{owner:S.user.uid,ts:Date.now(),status:'pending',...d});
      closeModal();okMsg('تم الحفظ');
    }catch(err){console.error(err);toast('تعذّر الحفظ: '+(err.code||err.message||''));btn.disabled=false;btn.textContent='حفظ'}
  };
  if(e)$('#dl').onclick=async()=>{if(!confirm('حذف هذا الشيك؟'))return;try{await deleteDoc(doc(db,'checks',c.id));closeModal();toast('تم الحذف')}catch(err){toast('تعذّر الحذف')}};

function checkActions(c){
  if(!c)return;const cu=c.dir==='in',p=cu?S.customers.find(x=>x.id===c.partyId):null;
  modal(`<h2>${cu?'📥':'📤'} شيك ${esc(c.no||'')} — ${fmt(c.amount)}</h2><small>${esc(c.party)} · استحقاق ${dOnly(c.due)}</small>
  <div class="g2" style="margin-top:12px">${c.status==='pending'?`<button class="btn gr" id="k-ok">${cu?'✅ تم التحصيل':'✅ تم الصرف'}</button><button class="btn o r" id="k-bn">❌ ارتجع</button>`:''}
  <button class="btn o" id="k-ed">✏️ تعديل</button>${cu&&p?.phone&&c.status==='pending'?'<button class="btn o" id="k-wa">📱 تذكير العميل</button>':''}</div>`);

    }catch(err){toast('تعذّر: '+(err.code||err.message||''))}};
  if($('#k-bn'))$('#k-bn').onclick=async()=>{if(!confirm('تسجيل الشيك كمرتجع؟'))return;try{await setDoc(doc(db,'checks',c.id),{status:'bounced'},{merge:true});closeModal();okMsg('تم')}catch(e){toast('تعذّر')}};

/* ترحيل الفاتورة (بيع/شراء): الفاتورة + المخزون + الحركات المالية */
async function postInvoice(kind,o){
  const sl=kind==='sale',due=Math.round((o.total-o.paid)*100)/100,idf=sl?'accountId':'supplierId',pc=sl?'accounts':'suppliers';
  const ref=doc(collection(db,sl?'sales':'purchases')),nm=o.p?.name||(sl?'عميل نقدي':'مورد نقدي');
  const items=o.items.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price,cost:i.cost||0}));
  const rec={owner:S.user.uid,ts:Date.now(),[sl?'customerId':'supplierId']:o.pid||null,[sl?'customerName':'supplierName']:nm,items,sub:o.sub,disc:o.disc||0,tax:o.tax||0,total:o.total,paid:o.paid,due,note:o.note||'',biz:SB(),...(o.extra||{})};
  await setDoc(ref,rec);
  for(const i of o.items){
    const p=S.products.find(x=>x.id===i.id);if(p&&p.track===false)continue;
    try{
      if(sl)await setDoc(doc(db,'products',i.id),{stock:increment(-i.qty)},{merge:true});
      else{const u={stock:increment(i.qty),cost:i.price};
        if(i.exp>0)u.exp=(p&&p.exp>0&&(p.stock||0)>0)?Math.min(p.exp,i.exp):i.exp;
        await setDoc(doc(db,'products',i.id),u,{merge:true})}
    }catch(e){console.warn('stock',e)}
  }
  if(o.paid>0)await setDoc(newLedgerRef(),ledgerData(sl?'sale':'purchase',sl?'فاتورة بيع':'فاتورة شراء',o.paid,sl?'in':'out',sl?o.paid:-o.paid,{ref:ref.id}));
  if(due>0){
    await setDoc(newLedgerRef(),ledgerData(sl?'sale':'purchase',sl?'فاتورة بيع آجل':'فاتورة شراء آجل',due,'out',0,{[idf]:o.pid,ref:ref.id}));
    await setDoc(doc(db,pc,o.pid),{balance:increment(due)},{merge:true});
  }
  return{...rec,id:ref.id};
}
async function saveInv(kind){
  if(!S.cart.length)return toast('أضف أصنافاً');
  const sl=kind==='sale',pid=$('#party').value,p=(sl?S.customers:S.suppliers).find(x=>x.id===pid);
  const{sub,d,tx,tot}=calc(),paid=Math.max(0,Math.min(Number($('#paid').value)||0,tot)),due=tot-paid;
  if(due>0&&!p)return toast(sl?'اختر عميلاً للبيع الآجل':'اختر مورداً للشراء الآجل');

  <div class="card"><div class="g2"><div><label>رسوم التوصيل</label><input id="fee" type="number" value="${S.settings.fee||''}"></div><div><label>خصم</label><input id="disc" type="number"></div></div>
  <input id="nt" placeholder="ملاحظات للمطبخ (بدون بصل...)"><div class="row" style="margin-top:8px"><span>الإجمالي</span><b class="big ok" id="tot" style="font-size:1.3rem">0</b></div><button class="btn am w" id="save" style="margin-top:8px">🍳 إرسال للمطبخ</button></div>`;
  $('#bk').onclick=back;
  const tot=()=>{const sub=sum(S.cart,i=>i.qty*i.price),fee=ty==='delivery'?Number($('#fee').value)||0:0,d=Math.min(Number($('#disc').value)||0,sub);return{sub,fee,d,t:sub+fee-d}};
  const drawT=()=>{$('#oty').innerHTML=Object.entries(OT).map(([k,v])=>`<button class="btn sm ${k===ty?'':'g'}" data-t="${k}">${v[0]} ${v[1]}</button>`).join('');
    $('#oty').querySelectorAll('[data-t]').forEach(bn=>bn.onclick=()=>{ty=bn.dataset.t;drawT()});
    $('#f-dine').style.display=ty==='dine'?'':'none';$('#f-oth').style.display=ty==='dine'?'none':'';$('#ad').style.display=ty==='delivery'?'':'none';$('#fee').parentElement.style.opacity=ty==='delivery'?1:.4;drawC()};
  const drawM=()=>{$('#mc').innerHTML=[['all','الكل'],...cats.map(c=>[c,c])].map(([v,l])=>`<div class="chip ${cat===v?'on':''}" data-c="${esc(v)}">${esc(l)}</div>`).join('');
    $('#mc').querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{cat=e.dataset.c;drawM()});
    $('#mgrid').innerHTML=menu.filter(p=>cat==='all'||(p.cat||'عام')===cat).map(p=>`<div class="mi" data-p="${p.id}">${esc(p.name)}<small>${n2(p.price)}</small></div>`).join('')||'<p class="hint" style="grid-column:1/-1">أضف أصناف المنيو من «المنيو والمواد» أولاً</p>';
    $('#mgrid').querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{const p=S.products.find(x=>x.id===e.dataset.p),it=S.cart.find(i=>i.id===p.id);it?it.qty++:S.cart.push({id:p.id,name:p.name,qty:1,price:p.price,cost:p.cost||0});buzz();drawC()})};
  const drawC=()=>{$('#cart').innerHTML=S.cart.map((i,x)=>`<div class="tx"><div><b>${esc(i.name)}</b><br><small>${n2(i.price)}</small></div><div class="row" style="gap:6px"><button class="btn g sm" data-m="${x}">−</button><b>${n2(i.qty)}</b><button class="btn g sm" data-a="${x}">+</button></div></div>`).join('')||'<p class="hint">اضغط على الأصناف لإضافتها</p>';
    $('#cart').querySelectorAll('[data-m]').forEach(bn=>bn.onclick=()=>{const i=S.cart[+bn.dataset.m];i.qty--;if(i.qty<=0)S.cart.splice(+bn.dataset.m,1);drawC()});
    $('#cart').querySelectorAll('[data-a]').forEach(bn=>bn.onclick=()=>{S.cart[+bn.dataset.a].qty++;drawC()});
    $('#tot').textContent=fmt(tot().t)};
  $('#fee').oninput=$('#disc').oninput=drawC;
  $('#cu').onchange=e=>{const c=S.customers.find(x=>x.id===e.target.value);if(c){$('#cn').value=c.name;$('#ph').value=c.phone||'';$('#ad').value=c.addr||''}};
  drawT();drawM();
  $('#save').onclick=async()=>{
    if(!S.cart.length)return toast('أضف أصنافاً للطلب');
    const table=ty==='dine'?($('#tb').value||'').trim():'';if(ty==='dine'&&!table)return toast('اختر الطاولة');
    const{sub,fee,d,t}=tot(),bn=$('#save');bn.disabled=true;bn.textContent='جارٍ الحفظ...';
    try{
      const t0=startDay(Date.now()),no=S.orders.filter(o=>o.ts>=t0).length+1,ref=doc(collection(db,'orders'));
      const o={owner:S.user.uid,ts:Date.now(),no,type:ty,table,customerId:ty==='dine'?'':$('#cu').value,customerName:ty==='dine'?'':$('#cn').value.trim(),phone:ty==='dine'?'':$('#ph').value.trim(),address:ty==='delivery'?$('#ad').value.trim():'',
        items:S.cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price,cost:i.cost||0})),sub,fee,disc:d,total:t,status:'new',paid:false,note:$('#nt').value.trim()};
      await setDoc(ref,o);S.formOpen=false;S.cart=[];S.otable=null;okMsg('🍳 أُرسل الطلب #'+no);go('orders',null,true);S.of='act';
      const so={...o,id:ref.id};if(o.phone&&S.settings.autoWhatsApp)setTimeout(()=>waPrompt(o.customerName||'عميلنا',o.phone,orderMsg(so,'new'),'🍽️ تأكيد الطلب #'+no),500);
    }catch(e){console.error(e);toast('تعذّر الحفظ: '+(e.code||e.message||''));bn.disabled=false;bn.textContent='🍳 إرسال للمطبخ'}
  };
}

function employeeForm(emp){
  const e=!!emp,ph={grocery:'كاشير، عامل...',pharmacy:'صيدلي، مساعد صيدلي...',trader:'محاسب، مندوب مبيعات...',restaurant:'طباخ، نادل، كاشير...'}[SB()];
  modal(`<h2>${e?'تعديل موظف':'موظف جديد'}</h2><label>الاسم *</label><input id="n" value="${esc(emp?.name||'')}"><label>الوظيفة</label><input id="po" value="${esc(emp?.position||'')}" placeholder="${ph}">
  <label>الهاتف</label><input id="ph" type="tel" value="${esc(emp?.phone||'')}"><label>الراتب الشهري</label><input id="sa" type="number" value="${emp?.salary??0}">
  ${e?'':`<label>سحبيات سابقة</label><input id="op" type="number" placeholder="0">`}${btns()}${e?delBtn:''}`);
  $('#sv').onclick=async()=>{
    const name=$('#n').value.trim();if(!name)return toast('اكتب الاسم');
    const btn=$('#sv');btn.disabled=true;btn.textContent='جارٍ الحفظ...';
    try{
      const d={name,position:$('#po').value.trim(),phone:$('#ph').value.trim(),salary:Number($('#sa').value)||0};
      if(e){
        await setDoc(doc(db,'employees',emp.id),d,{merge:true});
      }else{
        const op=Number($('#op').value)||0,r=doc(collection(db,'employees'));
        await setDoc(r,{owner:S.user.uid,...d,balance:op,createdAt:Date.now()});
        if(op>0)await setDoc(newLedgerRef(),ledgerData('advance','سحبيات سابقة',op,'out',-op,{employeeId:r.id}));
      }
      closeModal();okMsg('تم الحفظ');
    }catch(err){
      console.error(err);toast('تعذّر الحفظ: '+(err.code||err.message||''));
      btn.disabled=false;btn.textContent='حفظ';
    }
  };
  if(e)$('#dl').onclick=async()=>{
    if(!confirm('حذف الموظف "'+emp.name+'"؟'))return;
    try{await deleteDoc(doc(db,'employees',emp.id));closeModal();toast('تم الحذف')}
    catch(err){toast('تعذّر الحذف: '+(err.code||err.message||''))}
  };
}

function employeeAmountForm(type,emp){
  const Lb={advance:{title:'تسجيل سحبية',sub:'الموظف يأخذ نقوداً من الصندوق',sign:1,cash:-1,dir:'out'},salary:{title:'دفع راتب',sub:'خصم من الرصيد وتسليم نقود',sign:-1,cash:-1,dir:'out'},
    bonus:{title:'مكافأة',sub:'تخفيض المستحق عليه كمكافأة',sign:-1,cash:0,dir:'out'},deduction:{title:'خصم/جزاء',sub:'زيادة المستحق عليه كعقوبة',sign:1,cash:0,dir:'in'}}[type];

  $('#sv').onclick=async()=>{
    const amount=Number($('#am').value);if(!(amount>0))return toast('أدخل مبلغاً صحيحاً');

    try{
      await setDoc(newLedgerRef(),ledgerData(type,Lb.title,amount,Lb.dir,Lb.cash*amount,{employeeId:emp.id,note:$('#nt').value.trim()}));

      b.disabled=false;b.textContent='تأكيد';

}
