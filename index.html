*{box-sizing:border-box;margin:0;padding:0;font-family:Cairo,Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);max-width:520px;margin:auto;min-height:100vh;padding:12px 14px 110px;overscroll-behavior-y:contain}

#app>*{animation:fd .2s ease both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--c);border-radius:18px;padding:14px;margin:10px 0;border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{border:0;border-radius:14px;padding:12px 14px;font-size:.92rem;background:var(--ink);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;transition:transform .12s}
.btn:active,.act:active,.chip:active,.ic:active{transform:scale(.96)}
:root[data-theme=dark] .btn{background:var(--ink2)}
.btn.am{background:var(--am);color:#2a1d05}.btn.r{background:var(--red)}.btn.gr{background:var(--grn)}
.btn.o{background:transparent;color:var(--t);border:1.5px solid var(--bd)}.btn.g{background:var(--bg);color:var(--t)}
.btn.o.r{color:var(--red)}
.btn.sm{padding:7px 11px;font-size:.78rem;border-radius:10px}.w{width:100%}.btn:disabled{opacity:.6}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:13px;margin:5px 0;font-size:.95rem;background:var(--c);color:var(--t)}
input:focus,select:focus{outline:0;border-color:var(--am)}
label{font-size:.8rem;color:var(--m);display:block;margin-top:6px}
.due{color:var(--red)}.ok{color:var(--grn)}.warn{color:var(--org)}.purple{color:var(--pur)}.blue{color:var(--blu)}
.big{font-size:1.8rem;font-weight:800}.hint{font-size:.78rem;color:var(--m);padding:14px 0;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 4px}
.ic{width:38px;height:38px;border-radius:12px;background:var(--c);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;margin-right:6px}
.hero{background:linear-gradient(150deg,var(--ink),var(--ink2));color:#fff;border-radius:22px;padding:18px;margin:10px 0}
.hero small{color:#b9cadb}.hero .big{color:var(--am);margin:2px 0 12px}
.hero .mini{background:rgba(255,255,255,.09);border-radius:14px;padding:10px}.hero .mini b{display:block;font-size:1rem}
.act{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:12px 4px;text-align:center;cursor:pointer;font-size:.74rem;font-weight:600;transition:transform .12s}

.sec{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 6px;font-weight:800;font-size:.95rem}
.stat{background:var(--c);border-radius:16px;padding:12px;border:1px solid var(--bd)}.stat .l{font-size:.72rem;color:var(--m)}.stat .n{font-size:1.02rem;font-weight:800;margin-top:3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}.chip{padding:7px 14px;border-radius:20px;background:var(--c);border:1px solid var(--bd);font-size:.8rem;white-space:nowrap;cursor:pointer;font-weight:600;transition:transform .12s}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);cursor:pointer}.item:last-child{border:0}
.av{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-size:1.05rem}
.bar{height:5px;border-radius:5px;background:var(--bd);margin-top:5px;overflow:hidden;width:90px}.bar i{display:block;height:100%;background:var(--grn)}
.tx{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--bd);gap:8px}.tx:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right}
#nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:var(--c);border-top:1px solid var(--bd);display:flex;align-items:flex-end;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:50}
#nav a{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--m);font-size:.68rem;padding:4px;flex:1;cursor:pointer;font-weight:600}
#nav a span{font-size:1.25rem}#nav a.on{color:var(--t)}#nav a.on small{color:var(--t);font-weight:800}
#nav .fab{background:var(--am);color:#2a1d05;width:56px;height:56px;border-radius:20px;flex:none;margin-top:-26px;box-shadow:0 8px 18px rgba(244,169,58,.45);justify-content:center;font-size:1.9rem;font-weight:800}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;display:none;z-index:300;font-size:.85rem;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(8,18,28,.55);display:none;align-items:flex-end;justify-content:center;z-index:200}.modal.open{display:flex}
.modal-box{background:var(--c);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px;max-height:88vh;overflow:auto;animation:up .22s}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.lg{width:80px;height:80px;border-radius:24px;display:block;margin:0 auto 10px;box-shadow:0 10px 24px rgba(20,40,59,.28)}
.nc{background:linear-gradient(150deg,var(--ink),var(--ink2));color:#fff;text-align:center;padding:18px}.nc p{font-size:.78rem;opacity:.9;margin:6px 0 12px}.nc .bell{font-size:2.2rem}
.nc button{background:var(--am);color:#2a1d05;border:0;border-radius:12px;padding:12px;font-weight:800;width:100%;font-size:.92rem;cursor:pointer}
.nc ol{text-align:right;font-size:.78rem;line-height:1.9;padding-right:18px;margin:8px 0}
#offbar{display:none;position:fixed;top:0;left:0;right:0;background:var(--org);color:#fff;text-align:center;font-size:.76rem;padding:6px;z-index:400;font-weight:600}
body.offline #offbar{display:block}body.offline{padding-top:36px}
#sync{display:none;position:fixed;top:10px;left:10px;background:var(--am);color:#2a1d05;font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:14px;z-index:350}
body.offline #sync{top:40px}
#scanbox{width:100%;min-height:270px;border-radius:14px;overflow:hidden;background:#000;position:relative}
#scanbox video{width:100%!important;height:auto!important;border-radius:14px}
#scanbox img{display:none}
@media print{#nav,.btn,.nc,.ic,#sync{display:none!important}body{background:#fff;padding:0}}
</style>

<script>
window._err=[];

setTimeout(()=>{const a=document.getElementById('app');if(a&&!a.innerHTML.trim()){
a.innerHTML='<div style="text-align:center;padding:70px 20px"><div style="font-size:3rem">📡</div><h2>تعذّر تشغيل التطبيق</h2><p style="color:#6c7a89;margin:10px 0;font-size:.9rem">افتح التطبيق مرة واحدة مع إنترنت ليحفظ ملفاته، ثم جرّبه بدونه.</p><button class="btn" onclick="location.reload()">إعادة المحاولة</button><p style="color:#999;font-size:.65rem;margin-top:14px;direction:ltr">'+window._err.join(' | ')+'</p></div>'}},6000);

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,getDoc,collection,query,where,orderBy,onSnapshot,increment,updateDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fb=initializeApp({apiKey:"AIzaSyDaLsIF93OD-Lr9y51j_s4wB9OzahLUiTQ",authDomain:"grocery-debts.firebaseapp.com",projectId:"grocery-debts",storageBucket:"grocery-debts.firebasestorage.app",messagingSenderId:"484535933298",appId:"1:484535933298:web:87f8e2ea08a6d26231e5eb"});
const auth=getAuth(fb);let db;
try{db=initializeFirestore(fb,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(fb)}

/* ===== أدوات ===== */
const $=s=>document.querySelector(s),A=$('#app'),N=$('#nav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const fmt=n=>n2(n)+' '+S.settings.currency;
const dt=ts=>new Date(ts).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
const dOnly=ts=>new Date(ts).toLocaleDateString('ar-EG');
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)};
const newToken=()=>[...crypto.getRandomValues(new Uint8Array(20))].map(b=>b.toString(16).padStart(2,'0')).join('');
const link=t=>location.origin+location.pathname+'?c='+t;
const initials=s=>(s||'?').trim()[0]||'?';
const startDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime()};
const sum=(a,f)=>a.reduce((n,x)=>n+(f(x)||0),0);
const pos=b=>Math.max(b||0,0);
const setNet=()=>document.body.classList.toggle('offline',!navigator.onLine);
addEventListener('online',()=>{setNet();toast('🌐 عاد الاتصال — جارٍ المزامنة')});addEventListener('offline',()=>{setNet();toast('📡 لا يوجد إنترنت — التسجيل يُحفظ محلياً')});setNet();

const fire=p=>{p.catch(e=>{console.error(e);toast('تعذّرت المزامنة: '+(e.code||e.message||''))});
  return navigator.onLine?Promise.race([p.catch(()=>{}),new Promise(r=>setTimeout(r,1500))]):Promise.resolve()};
const okMsg=m=>{buzz();toast(navigator.onLine?m:'✅ حُفظ على جهازك — سيُزامن عند عودة الإنترنت')};

/* ===== المكتبات ===== */
const LIBS={
  scan:['https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js',()=>window.Html5Qrcode],
  qr:['https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',()=>window.QRCode],
  chart:['https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js',()=>window.Chart],
  pdf:['https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js',()=>window.html2pdf]
};
const _lp={};
const need=k=>{const[u,t]=LIBS[k];if(t())return Promise.resolve();return _lp[k]||(_lp[k]=new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>{delete _lp[k];no()};document.head.appendChild(e)}))};
try{document.documentElement.dataset.theme=localStorage.th||''}catch(e){}

const S={user:null,view:'dashboard',_authTab:'login',customerId:null,supplierId:null,employeeId:null,
customers:[],suppliers:[],products:[],sales:[],purchases:[],expenses:[],ledger:[],employees:[],
settings:{name:'الكامل سوفت',currency:'ر.ي',phone:'',address:'',autoWhatsApp:true},
cart:[],formOpen:false,q:'',cf:'all',per:'d',lt:'',unsubs:[],chart:null,pend:{},scanner:null,_lastScan:null,_scanCb:null};

/* ===== التنقل ===== */
let D=1,mOpen=false,mPushed=false,pend=false,hq=[],lastBack=0;
const H=f=>pend?hq.push(f):f();
function modal(h){$('#modalBox').innerHTML=h;$('#modal').classList.add('open');
  if(!mOpen){mOpen=true;H(()=>{if(mOpen){history.pushState({m:1,d:D},'');mPushed=true}})}}
window.closeModal=()=>{if(!mOpen)return;window.stopScanner&&window.stopScanner();mOpen=false;$('#modal').classList.remove('open');if(mPushed){mPushed=false;pend=true;history.back()}};
const back=()=>D>1?history.back():go('dashboard',null,true);
addEventListener('popstate',e=>{
  if(pend){pend=false;const q=hq;hq=[];q.forEach(f=>f());return}
  if(mOpen){window.stopScanner&&window.stopScanner();mOpen=false;mPushed=false;$('#modal').classList.remove('open');return}
  const st=e.state||{root:1};
  if(st.root){if(Date.now()-lastBack<2000){history.back();return}
    lastBack=Date.now();toast('اضغط رجوع مرة أخرى للخروج');
    history.pushState({v:'dashboard',d:1},'');D=1;S.view='dashboard';S.formOpen=false;render();return}
  D=st.d||1;S.view=st.v||'dashboard';S.formOpen=false;S.cart=[];S.q='';
  if(st.v==='customer')S.customerId=st.id;if(st.v==='supplier')S.supplierId=st.id;if(st.v==='employee')S.employeeId=st.id;
  window.scrollTo(0,0);render()});
function go(v,id,rep){
  if(!rep&&v===S.view&&!id&&!['customer','supplier','employee'].includes(v)){S.formOpen=false;return render()}
  S.view=v;S.formOpen=false;S.q='';S.cart=[];
  if(v==='customer')S.customerId=id;if(v==='supplier')S.supplierId=id;if(v==='employee')S.employeeId=id;
  if(!rep)D++;const st={v,id:id||null,d:D};
  H(()=>history[rep?'replaceState':'pushState'](st,''));
  window.scrollTo(0,0);render();
}

const ledgerData=(type,label,amount,dir,cash,extra={})=>({owner:S.user.uid,ts:Date.now(),type,label,amount:Math.abs(amount),dir,cash:cash||0,...extra});
const newLedgerRef=()=>doc(collection(db,'ledger'));
const btns=ok=>`<div class="row" style="margin-top:12px"><button class="btn o w" onclick="closeModal()">إلغاء</button><button class="btn w" id="sv">${ok||'حفظ'}</button></div>`;
const delBtn=`<button class="btn o r w" id="dl" style="margin-top:8px">🗑 حذف</button>`;

function updateSync(){const n=Object.values(S.pend).some(Boolean);$('#sync').style.display=n?'block':'none'}

/* ===== واتساب ===== */
function whatsappSend(phone,name,msg){
  if(!phone)return toast('لا يوجد رقم هاتف مسجل');
  let p=phone.replace(/[^\d]/g,'');if(p.startsWith('00'))p=p.slice(2);
  if(!p.startsWith('967')){p='967'+p.replace(/^0+/,'')}
  window.open('https://wa.me/'+p+'?text='+encodeURIComponent(`السلام عليكم ${name} 🌟\n\n${msg}\n\n— ${S.settings.name}`),'_blank');
}
function notifyDebt(name,phone,amount,balance,kind){
  if(!S.settings.autoWhatsApp||!phone)return;
  const c=S.settings.currency,d=kind==='debt';
  const msg=d?`تم تسجيل دين بمبلغ *${n2(amount)} ${c}*\nالرصيد الحالي: *${n2(balance)} ${c}*\n\nشكراً لتعاملك معنا 🌹`:`تم تسجيل دفعة بمبلغ *${n2(amount)} ${c}*\nالرصيد المتبقي: *${n2(balance)} ${c}*\n\nشكراً لك 💚`;
  modal(`<h2>إشعار واتساب</h2><p style="margin:10px 0;font-size:.9rem;color:var(--m)">إرسال إشعار إلى <b>${esc(name)}</b>؟</p>
  <div class="card" style="font-size:.85rem;white-space:pre-wrap">${esc(msg)}</div>
  <div class="row"><button class="btn o w" onclick="closeModal()">لاحقاً</button><button class="btn gr w" id="wa-go">📱 إرسال</button></div>`);
  $('#wa-go').onclick=()=>{whatsappSend(phone,name,msg);closeModal()};
}
const remind=c=>whatsappSend(c.phone,c.name,`نذكّرك بأن رصيد حسابك المستحق *${n2(c.balance)} ${S.settings.currency}*.\nكشف حسابك: ${link(c.id)}`);

/* ===== ✨ قارئ الباركود ===== */
window.openScanner=cb=>{
  S._scanCb=cb;
  modal(`<h2>📷 امسح الباركود</h2>
  <div id="scanbox"></div>
  <div id="scanres" class="hint" style="padding:8px 0">وجّه الكاميرا نحو الباركود</div>
  <button class="btn o w" id="stopscan">إغلاق</button>`);
  $('#stopscan').onclick=()=>{window.stopScanner();closeModal()};
  need('scan').then(()=>{
    S.scanner=new Html5Qrcode("scanbox",{verbose:false});
    S.scanner.start(
      {facingMode:"environment"},
      {fps:12,qrbox:{width:250,height:250},aspectRatio:1.0},
      code=>{
        if(S._lastScan===code)return;
        S._lastScan=code;setTimeout(()=>{S._lastScan=null},1500);
        buzz();window.stopScanner();closeModal();
        if(S._scanCb)S._scanCb(code);
      },
      ()=>{}
    ).catch(e=>{
      const r=$('#scanres');if(r)r.innerHTML=`<b class="due">تعذّر فتح الكاميرا</b><br><small>${esc(e.message||'تأكد من إذن الكاميرا')}</small>`;
    });
  }).catch(()=>{
    const r=$('#scanres');if(r)r.innerHTML='<b class="due">تعذّر تحميل مكتبة المسح</b><br><small>يحتاج إنترنت مرة واحدة</small>';
  });
};
window.stopScanner=()=>{
  if(S.scanner){
    try{S.scanner.stop().then(()=>{try{S.scanner.clear()}catch(e){}}).catch(()=>{})}catch(e){}
    S.scanner=null;
  }
};

function nav(){
  const grp={customer:'customers',sale:'sales','sale-new':'sales'};
  const cur=grp[S.view]||(['dashboard','customers','sales'].includes(S.view)?S.view:'more');
  const it=[['dashboard','🏠','الرئيسية'],['customers','👥','العملاء'],['fab','+',''],['sales','🧾','المبيعات'],['more','☰','المزيد']];
  N.innerHTML=it.map(([v,i,l])=>v==='fab'?`<a class="fab" data-v="fab">+</a>`:`<a class="${cur===v?'on':''}" data-v="${v}"><span>${i}</span><small>${l}</small></a>`).join('');
  N.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>e.dataset.v==='fab'?quickSheet():go(e.dataset.v));
}
const V={dashboard:()=>dash(),customers:()=>customersList(),customer:()=>partyPage('customer'),suppliers:()=>suppliersList(),supplier:()=>partyPage('supplier'),
products:()=>productsList(),sales:()=>docList('sale'),'sale-new':()=>invNew('sale'),purchases:()=>docList('purchase'),'purchase-new':()=>invNew('purchase'),
expenses:()=>expensesList(),employees:()=>employeesList(),employee:()=>employeePage(),reports:()=>reportsView(),ledger:()=>ledgerView(),settings:()=>settingsView(),more:()=>moreView()};
function render(){if(!S.user){loginView();return}nav();(V[S.view]||V.dashboard)()}

function quickSheet(){
  modal(`<h2>ماذا تريد أن تسجّل؟</h2><div class="g2" style="margin-top:12px">
  <button class="btn r" id="q1">🔴 تسجيل دين</button><button class="btn gr" id="q2">🟢 استلام دفعة</button>
  <button class="btn" id="q3">🧾 فاتورة بيع</button><button class="btn o" id="q4">💸 مصروف</button>
  <button class="btn o" id="q5">👤 عميل جديد</button><button class="btn o" id="q6">📥 فاتورة شراء</button></div>`);
  $('#q1').onclick=()=>pickCustomer('debt');$('#q2').onclick=()=>pickCustomer('payment');
  $('#q3').onclick=()=>{closeModal();go('sale-new')};$('#q4').onclick=()=>expenseForm();
  $('#q5').onclick=()=>customerForm();$('#q6').onclick=()=>{closeModal();go('purchase-new')};

function pickCustomer(type){

async function delTx(l,ent,kind){
  if(!l||!confirm('حذف هذه الحركة ('+n2(l.amount)+')؟ سيُعاد احتساب الرصيد.'))return;
  try{
    const delta=l.dir==='out'?-l.amount:l.amount;
    const col=kind==='customer'?'accounts':'suppliers';
    await deleteDoc(doc(db,'ledger',l.id));
    await setDoc(doc(db,col,ent.id),{balance:increment(delta)},{merge:true});
    okMsg('تم حذف الحركة');
  }catch(err){console.error(err);toast('تعذّر الحذف: '+(err.code||err.message||''));}
}

    const amount=Number($('#am').value);if(!(amount>0))return toast('أدخل مبلغاً صحيحاً');

    if(isDebt&&isCust&&ent.limit>0&&newB>ent.limit&&!confirm('هذا الدين يتجاوز سقف العميل ('+n2(ent.limit)+'). هل تريد المتابعة؟'))return;
    const svBtn=$('#sv');svBtn.disabled=true;svBtn.textContent='جارٍ الحفظ...';$('#err').style.display='none';
    try{
      const col=isCust?'accounts':'suppliers',extra=isCust?{accountId:ent.id}:{supplierId:ent.id};
      await setDoc(newLedgerRef(),ledgerData(isDebt?'debt':'payment',isDebt?'دين':'دفعة',amount,isDebt?'out':'in',isDebt?0:(isCust?amount:-amount),{...extra,note:$('#nt').value.trim()}));
      await setDoc(doc(db,col,ent.id),{balance:increment(isDebt?amount:-amount)},{merge:true});
      closeModal();okMsg('✅ تم التسجيل بنجاح');
      const note=$('#nt').value.trim(),cur=S.settings.currency||'ر.ي',now=new Date();

      if(note)m+=`📝 ملاحظات: ${note}\n`;
      m+=`📊 إجمالي حسابك الحالي: ${newB} ${cur}\n📅 التاريخ: ${now.toLocaleDateString('ar-EG')} - ${now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}\n\n`+(isDebt?'شكراً لثقتكم بنا 🌹':'شكراً لالتزامكم بالسداد 💚');
      if(isCust&&navigator.onLine&&window.notifyCustomer)try{window.notifyCustomer(ent.id,m,S.settings.name)}catch(e){}
      if(isCust&&ent.phone)setTimeout(()=>notifyDebt(ent.name,ent.phone,amount,newB,isDebt?'debt':'payment'),450);
    }catch(e){console.error(e);$('#err').textContent='فشل: '+(e.code||e.message||'خطأ');$('#err').style.display='block';svBtn.disabled=false;svBtn.textContent='تأكيد'}};
}

async function saveInv(kind){
  if(!S.cart.length)return toast('أضف أصنافاً');
  const sl=kind==='sale',pid=$('#party').value,p=(sl?S.customers:S.suppliers).find(x=>x.id===pid);
  const total=sum(S.cart,i=>i.qty*i.price),paid=Math.max(0,Math.min(Number($('#paid').value)||0,total)),due=total-paid;
  if(due>0&&!p)return toast(sl?'اختر عميلاً للبيع الآجل':'اختر مورداً للشراء الآجل');
  const svBtn=$('#save');svBtn.disabled=true;svBtn.textContent='جارٍ الحفظ...';
  const ref=doc(collection(db,sl?'sales':'purchases')),idf=sl?'accountId':'supplierId',pc=sl?'accounts':'suppliers';
  const rec={owner:S.user.uid,ts:Date.now(),[sl?'customerId':'supplierId']:pid||null,[sl?'customerName':'supplierName']:p?.name||(sl?'عميل نقدي':'مورد نقدي'),
    items:S.cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price})),total,paid,due};
  const saved={id:ref.id,ts:Date.now(),[sl?'customerName':'supplierName']:p?.name||(sl?'عميل نقدي':'مورد نقدي'),items:[...S.cart],total,paid,due};
  try{
    await setDoc(ref,rec);
    for(const i of S.cart){
      try{
        if(sl)await setDoc(doc(db,'products',i.id),{stock:increment(-i.qty)},{merge:true});
        else await setDoc(doc(db,'products',i.id),{stock:increment(i.qty),cost:i.price},{merge:true});
      }catch(e){console.warn('stock',e)}
    }
    if(paid>0)await setDoc(newLedgerRef(),ledgerData(sl?'sale':'purchase',sl?'فاتورة بيع':'فاتورة شراء',paid,sl?'in':'out',sl?paid:-paid,{ref:ref.id}));
    if(due>0){
      await setDoc(newLedgerRef(),ledgerData(sl?'sale':'purchase',sl?'فاتورة بيع آجل':'فاتورة شراء آجل',due,'out',0,{[idf]:pid,ref:ref.id}));
      await setDoc(doc(db,pc,pid),{balance:increment(due)},{merge:true});
    }
    S.formOpen=false;S.cart=[];okMsg('✅ تم حفظ الفاتورة');go(sl?'sales':'purchases',null,true);
    setTimeout(()=>{modal(`<h2>تم حفظ الفاتورة ✅</h2><p style="margin:10px 0;font-size:.9rem">هل تريد طباعة الفاتورة؟</p><div class="row"><button class="btn o w" onclick="closeModal()">إغلاق</button><button class="btn w" id="pv">🖨️ طباعة PDF</button></div>`);
      $('#pv').onclick=()=>{closeModal();invoicePDF(saved,kind)}},500);
  }catch(err){console.error(err);toast('فشل حفظ الفاتورة: '+(err.code||err.message||''));svBtn.disabled=false;svBtn.textContent='💾 حفظ الفاتورة';}
}

      await setDoc(doc(db,'employees',emp.id),{balance:increment(Lb.sign*amount)},{merge:true});
      closeModal();okMsg('✅ تم التسجيل');
    }catch(err){console.error(err);$('#err').textContent='فشل: '+(err.code||err.message);$('#err').style.display='block';b.disabled=false;b.textContent='تأكيد';}
  };
}

/* ===== التقارير ===== */
function reportsView(){
  const now=Date.now(),from={d:startDay(now),w:startDay(now-6*864e5),m:startDay(new Date(new Date().getFullYear(),new Date().getMonth(),1)),a:0}[S.per];
  const P=a=>a.filter(x=>x.ts>=from),sa=sum(P(S.sales),s=>s.total),pu=sum(P(S.purchases),s=>s.total),ex=sum(P(S.expenses),e=>e.amount);
  const recv=sum(S.customers,c=>pos(c.balance)),pay=sum(S.suppliers,s=>pos(s.balance)),adv=sum(S.employees,e=>pos(e.balance)),cash=sum(S.ledger,l=>l.cash),inv=sum(S.products,p=>(p.stock||0)*(p.cost||0));
  const prof=sa-pu-ex,per=[['d','اليوم'],['w','7 أيام'],['m','الشهر'],['a','الكل']];
  A.innerHTML=`<div class="top"><h1>التقارير</h1><button class="btn g sm" id="pd">تصدير PDF</button></div>
  <div class="chips">${per.map(([v,l])=>`<div class="chip ${S.per===v?'on':''}" data-p="${v}">${l}</div>`).join('')}</div>
  <div class="g2"><div class="stat"><div class="l">المبيعات</div><div class="n ok">${fmt(sa)}</div></div><div class="stat"><div class="l">المشتريات</div><div class="n warn">${fmt(pu)}</div></div>
  <div class="stat"><div class="l">المصروفات</div><div class="n due">${fmt(ex)}</div></div><div class="stat"><div class="l">صافي الربح التقديري</div><div class="n ${prof>=0?'ok':'due'}">${fmt(prof)}</div></div></div>
  <div class="card"><b>المبيعات آخر 7 أيام</b><canvas id="ch" height="150"></canvas></div>
  <div class="card"><b>الوضع المالي الحالي</b><table>${[['النقدية بالصندوق',cash,'ok'],['ديون العملاء',recv,'due'],['مستحق للموردين',pay,'warn'],['سحبيات الموظفين',adv,'purple'],['قيمة المخزون',inv,'blue']].map(([l,v,c])=>`<tr><td>${l}</td><td class="${c}"><b>${fmt(v)}</b></td></tr>`).join('')}</table></div>`;
  A.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{S.per=e.dataset.p;reportsView()});
  $('#pd').onclick=()=>exportPDF('تقرير مالي شامل',`<table border="1" cellspacing="0" cellpadding="8" style="width:100%;border-collapse:collapse;font-size:13px"><tr style="background:#eef3f0"><th>البند</th><th>المبلغ</th></tr>${[['المبيعات',sa],['المشتريات',pu],['المصروفات',ex],['صافي الربح التقديري',prof],['النقدية بالصندوق',cash],['ديون العملاء',recv],['مستحق للموردين',pay],['سحبيات الموظفين',adv],['قيمة المخزون',inv]].map(([l,v])=>`<tr><td>${l}</td><td>${fmt(v)}</td></tr>`).join('')}</table>`);
  const days=[],vals=[];for(let i=6;i>=0;i--){const t0=startDay(now-i*864e5);days.push(new Date(t0).toLocaleDateString('ar-EG',{weekday:'short'}));vals.push(sum(S.sales.filter(s=>s.ts>=t0&&s.ts<t0+864e5),s=>s.total))}
  if(S.chart){S.chart.destroy();S.chart=null}
  need('chart').then(()=>{if(!$('#ch'))return;S.chart=new Chart($('#ch'),{type:'bar',data:{labels:days,datasets:[{data:vals,backgroundColor:'#f4a93a',borderRadius:8}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}).catch(()=>{$('#ch').outerHTML='<p class="hint">الرسم البياني يحتاج إنترنت مرة واحدة</p>'});
}

/* ===== PDF ===== */
function exportPDF(title,html){
  const box=document.createElement('div');box.style.cssText='font-family:Tahoma,Arial;direction:rtl;padding:20px;color:#111;background:#fff;width:760px';
  box.innerHTML=`<h2 style="color:#14283b;text-align:center;margin:0">${esc(S.settings.name)}</h2><h3 style="text-align:center;margin:6px 0 18px">${esc(title)}</h3>${html}<div style="margin-top:28px;text-align:center;font-size:11px;color:#888">تم الإنشاء: ${new Date().toLocaleString('ar-EG')}</div>`;
  document.body.appendChild(box);
  need('pdf').then(()=>html2pdf().set({margin:10,filename:title.replace(/[^\w\u0600-\u06FF]+/g,'_')+'.pdf',html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(box).save().then(()=>box.remove()).catch(()=>{box.remove();toast('تعذّر التصدير')})).catch(()=>{box.remove();toast('تعذّر تحميل المكتبة — تحقق من الاتصال')});
}
const tbl=(h,r)=>`<table border="1" cellspacing="0" cellpadding="6" style="width:100%;border-collapse:collapse;font-size:12px"><tr style="background:#eef3f0">${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r||`<tr><td colspan="${h.length}">لا توجد حركات</td></tr>`}</table>`;
function statementPDF(ent,txs,kind){
  exportPDF((kind==='customer'?'كشف حساب عميل - ':'كشف حساب مورد - ')+ent.name,tbl(['التاريخ','البيان','ملاحظة','المبلغ'],txs.map(l=>`<tr><td>${dOnly(l.ts)}</td><td>${esc(l.label)}</td><td>${esc(l.note||'')}</td><td style="color:${l.dir==='in'?'#1f9d6b':'#e5484d'}">${l.dir==='in'?'+':'-'}${n2(l.amount)}</td></tr>`).join(''))+`<h3 style="margin-top:14px">الرصيد الحالي: ${fmt(ent.balance||0)}</h3>`);
}
function employeeStatementPDF(emp,txs){
  exportPDF('كشف حساب موظف - '+emp.name,`<p style="font-size:13px;margin-bottom:10px"><b>الوظيفة:</b> ${esc(emp.position||'—')} &nbsp; <b>الراتب:</b> ${fmt(emp.salary||0)}</p>`+tbl(['التاريخ','البيان','ملاحظة','المبلغ'],txs.map(l=>`<tr><td>${dOnly(l.ts)}</td><td>${esc(l.label)}</td><td>${esc(l.note||'')}</td><td>${n2(l.amount)}</td></tr>`).join(''))+`<h3 style="margin-top:14px">الرصيد: ${fmt(emp.balance||0)}</h3>`);
}
function invoicePDF(rec,kind){
  const sl=kind==='sale',party=sl?(rec.customerName||'عميل نقدي'):(rec.supplierName||'مورد نقدي');
  exportPDF((sl?'فاتورة بيع':'فاتورة شراء')+' رقم '+(rec.id||'').slice(-6).toUpperCase(),
  `<div style="display:flex;justify-content:space-between;margin-bottom:14px;font-size:13px"><div><b>${sl?'العميل':'المورد'}:</b> ${esc(party)}</div><div><b>التاريخ:</b> ${dt(rec.ts)}</div></div>
  ${tbl(['#','الصنف','الكمية','السعر','الإجمالي'],rec.items.map((i,x)=>`<tr><td>${x+1}</td><td>${esc(i.name)}</td><td>${n2(i.qty)}</td><td>${n2(i.price)}</td><td>${n2(i.qty*i.price)}</td></tr>`).join('')+`<tr style="font-weight:bold"><td colspan="4">الإجمالي</td><td>${fmt(rec.total)}</td></tr><tr><td colspan="4">المدفوع</td><td>${fmt(rec.paid)}</td></tr>${rec.due>0?`<tr><td colspan="4">المتبقي (آجل)</td><td style="color:#e5484d;font-weight:bold">${fmt(rec.due)}</td></tr>`:''}`)}
  <p style="margin-top:20px;text-align:center;font-size:12px;color:#6b7b72">شكراً لتعاملكم معنا 🌹<br>${esc(S.settings.name)} ${S.settings.phone?'· '+esc(S.settings.phone):''}</p>`);
}

/* ===== واجهة العميل العامة ===== */
function publicView(tk){
  N.innerHTML='';
  A.innerHTML=`<div style="text-align:center;padding:18px 0 6px"><img class="lg" src="icon-192.png" alt=""><h1>كشف حساب</h1><small id="pub-store">جاري التحميل...</small></div>
  <div class="card nc" id="notifCard"></div>
  <div class="hero" id="acc" style="text-align:center"><small>جاري تحميل البيانات...</small></div>
  <div class="g2" id="pub-summary" style="display:none"><div class="stat"><div class="l">إجمالي الديون</div><div class="n due" id="pub-debt">0</div></div><div class="stat"><div class="l">إجمالي الدفعات</div><div class="n ok" id="pub-pay">0</div></div></div>
  <div class="sec">سجل الحركات</div><div class="card" id="txs"><p class="hint">لا توجد حركات بعد</p></div>
  <button class="btn w" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>`;
  refreshPubNotifCard();
  onSnapshot(doc(db,'accounts',tk),s=>{
    if(!s.exists()){$('#acc').innerHTML='<small>الرابط غير صحيح.</small>';return}
    const a=s.data(),b=a.balance||0;$('#pub-store').textContent=S.settings.name||'كشف حسابي';
    $('#acc').innerHTML=`<div class="av" style="margin:0 auto 8px;width:58px;height:58px;background:rgba(255,255,255,.12);color:#fff">${esc(initials(a.name))}</div><h2>${esc(a.name)}</h2>
    <div class="big" style="margin:6px 0">${n2(Math.abs(b))} ${esc(a.currency||'')}</div><small>${b>0?'المبلغ المطلوب منك':b<0?'رصيد لك':'الحساب مسدد ✅'}</small>`});
  const pt=arr=>arr.map(d=>{const x=d.data?d.data():d;return{id:d.id,amount:Number(x.amount)||0,label:x.label||(x.type==='debt'?'دين':'دفعة'),note:x.note||'',ts:x.ts||Date.now(),dir:x.dir||(x.type==='debt'?'out':'in')}});
  const all={l:[],o:[]};
  const rt=()=>{const m=[...all.l,...all.o].sort((a,b)=>b.ts-a.ts);
    $('#pub-debt').textContent=fmt(sum(m.filter(t=>t.dir==='out'),t=>t.amount));$('#pub-pay').textContent=fmt(sum(m.filter(t=>t.dir==='in'),t=>t.amount));
    $('#pub-summary').style.display=m.length?'grid':'none';
    $('#txs').innerHTML=m.map(t=>`<div class="tx"><div><b style="font-size:.88rem">${esc(t.label)}</b><br><small>${dt(t.ts)} ${t.note?'· '+esc(t.note):''}</small></div><b class="${t.dir==='in'?'ok':'due'}">${t.dir==='in'?'−':'+'}${n2(t.amount)}</b></div>`).join('')||'<p class="hint">لا توجد حركات مسجلة بعد</p>'};
  onSnapshot(query(collection(db,'ledger'),where('accountId','==',tk)),s=>{all.l=pt(s.docs);rt()});
  onSnapshot(query(collection(db,'accounts',tk,'tx'),orderBy('ts','desc')),s=>{all.o=pt(s.docs);rt()},e=>console.log('no old tx'));
}
function refreshPubNotifCard(){
  const card=$('#notifCard');if(!card)return;
  card.style.display='';
  const supported=('Notification' in window)&&('serviceWorker' in navigator)&&('PushManager' in window);
  if(!supported){card.innerHTML='<span class="bell">🔕</span><h3>الإشعارات غير مدعومة</h3><p>استخدم Chrome أو Safari حديث</p>';return}
  const p=Notification.permission;
  if(p==='granted'){card.innerHTML='<span class="bell">🔔</span><h3>الإشعارات مُفعّلة ✅</h3><p>ستصلك الفواتير والدفعات لحظة تسجيلها</p>';return}
  if(p==='denied'){
    card.innerHTML='<span class="bell">🔕</span><h3>الإشعارات محظورة</h3><p>لتفعيلها اتبع:</p><ol><li>اضغط على 🔒 بجانب الرابط</li><li>اختر «الإشعارات» ← «السماح»</li><li>أعد تحميل الصفحة</li></ol><button id="pubNotifBtn">🔄 أعد المحاولة</button>';
  }else{
    card.innerHTML='<span class="bell">🔔</span><h3>فعّل الإشعارات</h3><p>لتصلك الفواتير والدفعات لحظة تسجيلها على حسابك</p><button id="pubNotifBtn">✅ تفعيل الإشعارات الآن</button>';
  }
  $('#pubNotifBtn').onclick=()=>activateCustomerNotifications(new URLSearchParams(location.search).get('c'));
}
async function activateCustomerNotifications(tk){
  if(!(('Notification' in window)&&('serviceWorker' in navigator)&&('PushManager' in window)))
    return alert('متصفحك لا يدعم الإشعارات.\nاستخدم Chrome أو Safari حديث.');
  if(/iPad|iPhone|iPod/.test(navigator.userAgent)&&!(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true))
    return alert('لتشغيل الإشعارات على iPhone:\n\n1) اضغط زر المشاركة 📤 في Safari\n2) اختر «إضافة إلى الشاشة الرئيسية»\n3) افتح التطبيق من الأيقونة الجديدة\n4) اضغط «تفعيل» مرة أخرى');
  if(Notification.permission==='denied'){
    alert('الإشعارات محظورة من إعدادات المتصفح.\n\nلتفعيلها:\n1) اضغط على 🔒 بجانب الرابط\n2) اختر «الإشعارات» ← «السماح»\n3) أعد تحميل الصفحة');
    refreshPubNotifCard();return;
  }
  const btn=$('#pubNotifBtn');
  if(btn){btn.disabled=true;btn.textContent='⏳ جارٍ التفعيل...'}
  try{
    const t0=Date.now();
    while(typeof window.enablePushNotifications!=='function'){
      if(Date.now()-t0>8000)throw new Error('لم يُحمَّل push.js — أعد تحميل الصفحة');
      await new Promise(r=>setTimeout(r,100));
    }
    await Promise.race([
      window.enablePushNotifications(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('انتهت مهلة التفعيل — تحقق من الإنترنت')),25000))
    ]);
    toast('✅ تم تفعيل الإشعارات بنجاح');
    setTimeout(refreshPubNotifCard,600);
  }catch(e){
    console.error('push error:',e);
    toast('تعذّر التفعيل: '+(e.message||''));
    setTimeout(refreshPubNotifCard,400);
  }finally{
    if(btn&&btn.isConnected){btn.disabled=false;btn.textContent='✅ تفعيل الإشعارات الآن'}
  }
}

/* ===== التهيئة ===== */
try{Object.assign(S.settings,JSON.parse(localStorage.st||'{}'))}catch(e){}
async function loadSettings(){try{const d=await getDoc(doc(db,'settings',S.user.uid));if(d.exists()){S.settings={...S.settings,...d.data()};try{localStorage.st=JSON.stringify(S.settings)}catch(e){}}}catch(e){}}
function attach(){
  S.unsubs.forEach(u=>u());S.unsubs=[];S.pend={};const u=S.user.uid;
  const sub=(col,cb)=>{let first=true;
    S.unsubs.push(onSnapshot(query(collection(db,col),where('owner','==',u)),{includeMetadataChanges:true},s=>{
      S.pend[col]=s.metadata.hasPendingWrites;updateSync();
      if(first||s.docChanges().length){first=false;cb(s.docs.map(d=>({id:d.id,...d.data()})));if(!S.formOpen)render()}}))};
  const byTs=d=>d.sort((a,b)=>b.ts-a.ts);
  sub('accounts',d=>S.customers=d);sub('suppliers',d=>S.suppliers=d);sub('products',d=>S.products=d);
  sub('sales',d=>S.sales=byTs(d));sub('purchases',d=>S.purchases=byTs(d));sub('expenses',d=>S.expenses=byTs(d));sub('ledger',d=>S.ledger=byTs(d));
  sub('employees',d=>S.employees=d.sort((a,b)=>a.name.localeCompare(b.name)));
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const tk=new URLSearchParams(location.search).get('c');
if(tk)publicView(tk);
else{
  history.replaceState({root:1},'');history.pushState({v:'dashboard',d:1},'');D=1;
  onAuthStateChanged(auth,async u=>{S.user=u;if(u){loadSettings().then(()=>{if(!S.formOpen)render()});attach();render()}else{S.unsubs.forEach(x=>x());S.unsubs=[];S.pend={};updateSync();render()}});
}
