<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script type="module" src="push.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#059669">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>الكامل سوفت — نظام محاسبي متكامل</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
/* ============ Design System ============ */
:root{
  --p:#059669;--p2:#10b981;--p3:#047857;--p50:#ecfdf5;--p100:#d1fae5;
  --red:#ef4444;--red50:#fef2f2;--org:#f59e0b;--org50:#fffbeb;
  --blue:#3b82f6;--blue50:#eff6ff;--pur:#8b5cf6;--pur50:#f5f3ff;
  --bg:#f4f7f5;--sf:#ffffff;--sf2:#fbfcfb;--bd:#e8edea;
  --tx:#0f1f18;--mt:#64756b;
  --sh-sm:0 1px 3px rgba(15,31,24,.04);
  --sh:0 4px 16px rgba(15,31,24,.06);
  --sh-p:0 8px 24px rgba(5,150,105,.12);
  --sh-lg:0 20px 48px rgba(5,150,105,.18);
  --r-sm:10px;--r:14px;--r-lg:20px;--r-xl:28px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:'Cairo',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
body{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px 120px;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;top:-120px;right:-80px;width:280px;height:280px;background:radial-gradient(circle,rgba(16,185,129,.10),transparent 70%);border-radius:50%;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-100px;left:-60px;width:240px;height:240px;background:radial-gradient(circle,rgba(139,92,246,.08),transparent 70%);border-radius:50%;pointer-events:none;z-index:0}
#app,#nav,#toast,.modal{position:relative;z-index:1}
h1{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
a{text-decoration:none;color:inherit}
small{color:var(--mt);font-size:.75rem}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;width:100%;padding:14px 16px;border:1.5px solid var(--bd);border-radius:var(--r);font-size:.92rem;background:var(--sf);color:var(--tx);transition:all .2s var(--ease);outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(5,150,105,.10)}
input::placeholder,textarea::placeholder{color:#9aa8a0}
label{font-size:.78rem;color:var(--mt);font-weight:600;display:block;margin:10px 0 4px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:right}

/* ============ Cards ============ */
.card{background:var(--sf);border-radius:var(--r-lg);padding:16px;margin:10px 0;border:1px solid var(--bd);box-shadow:var(--sh-sm)}
.card-flat{background:var(--sf);border-radius:var(--r-lg);padding:16px;margin:10px 0;border:1px solid var(--bd)}
.card-hero{background:linear-gradient(135deg,var(--p3) 0%,var(--p) 45%,var(--p2) 100%);color:#fff;border:0;box-shadow:var(--sh-lg);padding:22px 20px;position:relative;overflow:hidden}
.card-hero::before{content:'';position:absolute;top:-50%;right:-30%;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);border-radius:50%}
.card-hero::after{content:'';position:absolute;bottom:-60%;left:-20%;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%);border-radius:50%}
.card-hero>*{position:relative;z-index:1}

/* ============ Buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:var(--r);font-size:.92rem;font-weight:700;background:var(--p);color:#fff;transition:all .18s var(--ease);box-shadow:0 2px 8px rgba(5,150,105,.20)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn.o{background:var(--sf);color:var(--p);border:1.5px solid var(--p);box-shadow:none}
.btn.g{background:var(--sf2);color:var(--tx);border:1.5px solid var(--bd);box-shadow:none}
.btn.r{background:var(--red)}
.btn.o.r{background:var(--sf);color:var(--red);border-color:var(--red);box-shadow:none}
.btn.p{background:var(--pur)}
.btn.o.p{background:var(--sf);color:var(--pur);border-color:var(--pur);box-shadow:none}
.btn.o.pur{background:var(--sf);color:var(--pur);border-color:var(--pur);box-shadow:none}
.btn.w{width:100%}
.btn.sm{padding:8px 12px;font-size:.8rem;border-radius:var(--r-sm);box-shadow:none}
.btn.icon{padding:11px;width:44px;height:44px;border-radius:50%}

/* ============ Layout ============ */
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row-c{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stack{display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 10px;gap:10px}
.top .actions{display:flex;gap:6px}

/* ============ Stats ============ */
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 12px;text-align:right;box-shadow:var(--sh-sm);position:relative;overflow:hidden;transition:all .2s var(--ease)}
.stat .l{font-size:.7rem;color:var(--mt);font-weight:600;margin-bottom:6px;display:block}
.stat .n{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;display:block;direction:ltr;text-align:right}
.stat .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:1.4rem;opacity:.14}
.stat.ok{border-color:rgba(5,150,105,.25);background:linear-gradient(135deg,var(--sf) 60%,var(--p50))}
.stat.due{border-color:rgba(239,68,68,.20);background:linear-gradient(135deg,var(--sf) 60%,var(--red50))}
.stat.warn{border-color:rgba(245,158,11,.25);background:linear-gradient(135deg,var(--sf) 60%,var(--org50))}
.stat.info{border-color:rgba(59,130,246,.22);background:linear-gradient(135deg,var(--sf) 60%,var(--blue50))}
.stat.pur{border-color:rgba(139,92,246,.22);background:linear-gradient(135deg,var(--sf) 60%,var(--pur50))}

/* ============ Hero ============ */
.hero-stat{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.hero-stat .lbl{font-size:.78rem;opacity:.85;font-weight:500}
.hero-stat .val{font-size:1.9rem;font-weight:900;letter-spacing:-.03em;direction:ltr;text-align:right}
.hero-stat .cur{font-size:.85rem;opacity:.85;font-weight:600}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.20)}
.hero-mini{display:flex;flex-direction:column;gap:2px}
.hero-mini .k{font-size:.7rem;opacity:.85}
.hero-mini .v{font-size:.95rem;font-weight:800;direction:ltr;text-align:right}

/* ============ Avatar ============ */
.avatar{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;flex-shrink:0;background:var(--p50);color:var(--p);transition:transform .2s var(--ease)}
.avatar.lg{width:70px;height:70px;font-size:1.6rem;border-radius:22px}
.avatar.org{background:var(--org50);color:var(--org)}
.avatar.pur{background:var(--pur50);color:var(--pur)}
.avatar.blue{background:var(--blue50);color:var(--blue)}

/* ============ List Items ============ */
.item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd);cursor:pointer;transition:all .15s var(--ease)}
.item:last-child{border-bottom:0}
.item:active{opacity:.7}
.item .info{flex:1;min-width:0}
.item .info b{font-size:.92rem;display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .info small{display:block;margin-top:2px}
.item .amt{font-weight:800;font-size:.92rem;direction:ltr;text-align:left}
.item .amt small{display:block;font-weight:500;margin-top:2px;font-size:.7rem}

/* ============ Chips ============ */
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--sf);border:1.5px solid var(--bd);color:var(--mt);white-space:nowrap;cursor:pointer;transition:all .18s var(--ease)}
.chip.on{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 3px 10px rgba(5,150,105,.20)}
.chip:active{transform:scale(.96)}

/* ============ Search ============ */
.search-wrap{position:relative}
.search-wrap::before{content:'🔍';position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:.95rem;opacity:.5;pointer-events:none}
.search-wrap input{padding-right:44px}

/* ============ Bottom Nav ============ */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--bd);display:flex;padding:8px 8px max(8px,env(safe-area-inset-bottom));z-index:50;box-shadow:0 -8px 32px rgba(0,0,0,.06)}
#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mt);font-size:.65rem;font-weight:700;padding:6px 4px;border-radius:14px;cursor:pointer;transition:all .2s var(--ease);position:relative}
#nav a .ico{font-size:1.25rem;line-height:1;transition:transform .2s var(--ease)}
#nav a.on{color:var(--p)}
#nav a.on .ico{transform:translateY(-2px) scale(1.08)}
#nav a.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:0 0 4px 4px;background:var(--p)}

/* ============ Floating Action Button ============ */
.fab{position:fixed;bottom:96px;left:50%;transform:translateX(calc(-50% + 200px));width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:300;box-shadow:0 12px 28px rgba(5,150,105,.35);z-index:55;transition:all .2s var(--ease);cursor:pointer;border:0}
.fab:active{transform:translateX(calc(-50% + 200px)) scale(.92)}
@media(max-width:560px){.fab{left:auto;right:20px;transform:none}.fab:active{transform:scale(.92)}}

/* ============ Modal / Bottom Sheet ============ */
.modal{position:fixed;inset:0;background:rgba(10,25,18,.55);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:200;opacity:0;transition:opacity .25s var(--ease)}
.modal.open{display:flex;opacity:1}
.modal-box{background:var(--sf);width:100%;max-width:560px;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:12px 20px max(20px,env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s var(--ease);position:relative}
.modal.open .modal-box{transform:translateY(0)}
.modal-box::before{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:2px;background:var(--bd)}
.modal-box h2{margin:14px 0 4px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1}

/* ============ Toast ============ */
#toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:#fff;padding:12px 22px;border-radius:999px;display:none;z-index:100;font-size:.85rem;font-weight:600;max-width:88%;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.20);opacity:0;transition:all .3s var(--ease)}
#toast.show{display:block;opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ Transactions ============ */
.tx{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--bd)}
.tx:last-child{border:0}
.tx-ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;flex-shrink:0}
.tx-ico.in{background:var(--p50);color:var(--p)}
.tx-ico.out{background:var(--red50);color:var(--red)}
.tx-ico.neutral{background:var(--blue50);color:var(--blue)}
.tx-info{flex:1;min-width:0}
.tx-info b{display:block;font-size:.86rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-info small{display:block;margin-top:2px}
.tx-amt{font-weight:800;font-size:.9rem;direction:ltr;text-align:left;flex-shrink:0}
.tx-amt.in{color:var(--p)}
.tx-amt.out{color:var(--red)}

/* ============ Public Page ============ */
.pub-header{text-align:center;padding:30px 0 16px}
.pub-logo{width:72px;height:72px;background:linear-gradient(135deg,var(--p3),var(--p2));color:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 12px;box-shadow:0 12px 28px rgba(5,150,105,.30)}
.pub-card{background:var(--sf);border-radius:var(--r-lg);padding:18px;margin-bottom:12px;border:1px solid var(--bd);box-shadow:var(--sh-sm)}
.pub-hero{background:linear-gradient(135deg,var(--p3),var(--p2));color:#fff;border:0;text-align:center;padding:26px 20px;box-shadow:var(--sh-lg)}
.pub-hero .avatar{background:rgba(255,255,255,.20);color:#fff;margin:0 auto 12px}
.pub-hero h2{font-size:1.1rem}
.pub-hero .big{font-size:2rem;font-weight:900;letter-spacing:-.03em;margin:10px 0;direction:ltr}
.pub-status{display:inline-block;padding:5px 14px;border-radius:999px;font-size:.72rem;font-weight:700;background:rgba(255,255,255,.22);color:#fff}
.pub-stat{text-align:center;padding:12px;background:var(--sf2);border-radius:var(--r);border:1px solid var(--bd)}
.pub-stat small{display:block;margin-bottom:6px;font-weight:600}
.pub-stat b{font-size:1.05rem;font-weight:800;direction:ltr}
.pub-tx{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dashed var(--bd)}
.pub-tx:last-child{border:0}
.pub-tx-ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:800;flex-shrink:0}
.pub-tx-ico.in{background:var(--p50);color:var(--p)}
.pub-tx-ico.out{background:var(--red50);color:var(--red)}

/* Notif card */
.notif-card{background:linear-gradient(135deg,#065f46,#059669,#10b981);color:#fff;text-align:center;padding:22px 18px;border:0;box-shadow:0 12px 32px rgba(5,150,105,.28);position:relative;overflow:hidden}
.notif-card::before{content:'';position:absolute;top:-40%;right:-20%;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);border-radius:50%}
.notif-card>*{position:relative;z-index:1}
.notif-card .bell{font-size:2.6rem;display:block;margin-bottom:8px;animation:bell 2s ease-in-out infinite}
@keyframes bell{0%,100%{transform:rotate(0)}10%,30%{transform:rotate(12deg)}20%,40%{transform:rotate(-12deg)}}
.notif-card h3{font-size:1rem;margin-bottom:6px;font-weight:800}
.notif-card p{font-size:.78rem;opacity:.95;line-height:1.6;margin-bottom:14px}
.notif-card .activate-btn{background:#fff;color:var(--p3);border:0;border-radius:var(--r);padding:13px 18px;font-weight:800;font-size:.9rem;width:100%;box-shadow:0 4px 14px rgba(0,0,0,.15);transition:transform .15s var(--ease)}
.notif-card .activate-btn:active{transform:scale(.97)}
.notif-card .note{display:block;margin-top:8px;opacity:.85;font-size:.68rem}

/* ============ Empty State ============ */
.empty{text-align:center;padding:36px 16px;color:var(--mt)}
.empty .em{font-size:3rem;opacity:.4;display:block;margin-bottom:10px}
.empty p{font-size:.85rem;font-weight:600}
.empty small{display:block;margin-top:4px;font-size:.75rem}

/* ============ Skeleton ============ */
.skel{background:linear-gradient(90deg,#eef2f0 25%,#e0e7e3 50%,#eef2f0 75%);background-size:200% 100%;animation:skel 1.4s infinite;border-radius:8px}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ============ Animations ============ */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card,.stat,.item,.tx{animation:fadeUp .3s var(--ease) backwards}
.item:nth-child(1),.tx:nth-child(1){animation-delay:.02s}
.item:nth-child(2),.tx:nth-child(2){animation-delay:.04s}
.item:nth-child(3),.tx:nth-child(3){animation-delay:.06s}
.item:nth-child(4),.tx:nth-child(4){animation-delay:.08s}
.item:nth-child(5),.tx:nth-child(5){animation-delay:.10s}

/* ============ Section Header ============ */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px}
.sec-head h3{font-size:.95rem;font-weight:800;color:var(--tx)}
.sec-head a{font-size:.78rem;color:var(--p);font-weight:700}

/* ============ Misc ============ */
.due{color:var(--red)!important;font-weight:800}
.ok{color:var(--p)!important;font-weight:800}
.warn{color:var(--org)!important;font-weight:800}
.purple{color:var(--pur)!important;font-weight:800}
.big{font-size:1.7rem;font-weight:900;letter-spacing:-.03em;direction:ltr;text-align:right}
.hint{font-size:.75rem;color:var(--mt)}
.divider{height:1px;background:var(--bd);margin:12px 0}

@media print{#nav,.btn,.fab,.notif-card{display:none!important}body{background:#fff;padding:0}.pub-card,.card{border:1px solid #ccc;box-shadow:none;break-inside:avoid}}
</style>
</head>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const fb=initializeApp({apiKey:"AIzaSyDaLsIF93OD-Lr9y51j_s4wB9OzahLUiTQ",authDomain:"grocery-debts.firebaseapp.com",projectId:"grocery-debts",storageBucket:"grocery-debts.firebasestorage.app",messagingSenderId:"484535933298",appId:"1:484535933298:web:87f8e2ea08a6d26231e5eb"});
const auth=getAuth(fb),db=getFirestore(fb);

/* ============ أدوات ============ */
const $=s=>document.querySelector(s),A=$('#app'),N=$('#nav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const fmt=n=>n2(n)+' '+S.settings.currency;
const dt=ts=>new Date(ts).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
const dOnly=ts=>new Date(ts).toLocaleDateString('ar-EG');
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400)};
const newToken=()=>[...crypto.getRandomValues(new Uint8Array(20))].map(b=>b.toString(16).padStart(2,'0')).join('');
const link=t=>location.origin+location.pathname+'?c='+t;
const initials=s=>(s||'?').trim()[0]||'?';
const startDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime()};
const timeAgo=ts=>{const d=Date.now()-ts,m=Math.floor(d/60000),h=Math.floor(d/3600000),dy=Math.floor(d/86400000);
  if(m<1)return'الآن';if(m<60)return`قبل ${m} د`;if(h<24)return`قبل ${h} س`;if(dy<7)return`قبل ${dy} ي`;return dOnly(ts)};

/* ============ الحالة ============ */
const S={user:null,view:'dashboard',_authTab:'login',customerId:null,supplierId:null,employeeId:null,
customers:[],suppliers:[],products:[],sales:[],purchases:[],expenses:[],ledger:[],employees:[],
settings:{name:'الكامل سوفت',currency:'ر.ي',phone:'',address:'',autoWhatsApp:true},
cart:[],formOpen:false,q:'',filter:'',unsubs:[],chart:null};

function modal(h){$('#modalBox').innerHTML=h;$('#modal').classList.add('open')}
window.closeModal=()=>$('#modal').classList.remove('open');

/* ============ دفتر اليومية ============ */
function ledgerData(type,label,amount,dir,cash,extra={}){
  return{owner:S.user.uid,ts:Date.now(),type,label,amount:Math.abs(amount),dir,cash:cash||0,...extra};
}
function newLedgerRef(){return doc(collection(db,'ledger'))}

/* ============ واتساب ============ */
function whatsappSend(phone,name,msg){
  if(!phone)return toast('لا يوجد رقم هاتف مسجل');
  let p=phone.replace(/[^\d]/g,'');
  if(p.startsWith('00'))p=p.slice(2);
  if(!p.startsWith('967')){p=p.replace(/^0+/,'');p='967'+p;}
  const text=`السلام عليكم ${name} 🌟\n\n${msg}\n\n— ${S.settings.name}`;
  window.open('https://wa.me/'+p+'?text='+encodeURIComponent(text),'_blank');
}
function notifyDebt(name,phone,amount,balance,kind){
  if(!S.settings.autoWhatsApp||!phone)return;
  const isDebt=kind==='debt';
  const msg=isDebt
    ?`تم تسجيل دين بمبلغ *${n2(amount)} ${S.settings.currency}*\nالرصيد الحالي: *${n2(balance)} ${S.settings.currency}*\n\nشكراً لتعاملك معنا 🌹`
    :`تم تسجيل دفعة بمبلغ *${n2(amount)} ${S.settings.currency}*\nالرصيد المتبقي: *${n2(balance)} ${S.settings.currency}*\n\nشكراً لك 💚`;
  modal(`<h2>إشعار واتساب</h2>
  <p style="margin:10px 0;font-size:.9rem;color:#64756b">هل تريد إرسال إشعار واتساب إلى <b>${esc(name)}</b>؟</p>
  <div class="card" style="background:#fbfcfb;font-size:.85rem;white-space:pre-wrap;padding:12px">${esc(msg)}</div>
  <div class="modal-actions"><button class="btn o" onclick="closeModal()">لاحقاً</button>
  <button class="btn" id="wa-go">📱 إرسال</button></div>`);
  $('#wa-go').onclick=()=>{whatsappSend(phone,name,msg);closeModal()};
}

/* ============ التنقل ============ */
function go(v,id){
  S.view=v;S.formOpen=false;S.q='';S.cart=[];S.filter='';
  if(v==='customer')S.customerId=id;
  if(v==='supplier')S.supplierId=id;
  if(v==='employee')S.employeeId=id;
  window.scrollTo(0,0);render();
}
function nav(){
  const items=[['dashboard','🏠','الرئيسية'],['customers','👥','العملاء'],['sales','🛒','المبيعات'],
  ['employees','👷','الفريق'],['reports','📊','التقارير']];
  N.innerHTML=items.map(([v,i,l])=>{
    const on=S.view===v||(v==='customers'&&S.view==='customer')||(v==='employees'&&S.view==='employee');
    return `<a class="${on?'on':''}" data-v="${v}"><span class="ico">${i}</span><small>${l}</small></a>`;
  }).join('');
  N.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>go(e.dataset.v));
}
function fab(icon,onclick){
  const f=document.createElement('button');f.className='fab';f.innerHTML=icon;f.onclick=onclick;
  A.appendChild(f);
}

/* ============ Render Router ============ */
function render(){
  if(!S.user){loginView();return}
  nav();
  const v=S.view;
  if(v==='dashboard')dash();
  else if(v==='customers')customersList();
  else if(v==='customer')customerPage(S.customerId);
  else if(v==='suppliers')suppliersList();
  else if(v==='supplier')supplierPage(S.supplierId);
  else if(v==='products')productsList();
  else if(v==='sales')salesList();
  else if(v==='sale-new')saleNew();
  else if(v==='purchases')purchasesList();
  else if(v==='purchase-new')purchaseNew();
  else if(v==='expenses')expensesList();
  else if(v==='employees')employeesList();
  else if(v==='employee')employeePage(S.employeeId);
  else if(v==='reports')reportsView();
  else if(v==='ledger')ledgerView();
  else if(v==='settings')settingsView();
  else dash();
}

/* ============ تسجيل الدخول ============ */
function authErr(e){
  const c=e?.code||'';const m={
    'auth/invalid-email':'البريد غير صحيح','auth/user-not-found':'لا يوجد حساب بهذا البريد',
    'auth/wrong-password':'كلمة المرور غير صحيحة','auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة',
    'auth/email-already-in-use':'البريد مستخدم مسبقاً','auth/weak-password':'كلمة المرور قصيرة (6 أحرف على الأقل)',
    'auth/too-many-requests':'محاولات كثيرة، حاول لاحقاً','auth/network-request-failed':'تعذّر الاتصال',
    'auth/popup-closed-by-user':'أُغلقت نافذة الدخول','auth/popup-blocked':'المتصفح منع النافذة',
    'auth/missing-name':'اكتب اسمك الكامل'};
  return m[c]||('خطأ: '+c);
}
function loginView(){
  N.innerHTML='';
  A.innerHTML=`
  <div style="text-align:center;padding:56px 0 20px">
    <div class="pub-logo">📒</div>
    <h1 style="font-size:1.5rem">الكامل سوفت</h1>

  </div>
  <div class="card">
    <div class="chips" style="margin-bottom:12px">
      <button class="chip ${S._authTab==='login'?'on':''}" id="tab-login" style="flex:1;justify-content:center;text-align:center">دخول</button>
      <button class="chip ${S._authTab==='register'?'on':''}" id="tab-register" style="flex:1;justify-content:center;text-align:center">حساب جديد</button>
    </div>
    ${S._authTab==='register'?'<label>الاسم الكامل</label><input id="a-name" placeholder="مثال: أحمد محمد">':''}
    <label>البريد الإلكتروني</label>
    <input id="a-email" type="email" placeholder="you@email.com" autocomplete="email">
    <label>كلمة المرور</label>
    <input id="a-pass" type="password" placeholder="6 أحرف على الأقل" autocomplete="current-password">
    <button class="btn w" id="a-go" style="margin-top:16px">${S._authTab==='register'?'إنشاء الحساب':'تسجيل الدخول'}</button>
    ${S._authTab==='login'?'<div style="text-align:center;margin-top:12px"><a id="a-forgot" style="color:var(--p);font-size:.82rem;cursor:pointer;font-weight:700">نسيت كلمة المرور؟</a></div>':''}
    <div style="display:flex;align-items:center;gap:10px;margin:18px 0">

    </div>
    <button class="btn g w" id="g">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
      المتابعة بحساب جوجل

  </div>
  <p style="text-align:center;font-size:.72rem;color:var(--mt);margin-top:16px">سيتم الاحتفاظ بتسجيل دخولك تلقائياً</p>`;

  $('#tab-login').onclick=()=>{S._authTab='login';loginView()};
  $('#tab-register').onclick=()=>{S._authTab='register';loginView()};
  $('#a-go').onclick=async()=>{
    const email=$('#a-email').value.trim(),pass=$('#a-pass').value;
    if(!email||!pass)return toast('أدخل البريد وكلمة المرور');
    $('#a-go').disabled=true;
    try{
      await setPersistence(auth,browserLocalPersistence);
      if(S._authTab==='register'){
        const name=$('#a-name').value.trim();if(!name)throw{code:'auth/missing-name'};
        const cred=await createUserWithEmailAndPassword(auth,email,pass);

  };
  $('#g').onclick=async()=>{
    try{await setPersistence(auth,browserLocalPersistence);await signInWithPopup(auth,new GoogleAuthProvider())}
    catch(e){toast(authErr(e))}

/* ============ لوحة التحكم ============ */
function dash(){
  const cash=S.ledger.reduce((n,l)=>n+(l.cash||0),0);
  const recv=S.customers.reduce((n,c)=>n+Math.max(c.balance||0,0),0);
  const pay=S.suppliers.reduce((n,s)=>n+Math.max(s.balance||0,0),0);
  const empAdv=S.employees.reduce((n,e)=>n+Math.max(e.balance||0,0),0);
  const inv=S.products.reduce((n,p)=>n+(p.stock||0)*(p.cost||0),0);
  const t0=startDay(new Date());
  const tSales=S.sales.filter(s=>s.ts>=t0).reduce((n,s)=>n+(s.total||0),0);
  const tExp=S.expenses.filter(e=>e.ts>=t0).reduce((n,e)=>n+(e.amount||0),0);
  const net=cash+recv-pay-Math.max(empAdv,0);

  A.innerHTML=`
  <div class="top">
    <div>
      <small style="display:block;font-weight:600">مرحباً بك 👋</small>
      <h1>${esc(S.settings.name)}</h1>
    </div>
    <div class="actions">
      <button class="btn g sm" id="st">⚙️</button>
      <button class="btn g sm" id="lg">📒</button>
    </div>
  </div>

  <div class="card card-hero">
    <div class="hero-stat">
      <span class="lbl">الرصيد الصافي المتوقع</span>
      <span class="val">${n2(net)}<span class="cur"> ${esc(S.settings.currency)}</span></span>
    </div>
    <div class="hero-grid">
      <div class="hero-mini"><span class="k">💰 الصندوق</span><span class="v">${n2(cash)}</span></div>
      <div class="hero-mini"><span class="k">📥 ديون العملاء</span><span class="v">${n2(recv)}</span></div>
      <div class="hero-mini"><span class="k">📤 مستحق للموردين</span><span class="v">${n2(pay)}</span></div>
      <div class="hero-mini"><span class="k">📦 قيمة المخزون</span><span class="v">${n2(inv)}</span></div>
    </div>
  </div>

  <div class="grid2" style="margin-top:12px">
    <div class="stat ok"><span class="l">مبيعات اليوم</span><span class="n ok">${fmt(tSales)}</span><span class="ic">🛒</span></div>
    <div class="stat due"><span class="l">مصروفات اليوم</span><span class="n due">${fmt(tExp)}</span><span class="ic">💸</span></div>
  </div>

  <div class="sec-head"><h3>⚡ الوصول السريع</h3></div>
  <div class="grid3">
    ${quick('sale-new','🛒','بيع','ok')}${quick('purchase-new','📥','شراء','warn')}${quick('customers','👥','عملاء','')}
    ${quick('suppliers','🚚','موردين','warn')}${quick('expenses','💸','مصروف','due')}${quick('products','📦','مخزون','info')}
  </div>

  <div class="sec-head"><h3>📊 ملخص سريع</h3></div>
  <div class="grid3">
    <div class="stat pur"><span class="l">الفريق</span><span class="n">${S.employees.length}</span></div>
    <div class="stat due"><span class="l">سحبيات</span><span class="n due">${n2(empAdv)}</span></div>
    <div class="stat info"><span class="l">منتجات</span><span class="n">${S.products.length}</span></div>
  </div>

  <div class="sec-head"><h3>🕒 آخر الحركات</h3><a id="lg2">الكل ←</a></div>
  <div class="card">
    ${S.ledger.slice(0,6).map(txRow).join('')||emptyState('📭','لا توجد حركات بعد')}
  </div>`;

  $('#st').onclick=()=>go('settings');
  $('#lg').onclick=$('#lg2')?.onclick=()=>go('ledger');
  A.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));

function quick(v,i,l,cls=''){return `<div class="stat ${cls}" data-go="${v}" style="cursor:pointer;text-align:center;padding:16px 8px"><div style="font-size:1.6rem;margin-bottom:6px">${i}</div><div style="font-size:.75rem;font-weight:700">${l}</div></div>`}
function emptyState(em,txt,sub=''){return `<div class="empty"><span class="em">${em}</span><p>${txt}</p>${sub?`<small>${sub}</small>`:''}</div>`}
function txRow(l){
  const isIn=l.dir==='in';
  const icons={sale:'🛒',purchase:'📥',debt:'📌',payment:'💵',expense:'💸',advance:'💼',salary:'💰',bonus:'🎁',deduction:'⚠️'};
  const ic=icons[l.type]||'💱';
  return `<div class="tx">
    <div class="tx-ico ${isIn?'in':'out'}">${ic}</div>
    <div class="tx-info"><b>${esc(l.label||l.type)}</b><small>${timeAgo(l.ts)}${l.note?' · '+esc(l.note):''}</small></div>
    <span class="tx-amt ${isIn?'in':'out'}">${isIn?'+':'-'}${n2(l.amount)}</span>
  </div>`;
}

/* ============ العملاء ============ */
function customersList(){

  let list=S.customers.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.phone||'').includes(q));
  if(S.filter==='debt')list=list.filter(c=>(c.balance||0)>0);
  else if(S.filter==='clear')list=list.filter(c=>(c.balance||0)<=0);
  list.sort((a,b)=>(b.balance||0)-(a.balance||0));
  const total=S.customers.reduce((n,c)=>n+Math.max(c.balance||0,0),0);
  const debtCount=S.customers.filter(c=>(c.balance||0)>0).length;

  A.innerHTML=`
  <div class="top"><h1>العملاء</h1><button class="btn g sm" id="sup">🚚 الموردين</button></div>

  <div class="card card-hero" style="padding:18px">
    <div class="hero-stat">
      <span class="lbl">إجمالي الديون المعلقة</span>
      <span class="val">${n2(total)}<span class="cur"> ${esc(S.settings.currency)}</span></span>
    </div>
    <div class="hero-grid">
      <div class="hero-mini"><span class="k">عدد العملاء</span><span class="v">${S.customers.length}</span></div>
      <div class="hero-mini"><span class="k">عملاء مدينون</span><span class="v">${debtCount}</span></div>
    </div>
  </div>

  <div class="search-wrap" style="margin:12px 0 8px"><input id="sr" placeholder="ابحث بالاسم أو الهاتف..." value="${esc(S.q)}"></div>

  <div class="chips">
    <button class="chip ${S.filter===''?'on':''}" data-f="">الكل (${S.customers.length})</button>
    <button class="chip ${S.filter==='debt'?'on':''}" data-f="debt">مدينون (${debtCount})</button>
    <button class="chip ${S.filter==='clear'?'on':''}" data-f="clear">مسدّدون</button>
  </div>

  <div class="card">
    ${list.map(c=>`<div class="item" data-id="${c.id}">
      <div class="row-c" style="gap:12px;min-width:0;flex:1">
        <div class="avatar">${esc(initials(c.name))}</div>
        <div class="info"><b>${esc(c.name)}</b><small>${esc(c.phone||'—')}</small></div>
      </div>
      <div class="amt ${(c.balance||0)>0?'due':'ok'}">${n2(Math.abs(c.balance||0))}<small>${(c.balance||0)>0?'مدين':(c.balance||0)<0?'دائن':'مسدّد'}</small></div>
    </div>`).join('')||emptyState('👥','لا يوجد عملاء','اضغط + لإضافة عميل جديد')}
  </div>`;

  $('#sup').onclick=()=>go('suppliers');
  $('#sr').oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;customersList();const i=$('#sr');i.focus();i.setSelectionRange(p,p)};
  A.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;customersList()});
  A.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>go('customer',e.dataset.id));
  fab('+',()=>customerForm());
}

  modal(`<h2>${edit?'تعديل عميل':'عميل جديد'}</h2>

  $('#sv').onclick=async()=>{
    const name=$('#n').value.trim();if(!name)return toast('اكتب الاسم');
    if(edit){await updateDoc(doc(db,'accounts',c.id),{name,phone:$('#ph').value.trim()});}
    else{
      const t=newToken(),op=Number($('#op').value)||0;
      const bt=writeBatch(db);
      bt.set(doc(db,'accounts',t),{owner:S.user.uid,name,phone:$('#ph').value.trim(),balance:op,currency:S.settings.currency,createdAt:Date.now()});
      if(op>0)bt.set(newLedgerRef(),ledgerData('debt','رصيد افتتاحي',op,'out',0,{accountId:t}));
      await bt.commit();
    }
    closeModal();toast('تم الحفظ');
  };
}

/* ====== amountForm — النسخة الأصلية العاملة بدون أي تعديل ====== */
function amountForm(type,ent,kind){
  const isDebt=type==='debt',isCust=kind==='customer';
  modal(`<h2>${isDebt?'تسجيل دين على':'تسجيل دفعة '+(isCust?'من':'إلى')} ${esc(ent.name)}</h2>
  <label>المبلغ</label><input id="am" type="number" inputmode="decimal" placeholder="0">
  <label>ملاحظة</label><input id="nt" placeholder="اختياري">
  <div id="err" style="color:#ef4444;font-size:.8rem;margin-top:6px;display:none"></div>
  <div class="modal-actions"><button class="btn g" onclick="closeModal()">إلغاء</button><button class="btn" id="sv">تأكيد</button></div>`);
  $('#sv').onclick=async()=>{
    const amount=Number($('#am').value);
    if(!(amount>0))return toast('أدخل مبلغاً صحيحاً');
    const svBtn=$('#sv');svBtn.disabled=true;svBtn.textContent='جارٍ الحفظ...';
    $('#err').style.display='none';
    try{
      const col=isCust?'accounts':'suppliers';
      const extra=isCust?{accountId:ent.id}:{supplierId:ent.id};
      const oldBalance=Number(ent.balance)||0;
      const newBalance=isDebt?oldBalance+amount:oldBalance-amount;
      const bt=writeBatch(db);
      bt.set(newLedgerRef(),ledgerData(
        isDebt?'debt':'payment',
        isDebt?'دين':'دفعة',
        amount,
        isDebt?'out':'in',
        isDebt?0:(isCust?amount:-amount),
        {...extra,note:$('#nt').value.trim()}
      ));
      bt.update(doc(db,col,ent.id),{balance:newBalance});
      await bt.commit();
      closeModal();
      toast('✅ تم التسجيل بنجاح');

      const noteValue = $('#nt').value.trim();
      const currency = S.settings.currency || 'ر.ي';
      const now = new Date();
      const dateStr = now.toLocaleDateString('ar-EG');
      const timeStr = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

      let pushMsg = `مرحباً ${ent.name} 👋\n`;
      if (isDebt) {
        pushMsg += `🔴 تم تسجيل دين جديد بقيمة: ${amount} ${currency}\n`;
      } else {
        pushMsg += `🟢 تم تسجيل دفعة بقيمة: ${amount} ${currency}\n`;
      }
      if (noteValue) pushMsg += `📝 ملاحظات: ${noteValue}\n`;
      pushMsg += `📊 إجمالي حسابك الحالي: ${newBalance} ${currency}\n`;
      pushMsg += `📅 التاريخ: ${dateStr} - ${timeStr}\n\n`;
      pushMsg += isDebt ? 'شكراً لثقتكم بنا 🌹' : 'شكراً لالتزامكم بالسداد 💚';

      if (isCust && window.notifyCustomer) {
        window.notifyCustomer(ent.id, pushMsg, S.settings.name);
      }

      if(isCust&&ent.phone){
        setTimeout(()=>notifyDebt(ent.name,ent.phone,amount,newBalance,isDebt?'debt':'payment'),400);
      }
    }catch(e){
      console.error(e);
      $('#err').textContent='فشل: '+(e.code||e.message||'خطأ');
      $('#err').style.display='block';
      svBtn.disabled=false;svBtn.textContent='تأكيد';
    }
  };
}

async function saveSale(){
  if(!S.cart.length)return toast('أضف أصنافاً');
  const custId=$('#cust').value,cust=S.customers.find(c=>c.id===custId);
  const total=S.cart.reduce((n,i)=>n+i.qty*i.price,0);
  const paid=Math.max(0,Math.min(Number($('#paid').value)||0,total));
  const due=total-paid;
  if(due>0&&!cust)return toast('اختر عميلاً للبيع الآجل');
  const bt=writeBatch(db);
  const saleRef=doc(collection(db,'sales'));
  bt.set(saleRef,{owner:S.user.uid,ts:Date.now(),customerId:custId||null,customerName:cust?.name||'عميل نقدي',
    items:S.cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price})),total,paid,due});
  S.cart.forEach(i=>bt.update(doc(db,'products',i.id),{stock:increment(-i.qty)}));
  if(paid>0)bt.set(newLedgerRef(),ledgerData('sale','فاتورة بيع',paid,'in',paid,{ref:saleRef.id}));
  if(due>0){
    bt.set(newLedgerRef(),ledgerData('sale','فاتورة بيع آجل',due,'out',0,{accountId:custId,ref:saleRef.id}));
    bt.update(doc(db,'accounts',custId),{balance:increment(due)});
  }
  await bt.commit();
  const savedSale={id:saleRef.id,ts:Date.now(),customerName:cust?.name||'عميل نقدي',items:[...S.cart],total,paid,due};
  S.formOpen=false;S.cart=[];
  toast('✅ تم حفظ الفاتورة');
  go('sales');
  setTimeout(()=>{
    modal(`<h2>تم حفظ الفاتورة ✅</h2>
    <p style="margin:10px 0;font-size:.9rem;color:var(--mt)">هل تريد طباعة الفاتورة؟</p>

  },500);
}

  $('#bk').onclick=()=>{S.formOpen=false;go('purchases')};
  $('#prod').onchange=e=>{const p=S.products.find(x=>x.id===e.target.value);if(p)$('#prc').value=p.cost};
  $('#addIt').onclick=()=>{
    const p=S.products.find(x=>x.id===$('#prod').value);if(!p)return toast('اختر منتجاً');
    const q=Number($('#qty').value)||0,pr=Number($('#prc').value)||p.cost;
    if(q<=0)return toast('كمية غير صحيحة');
    S.cart.push({id:p.id,name:p.name,qty:q,price:pr});
    $('#prod').value='';$('#qty').value=1;$('#prc').value='';drawCart();
  };
  drawCart();
  $('#save').onclick=savePurchase;
}
async function savePurchase(){
  if(!S.cart.length)return toast('أضف أصنافاً');
  const supId=$('#sup').value,sup=S.suppliers.find(s=>s.id===supId);
  const total=S.cart.reduce((n,i)=>n+i.qty*i.price,0);
  const paid=Math.max(0,Math.min(Number($('#paid').value)||0,total));
  const due=total-paid;
  if(due>0&&!sup)return toast('اختر مورداً للشراء الآجل');
  const bt=writeBatch(db);
  const ref=doc(collection(db,'purchases'));
  bt.set(ref,{owner:S.user.uid,ts:Date.now(),supplierId:supId||null,supplierName:sup?.name||'مورد نقدي',
    items:S.cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price})),total,paid,due});
  S.cart.forEach(i=>bt.update(doc(db,'products',i.id),{stock:increment(i.qty),cost:i.price}));
  if(paid>0)bt.set(newLedgerRef(),ledgerData('purchase','فاتورة شراء',paid,'out',-paid,{ref:ref.id}));
  if(due>0){
    bt.set(newLedgerRef(),ledgerData('purchase','فاتورة شراء آجل',due,'out',0,{supplierId:supId,ref:ref.id}));
    bt.update(doc(db,'suppliers',supId),{balance:increment(due)});
  }
  await bt.commit();
  const savedPur={id:ref.id,ts:Date.now(),supplierName:sup?.name||'مورد نقدي',items:[...S.cart],total,paid,due};
  S.formOpen=false;S.cart=[];
  toast('✅ تم حفظ الفاتورة');
  go('purchases');
  setTimeout(()=>{
    modal(`<h2>تم حفظ الفاتورة ✅</h2>
    <p style="margin:10px 0;font-size:.9rem;color:var(--mt)">هل تريد طباعة الفاتورة؟</p>

    <button class="btn" id="pv-print">🖨️ طباعة PDF</button></div>`);

  },500);
}

/* ============ PDF ============ */
function exportPDF(title,html){
  const box=document.createElement('div');
  box.style.cssText='font-family:Cairo,Tahoma,Arial;direction:rtl;padding:24px;color:#111;background:#fff;width:760px';
  box.innerHTML=`<h2 style="color:#059669;text-align:center;margin:0;font-size:22px">${esc(S.settings.name)}</h2>
  <h3 style="text-align:center;margin:8px 0 20px;color:#333;font-weight:600">${esc(title)}</h3>${html}
  <div style="margin-top:32px;padding-top:16px;border-top:1px solid #eee;text-align:center;font-size:11px;color:#888">تم الإنشاء: ${new Date().toLocaleString('ar-EG')}</div>`;
  document.body.appendChild(box);
  html2pdf().set({margin:10,filename:title.replace(/[^\w\u0600-\u06FF]+/g,'_')+'.pdf',html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}})
    .from(box).save().then(()=>box.remove()).catch(()=>{box.remove();toast('تعذّر التصدير')});
}
function statementPDF(ent,txs,kind){
  const rows=txs.map(l=>`<tr><td>${dOnly(l.ts)}</td><td>${esc(l.label)}</td><td>${esc(l.note||'')}</td>
    <td style="color:${l.dir==='in'?'#059669':'#ef4444'}">${l.dir==='in'?'+':'-'}${n2(l.amount)}</td></tr>`).join('');
  exportPDF((kind==='customer'?'كشف حساب عميل — ':'كشف حساب مورد — ')+ent.name,
  `<table border="1" cellspacing="0" cellpadding="8" style="width:100%;border-collapse:collapse;font-size:12px">
  <tr style="background:#ecfdf5"><th>التاريخ</th><th>البيان</th><th>ملاحظة</th><th>المبلغ</th></tr>${rows||'<tr><td colspan="4">لا توجد حركات</td></tr>'}</table>
  <h3 style="margin-top:16px;color:${(ent.balance||0)>0?'#ef4444':'#059669'}">الرصيد الحالي: ${fmt(ent.balance||0)}</h3>`);
}
function employeeStatementPDF(emp,txs){
  const rows=txs.map(l=>`<tr><td>${dOnly(l.ts)}</td><td>${esc(l.label)}</td><td>${esc(l.note||'')}</td>
    <td style="color:${l.type==='advance'||l.type==='deduction'?'#8b5cf6':'#059669'}">${n2(l.amount)}</td></tr>`).join('');
  exportPDF('كشف حساب موظف — '+emp.name,

    <div><b>الهاتف:</b> ${esc(emp.phone||'—')}</div>

  </div>

  <tr style="background:#f5f3ff"><th>التاريخ</th><th>البيان</th><th>ملاحظة</th><th>المبلغ</th></tr>${rows||'<tr><td colspan="4">لا توجد حركات</td></tr>'}</table>
  <h3 style="margin-top:16px;color:${(emp.balance||0)>0?'#8b5cf6':'#059669'}">الرصيد: ${fmt(emp.balance||0)}</h3>`);

function invoicePDF(rec,kind){
  const isSale=kind==='sale';
  const rows=rec.items.map((i,idx)=>`<tr>
    <td style="text-align:center">${idx+1}</td>
    <td>${esc(i.name)}</td>
    <td style="text-align:center">${n2(i.qty)}</td>
    <td style="text-align:center">${n2(i.price)}</td>
    <td style="text-align:center">${n2(i.qty*i.price)}</td>
  </tr>`).join('');
  const party=isSale?(rec.customerName||'عميل نقدي'):(rec.supplierName||'مورد نقدي');
  const partyLabel=isSale?'العميل':'المورد';
  const title=(isSale?'فاتورة بيع':'فاتورة شراء')+' رقم '+(rec.id||'').slice(-6).toUpperCase();
  exportPDF(title,
  `<div style="display:flex;justify-content:space-between;margin-bottom:16px;font-size:13px;background:#f8faf9;padding:14px;border-radius:8px">
    <div><b>${partyLabel}:</b> ${esc(party)}</div>
    <div><b>التاريخ:</b> ${dt(rec.ts)}</div>
  </div>
  <table border="1" cellspacing="0" cellpadding="10" style="width:100%;border-collapse:collapse;font-size:12px">
    <tr style="background:#059669;color:#fff">
      <th style="width:40px">#</th>
      <th>الصنف</th>
      <th style="width:70px">الكمية</th>
      <th style="width:80px">السعر</th>
      <th style="width:100px">الإجمالي</th>
    </tr>
    ${rows}
    <tr style="background:#f8faf9;font-weight:bold">
      <td colspan="4" style="text-align:left">الإجمالي</td>
      <td style="text-align:center">${fmt(rec.total)}</td>
    </tr>
    <tr>
      <td colspan="4" style="text-align:left">المدفوع</td>
      <td style="text-align:center;color:#059669">${fmt(rec.paid)}</td>
    </tr>
    ${rec.due>0?`<tr>
      <td colspan="4" style="text-align:left">المتبقي (آجل)</td>
      <td style="text-align:center;color:#ef4444;font-weight:bold">${fmt(rec.due)}</td>
    </tr>`:''}
  </table>
  <p style="margin-top:24px;text-align:center;font-size:12px;color:#64756b;line-height:1.7">
    شكراً لتعاملكم معنا 🌹<br>
    <b>${esc(S.settings.name)}</b>${S.settings.phone?' · '+esc(S.settings.phone):''}
  </p>`);
}

/* ============ واجهة العميل العامة ============ */
function publicView(tk){
  N.innerHTML='';
  A.innerHTML=`
    <div class="pub-header">
      <div class="pub-logo">📒</div>
      <h1 style="font-size:1.4rem">كشف حساب</h1>
      <p id="pub-store" style="color:var(--mt);font-size:.85rem;margin-top:4px;font-weight:600">جاري التحميل...</p>
    </div>

    <div class="pub-card notif-card" id="notifCard">
      <span class="bell">🔔</span>
      <h3>فعّل الإشعارات</h3>
      <p>لتصلك الفواتير والدفعات لحظة تسجيلها على حسابك</p>
      <button class="activate-btn" id="pubNotifBtn">✅ تفعيل الإشعارات الآن</button>
      <small class="note">يمكنك إيقافها في أي وقت من إعدادات المتصفح</small>
    </div>

    <div class="pub-card pub-hero" id="acc"><div class="hint" style="color:#fff;opacity:.85">جاري تحميل البيانات...</div></div>

    <div class="pub-card" id="pub-summary" style="display:none">
      <div class="grid2">
        <div class="pub-stat"><small>إجمالي الديون</small><b class="due" id="pub-debt">0</b></div>
        <div class="pub-stat"><small>إجمالي الدفعات</small><b class="ok" id="pub-pay">0</b></div>
      </div>
    </div>

    <div class="pub-card">
      <h3 style="margin-bottom:10px;font-size:.95rem">🕒 سجل الحركات</h3>
      <div id="txs"><p class="hint" style="text-align:center">لا توجد حركات بعد</p></div>
    </div>

    <button class="btn w" onclick="window.print()" style="margin-top:10px">🖨️ طباعة / حفظ PDF</button>
    <p style="text-align:center;margin-top:16px;font-size:.7rem;color:var(--mt)">تم الإنشاء بواسطة ${esc(S.settings.name)}</p>
  `;

  const btn = $('#pubNotifBtn');
  if(btn){ btn.onclick = ()=>activateCustomerNotifications(tk); }
  refreshPubNotifCard();

  onSnapshot(doc(db,'accounts',tk),s=>{
    if(!s.exists()){$('#acc').innerHTML='<p class="hint" style="color:#fff">الرابط غير صحيح.</p>';return}
    const a=s.data();
    $('#pub-store').textContent=S.settings.name||'كشف حسابي';
    $('#acc').innerHTML=`
      <div class="avatar lg" style="background:rgba(255,255,255,.20);color:#fff;margin:0 auto 12px">${esc(initials(a.name))}</div>
      <h2 style="color:#fff">${esc(a.name)}</h2>
      <div class="big" style="color:#fff;margin:12px 0">${n2(Math.abs(a.balance||0))} <span style="font-size:1rem;opacity:.85">${esc(a.currency||'')}</span></div>
      <span class="pub-status">${(a.balance||0)>0?'💳 المبلغ المطلوب منك':(a.balance||0)<0?'✨ رصيد لك':'✅ الحساب مسدّد'}</span>`;
  });
  const processTx = (arr) => arr.map(d => {
    const x = d.data ? d.data() : d;
    return {id:d.id,type:x.type||'debt',amount:Number(x.amount)||0,
      label:x.label||(x.type==='debt'?'دين':'دفعة'),note:x.note||'',
      ts:x.ts||Date.now(),dir:x.dir||(x.type==='debt'?'out':'in')};
  });
  let allTxs={ledger:[],old:[]};
  const renderTxs=()=>{
    const merged=[...allTxs.ledger,...allTxs.old].sort((a,b)=>b.ts-a.ts);
    const totalDebt=merged.filter(t=>t.dir==='out').reduce((n,t)=>n+t.amount,0);
    const totalPay=merged.filter(t=>t.dir==='in').reduce((n,t)=>n+t.amount,0);
    $('#pub-debt').textContent=fmt(totalDebt);
    $('#pub-pay').textContent=fmt(totalPay);
    $('#pub-summary').style.display=merged.length?'block':'none';
    $('#txs').innerHTML=merged.length?merged.map(t=>`
      <div class="pub-tx">
        <div class="pub-tx-ico ${t.dir==='in'?'in':'out'}">${t.dir==='in'?'↓':'↑'}</div>
        <div class="tx-info" style="flex:1">
          <b>${esc(t.label)}</b>
          <small>${dt(t.ts)}${t.note?' · '+esc(t.note):''}</small>
        </div>
        <div class="tx-amt ${t.dir==='in'?'in':'out'}">${t.dir==='in'?'-':'+'}${n2(t.amount)}</div>
      </div>`).join(''):'<div class="empty"><span class="em">📭</span><p>لا توجد حركات مسجلة بعد</p></div>';
  };
  onSnapshot(query(collection(db,'ledger'),where('accountId','==',tk)),s=>{allTxs.ledger=processTx(s.docs);renderTxs()});
  onSnapshot(query(collection(db,'accounts',tk,'tx'),orderBy('ts','desc')),s=>{allTxs.old=processTx(s.docs);renderTxs()},e=>console.log('no old tx'));
}

/* ============ إشعارات العميل ============ */
function refreshPubNotifCard(){
  const card = document.getElementById('notifCard');
  if(!card) return;
  const supported = ('Notification' in window) && ('serviceWorker' in navigator) && ('PushManager' in window);
  if(!supported){ card.style.display='none'; return; }
  if(Notification.permission === 'granted'){
    card.innerHTML = `
      <span class="bell">🔔</span>
      <h3>الإشعارات مُفعّلة ✅</h3>
      <p>ستصلك الفواتير والدفعات لحظة تسجيلها</p>
    `;
    return;
  }
  if(Notification.permission === 'denied'){
    card.innerHTML = `
      <span class="bell">🔕</span>
      <h3>الإشعارات محظورة</h3>
      <p>يرجى تفعيل الإشعارات من إعدادات المتصفح لهذا الموقع</p>
    `;
    return;
  }
  card.innerHTML = `
    <span class="bell">🔔</span>
    <h3>فعّل الإشعارات</h3>
    <p>لتصلك الفواتير والدفعات لحظة تسجيلها على حسابك</p>
    <button class="activate-btn" id="pubNotifBtn">✅ تفعيل الإشعارات الآن</button>
    <small class="note">يمكنك إيقافها في أي وقت من إعدادات المتصفح</small>
  `;
  const btn = document.getElementById('pubNotifBtn');
  if(btn){
    const tk = new URLSearchParams(location.search).get('c');
    btn.onclick = ()=>activateCustomerNotifications(tk);
  }
}

async function activateCustomerNotifications(tk){
  const supported = ('Notification' in window) && ('serviceWorker' in navigator) && ('PushManager' in window);
  if(!supported){
    alert('متصفحك لا يدعم الإشعارات.\nاستخدم Chrome أو Safari حديث.');
    return;
  }
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isIOS && !isStandalone){
    alert('لتشغيل الإشعارات على iPhone:\n\n1) اضغط زر المشاركة 📤 في Safari\n2) اختر "إضافة إلى الشاشة الرئيسية"\n3) افتح التطبيق من الأيقونة الجديدة\n4) اضغط "تفعيل" مرة أخرى');
    return;
  }
  const btn = document.getElementById('pubNotifBtn');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ جارٍ التفعيل...'; }
  try{
    if(typeof window.enablePushNotifications === 'function'){
      await window.enablePushNotifications();
      setTimeout(refreshPubNotifCard, 800);
      toast('✅ تم تفعيل الإشعارات بنجاح');
    } else {
      const perm = await Notification.requestPermission();
      if(perm === 'granted'){
        toast('✅ تم منح الإذن — أعد تحميل الصفحة');
      } else {
        toast('❌ تم رفض الإشعارات');
      }
      refreshPubNotifCard();
      if(btn){ btn.disabled = false; btn.textContent = '✅ تفعيل الإشعارات الآن'; }
    }
  }catch(e){
    console.error(e);
    toast('تعذّر تفعيل الإشعارات');
    if(btn){ btn.disabled = false; btn.textContent = '✅ تفعيل الإشعارات الآن'; }
  }
}

/* ============ التهيئة ============ */
async function loadSettings(){
  try{const d=await getDoc(doc(db,'settings',S.user.uid));if(d.exists())S.settings={...S.settings,...d.data()}}catch(e){}
}
function attach(){
  S.unsubs.forEach(u=>u());S.unsubs=[];
  const u=S.user.uid;
  const sub=(col,cb)=>S.unsubs.push(onSnapshot(query(collection(db,col),where('owner','==',u)),s=>{
    cb(s.docs.map(d=>({id:d.id,...d.data()}))); if(!S.formOpen)render();
  }));
  sub('accounts',d=>S.customers=d);
  sub('suppliers',d=>S.suppliers=d);
  sub('products',d=>S.products=d);
  sub('sales',d=>S.sales=d.sort((a,b)=>b.ts-a.ts));
  sub('purchases',d=>S.purchases=d.sort((a,b)=>b.ts-a.ts));
  sub('expenses',d=>S.expenses=d.sort((a,b)=>b.ts-a.ts));
  sub('ledger',d=>S.ledger=d.sort((a,b)=>b.ts-a.ts));
  sub('employees',d=>S.employees=d.sort((a,b)=>a.name.localeCompare(b.name)));
}

const tk=new URLSearchParams(location.search).get('c');
if(tk)publicView(tk);
else onAuthStateChanged(auth,async u=>{
  S.user=u;
  if(u){await loadSettings();attach();render()}
  else{S.unsubs.forEach(x=>x());S.unsubs=[];render()}
});
</script>
