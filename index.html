<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script type="module" src="push.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>الكامل سوفت — نظام محاسبي متكامل</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--g:#0f7a55;--g2:#0ea06c;--r:#d6383d;--o:#e8862b;--b:#2f6fd0;--p:#7a4ddb;
--bg:#eef3f0;--c:#fff;--t:#16241d;--m:#6b7b72;--bd:#dde7e1;--sh:0 3px 14px rgba(15,122,85,.08)}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);max-width:520px;margin:auto;min-height:100vh;padding:14px 14px 90px}
a{text-decoration:none;color:inherit}h1{font-size:1.15rem}h2{font-size:1rem}
small{color:var(--m);font-size:.78rem}
.card{background:var(--c);border-radius:14px;padding:14px;margin:10px 0;border:1px solid var(--bd);box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:11px;padding:11px 14px;font-size:.92rem;background:var(--g);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700}
.btn.o{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn.r{background:var(--r)}.btn.o.r{background:#fff;color:var(--r);border-color:var(--r)}
.btn.g{background:#eef3f0;color:var(--t);border:1px solid var(--bd)}
.btn.p{background:var(--p)}.btn.o.p{background:#fff;color:var(--p);border-color:var(--p)}
.btn.sm{padding:7px 10px;font-size:.8rem;border-radius:9px}.w{width:100%}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:11px;margin:5px 0;font-size:.95rem;background:#fff;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g)}
label{font-size:.82rem;color:var(--m);display:block;margin-top:6px}
.due{color:var(--r);font-weight:800}.ok{color:var(--g);font-weight:800}.warn{color:var(--o);font-weight:800}.purple{color:var(--p);font-weight:800}
.big{font-size:1.7rem;font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.hint{font-size:.75rem;color:var(--m)}
#nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 0 8px;z-index:50;box-shadow:0 -4px 16px rgba(0,0,0,.05)}
#nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--m);font-size:.68rem;padding:4px 4px;border-radius:10px;cursor:pointer;flex:1}
#nav a span{font-size:1.2rem;line-height:1}#nav a.on{color:var(--g);background:#eaf5f0}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#16241d;color:#fff;padding:11px 18px;border-radius:22px;display:none;z-index:100;font-size:.85rem;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,25,18,.5);display:none;align-items:flex-end;justify-content:center;z-index:200}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto}
.tx{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--bd)}
.tx:last-child{border:0}
.avatar{width:42px;height:42px;border-radius:50%;background:#eaf5f0;color:var(--g);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.item:last-child{border:0}
.stat{background:#fff;border-radius:14px;padding:12px;border:1px solid var(--bd);text-align:center;box-shadow:var(--sh)}
.stat .n{font-size:1.05rem;font-weight:800;margin-top:4px}.stat .l{font-size:.72rem;color:var(--m)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:7px;border-bottom:1px solid var(--bd);text-align:right}
.switch{position:relative;display:inline-block;width:46px;height:26px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:26px;transition:.3s}
.slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.slider{background:var(--g)}
input:checked+.slider:before{transform:translateX(20px)}

/* Public view */
.pub-header{text-align:center;padding:20px 0 10px}
.pub-logo{width:60px;height:60px;background:#0f7a55;color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 10px;box-shadow:0 4px 12px rgba(15,122,85,.3)}
.pub-header h1{font-size:1.3rem;color:#16241d}
.pub-header p{color:#6b7b72;font-size:.85rem}
.pub-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid #dde7e1;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.pub-balance-card{text-align:center;padding:25px 16px}
.pub-balance-card h2{font-size:1.1rem;margin-bottom:5px}
.pub-status{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:bold;background:#f0f4f2;color:#6b7b72}
.pub-status.due{background:#fdf0f0;color:#d6383d}
.pub-status.ok{background:#eaf5f0;color:#0f7a55}
.pub-stat{text-align:center;padding:10px;background:#f8faf9;border-radius:10px}
.pub-stat small{display:block;margin-bottom:4px}
.pub-stat b{font-size:1rem}
.pub-tx{display:flex;align-items:center;padding:12px 0;border-bottom:1px dashed #dde7e1}
.pub-tx:last-child{border-bottom:0}
.pub-tx-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.1rem;flex-shrink:0;margin-left:10px}
.pub-tx-icon.ok{background:#eaf5f0;color:#0f7a55}
.pub-tx-icon.due{background:#fdf0f0;color:#d6383d}
.pub-tx-info{flex:1}
.pub-tx-info b{font-size:.9rem;display:block}
.pub-tx-info small{font-size:.72rem;color:#6b7b72}
.pub-tx-amount{font-weight:bold;font-size:.95rem}
.pub-tx-amount.ok{color:#0f7a55}
.pub-tx-amount.due{color:#d6383d}

@media print{#nav,.btn,.pub-header .pub-logo{display:none!important}body{background:#fff;padding:0}.pub-card{border:1px solid #ccc;box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="modal-box" id="modalBox"></div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut,
signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,
setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,query,where,orderBy,onSnapshot,writeBatch,increment,deleteDoc,updateDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fb=initializeApp({apiKey:"AIzaSyDaLsIF93OD-Lr9y51j_s4wB9OzahLUiTQ",authDomain:"grocery-debts.firebaseapp.com",projectId:"grocery-debts",storageBucket:"grocery-debts.firebasestorage.app",messagingSenderId:"484535933298",appId:"1:484535933298:web:87f8e2ea08a6d26231e5eb"});
const auth=getAuth(fb),db=getFirestore(fb);

/* ===== أدوات ===== */
const $=s=>document.querySelector(s), A=$('#app'), N=$('#nav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const fmt=n=>n2(n)+' '+S.settings.currency;
const dt=ts=>new Date(ts).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
const dOnly=ts=>new Date(ts).toLocaleDateString('ar-EG');
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)};
const newToken=()=>[...crypto.getRandomValues(new Uint8Array(20))].map(b=>b.toString(16).padStart(2,'0')).join('');
const link=t=>location.origin+location.pathname+'?c='+t;
const initials=s=>(s||'?').trim()[0]||'?';
const startDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime()};

/* ===== الحالة ===== */
const S={user:null,view:'dashboard',_authTab:'login',customerId:null,supplierId:null,productId:null,
customers:[],suppliers:[],products:[],sales:[],purchases:[],expenses:[],ledger:[],employees:[],
settings:{name:'الكامل سوفت',currency:'ر.ي',phone:'',address:'',autoWhatsApp:true},
cart:[],formOpen:false,q:'',unsubs:[],chart:null};

function modal(h){$('#modalBox').innerHTML=h;$('#modal').classList.add('open')}
window.closeModal=()=>$('#modal').classList.remove('open');

/* ===== دفتر اليومية ===== */
function ledgerData(type,label,amount,dir,cash,extra={}){
  return{owner:S.user.uid,ts:Date.now(),type,label,amount:Math.abs(amount),dir,cash:cash||0,...extra};
}
function newLedgerRef(){return doc(collection(db,'ledger'))}

/* ===== واتساب ===== */
function whatsappSend(phone,name,msg){
  if(!phone)return toast('لا يوجد رقم هاتف مسجل');
  let p=phone.replace(/[^\d]/g,'');
  if(p.startsWith('00'))p=p.slice(2);
  if(!p.startsWith('967')){
    p=p.replace(/^0+/,'');
    p='967'+p;
  }
  const text=`السلام عليكم ${name} 🌟\n\n${msg}\n\n— ${S.settings.name}`;
  const url='https://wa.me/'+p+'?text='+encodeURIComponent(text);
  window.open(url,'_blank');
}
function notifyDebt(name,phone,amount,balance,kind){
  if(!S.settings.autoWhatsApp||!phone)return;
  const isDebt=kind==='debt';
  const msg=isDebt
    ? `تم تسجيل دين بمبلغ *${n2(amount)} ${S.settings.currency}*\nالرصيد الحالي: *${n2(balance)} ${S.settings.currency}*\n\nشكراً لتعاملك معنا 🌹`
    : `تم تسجيل دفعة بمبلغ *${n2(amount)} ${S.settings.currency}*\nالرصيد المتبقي: *${n2(balance)} ${S.settings.currency}*\n\nشكراً لك 💚`;
  // إظهار نافذة تأكيد
  modal(`<h2>إشعار واتساب</h2>
  <p style="margin:10px 0;font-size:.9rem;color:#6b7b72">هل تريد إرسال إشعار واتساب إلى <b>${esc(name)}</b>؟</p>
  <div class="card" style="background:#f8faf9;font-size:.85rem;white-space:pre-wrap;padding:12px">${esc(msg)}</div>
  <div class="row" style="margin-top:12px">
    <button class="btn o w" onclick="closeModal()">لاحقاً</button>
    <button class="btn w" id="wa-go">📱 إرسال</button>
  </div>`);
  $('#wa-go').onclick=()=>{whatsappSend(phone,name,msg);closeModal()};
}

/* ===== التنقل ===== */
function go(v,id){
  S.view=v;S.formOpen=false;S.q='';S.cart=[];
  if(v==='customer')S.customerId=id;
  if(v==='supplier')S.supplierId=id;
  if(v==='employee')S.employeeId=id;
  window.scrollTo(0,0);render();
}
function nav(){
  const items=[['dashboard','🏠','الرئيسية'],['customers','👥','العملاء'],['sales','🛒','المبيعات'],
  ['employees','👷','الموظفين'],['reports','📊','التقارير']];
  N.innerHTML=items.map(([v,i,l])=>{
    const on=S.view===v||(v==='customers'&&(S.view==='customer'))||(v==='employees'&&S.view==='employee');
    return `<a class="${on?'on':''}" data-v="${v}"><span>${i}</span><small>${l}</small></a>`;
  }).join('');
  N.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>go(e.dataset.v));
}

/* ===== العرض الرئيسي ===== */
function render(){
  if(!S.user){loginView();return}
  nav();
  const v=S.view;
  if(v==='dashboard')dash();
  else if(v==='customers')customersList();
  else if(v==='customer')customerPage(S.customerId);
  else if(v==='suppliers')suppliersList();
  else if(v==='supplier')supplierPage(S.supplierId);
  else if(v==='products')productsList();
  else if(v==='sales')salesList();
  else if(v==='sale-new')saleNew();
  else if(v==='purchases')purchasesList();
  else if(v==='purchase-new')purchaseNew();
  else if(v==='expenses')expensesList();
  else if(v==='employees')employeesList();
  else if(v==='employee')employeePage(S.employeeId);
  else if(v==='reports')reportsView();
  else if(v==='ledger')ledgerView();
  else if(v==='settings')settingsView();
  else dash();
}

/* ===== تسجيل الدخول ===== */
function authErr(e){
  const c=e?.code||'';const m={
    'auth/invalid-email':'البريد غير صحيح','auth/user-not-found':'لا يوجد حساب بهذا البريد',
    'auth/wrong-password':'كلمة المرور غير صحيحة','auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة',
    'auth/email-already-in-use':'البريد مستخدم مسبقاً','auth/weak-password':'كلمة المرور قصيرة (6 أحرف على الأقل)',
    'auth/too-many-requests':'محاولات كثيرة، حاول لاحقاً','auth/network-request-failed':'تعذّر الاتصال',
    'auth/popup-closed-by-user':'أُغلقت نافذة الدخول','auth/popup-blocked':'المتصفح منع النافذة',
    'auth/missing-name':'اكتب اسمك الكامل'};
  return m[c]||('خطأ: '+c);
}
function loginView(){
  N.innerHTML='';
  A.innerHTML=`
  <div style="text-align:center;padding:40px 0 10px">
    <div class="pub-logo" style="margin:0 auto 12px">📒</div>
    <h1>الكامل سوفت</h1>
    <p style="color:#6b7b72;font-size:.85rem;margin-top:6px">نظام محاسبي متكامل</p>
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <button class="btn ${S._authTab==='login'?'':'g'} w" id="tab-login">دخول</button>
      <button class="btn ${S._authTab==='register'?'':'g'} w" id="tab-register">حساب جديد</button>
    </div>
    ${S._authTab==='register'?'<label>الاسم الكامل</label><input id="a-name" placeholder="مثال: أحمد محمد">':''}
    <label>البريد الإلكتروني</label>
    <input id="a-email" type="email" placeholder="you@email.com" autocomplete="email">
    <label>كلمة المرور</label>
    <input id="a-pass" type="password" placeholder="6 أحرف على الأقل" autocomplete="current-password">
    <button class="btn w" id="a-go" style="margin-top:12px">${S._authTab==='register'?'إنشاء الحساب':'تسجيل الدخول'}</button>
    ${S._authTab==='login'?'<div style="text-align:center;margin-top:10px"><a id="a-forgot" style="color:#0f7a55;font-size:.82rem;cursor:pointer">نسيت كلمة المرور؟</a></div>':''}
    <div style="display:flex;align-items:center;gap:10px;margin:16px 0">
      <div style="flex:1;height:1px;background:#dde7e1"></div><small>أو</small><div style="flex:1;height:1px;background:#dde7e1"></div>
    </div>
    <button class="btn o w" id="g">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" style="background:#fff;border-radius:3px;padding:2px">
      المتابعة بحساب جوجل
    </button>
  </div>
  <p style="text-align:center;font-size:.72rem;color:#888;margin-top:14px">سيتم الاحتفاظ بتسجيل دخولك تلقائياً</p>`;

  $('#tab-login').onclick=()=>{S._authTab='login';loginView()};
  $('#tab-register').onclick=()=>{S._authTab='register';loginView()};
  $('#a-go').onclick=async()=>{
    const email=$('#a-email').value.trim(),pass=$('#a-pass').value;
    if(!email||!pass)return toast('أدخل البريد وكلمة المرور');
    $('#a-go').disabled=true;
    try{
      await setPersistence(auth,browserLocalPersistence);
      if(S._authTab==='register'){
        const name=$('#a-name').value.trim();if(!name)throw{code:'auth/missing-name'};
        const cred=await createUserWithEmailAndPassword(auth,email,pass);
        await setDoc(doc(db,'settings',cred.user.uid),{name,currency:'ر.ي',phone:'',address:'',autoWhatsApp:true},{merge:true});
        toast('تم إنشاء الحساب');
      }else{await signInWithEmailAndPassword(auth,email,pass);toast('مرحباً بك')}
    }catch(e){$('#a-go').disabled=false;toast(authErr(e))}
  };
  $('#a-pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#a-go').click()});
  $('#a-forgot').onclick=async()=>{
    const email=$('#a-email').value.trim();if(!email)return toast('اكتب بريدك أولاً');
    try{await sendPasswordResetEmail(auth,email);toast('تم إرسال رابط الاستعادة')}catch(e){toast(authErr(e))}
  };
  $('#g').onclick=async()=>{
    try{await setPersistence(auth,browserLocalPersistence);await signInWithPopup(auth,new GoogleAuthProvider())}
    catch(e){toast(authErr(e))}
  };
}

/* ===== لوحة التحكم ===== */
function dash(){
  const cash=S.ledger.reduce((n,l)=>n+(l.cash||0),0);
  const recv=S.customers.reduce((n,c)=>n+Math.max(c.balance||0,0),0);
  const pay=S.suppliers.reduce((n,s)=>n+Math.max(s.balance||0,0),0);
  const inv=S.products.reduce((n,p)=>n+(p.stock||0)*(p.cost||0),0);
  const empAdv=S.employees.reduce((n,e)=>n+Math.max(e.balance||0,0),0);
  const t0=startDay(new Date());
  const tSales=S.sales.filter(s=>s.ts>=t0).reduce((n,s)=>n+(s.total||0),0);
  const tExp=S.expenses.filter(e=>e.ts>=t0).reduce((n,e)=>n+(e.amount||0),0);
  A.innerHTML=`
  <div class="top"><h1>لوحة التحكم</h1>
   <div><button class="btn g sm" id="lg">📒</button> <button class="btn g sm" id="st">⚙️</button> <button class="btn g sm" id="out">خروج</button></div></div>
  <div class="grid2">
    <div class="stat"><div class="l">الصندوق (نقدية)</div><div class="n ok">${fmt(cash)}</div></div>
    <div class="stat"><div class="l">ديون العملاء</div><div class="n due">${fmt(recv)}</div></div>
    <div class="stat"><div class="l">مستحق للموردين</div><div class="n warn">${fmt(pay)}</div></div>
    <div class="stat"><div class="l">سحبيات الموظفين</div><div class="n purple">${fmt(empAdv)}</div></div>
    <div class="stat"><div class="l">قيمة المخزون</div><div class="n" style="color:var(--b)">${fmt(inv)}</div></div>
    <div class="stat"><div class="l">مبيعات اليوم</div><div class="n ok">${fmt(tSales)}</div></div>
    <div class="stat"><div class="l">مصروفات اليوم</div><div class="n due">${fmt(tExp)}</div></div>
    <div class="stat"><div class="l">عدد الموظفين</div><div class="n">${S.employees.length}</div></div>
  </div>
  <div class="card"><small>الوصول السريع</small><div class="grid3" style="margin-top:8px">
    ${quick('sale-new','🛒','بيع')}${quick('purchase-new','📥','شراء')}${quick('customers','👥','عميل')}
    ${quick('suppliers','🚚','مورد')}${quick('expenses','💸','مصروف')}${quick('products','📦','منتج')}
  </div></div>
  <div class="card"><div class="row"><b>آخر الحركات</b><button class="btn g sm" id="lg2">الكل</button></div>
   <div>${S.ledger.slice(0,7).map(txRow).join('')||'<p class="hint" style="padding:10px 0">لا توجد حركات</p>'}</div></div>`;
  $('#out').onclick=async()=>{
    if(!confirm('هل تريد تسجيل الخروج؟'))return;
    try{await signOut(auth);toast('تم تسجيل الخروج')}catch(e){toast('تعذّر تسجيل الخروج')}
  };
  $('#st').onclick=()=>go('settings');
  $('#lg').onclick=$('#lg2').onclick=()=>go('ledger');

function amountForm(type,ent,kind){
  const isDebt=type==='debt',isCust=kind==='customer';
  modal(`<h2>${isDebt?'تسجيل دين على':'تسجيل دفعة '+(isCust?'من':'إلى')} ${esc(ent.name)}</h2>
  <label>المبلغ</label><input id="am" type="number" inputmode="decimal" placeholder="0">
  <label>ملاحظة</label><input id="nt" placeholder="اختياري">
  <div id="err" style="color:#d6383d;font-size:.8rem;margin-top:6px;display:none"></div>
  <div class="row" style="margin-top:12px"><button class="btn o w" onclick="closeModal()">إلغاء</button><button class="btn w" id="sv">تأكيد</button></div>`);
  $('#sv').onclick=async()=>{
    const amount=Number($('#am').value);
    if(!(amount>0))return toast('أدخل مبلغاً صحيحاً');
    const svBtn=$('#sv');svBtn.disabled=true;svBtn.textContent='جارٍ الحفظ...';
    $('#err').style.display='none';
    try{
      const col=isCust?'accounts':'suppliers';
      const extra=isCust?{accountId:ent.id}:{supplierId:ent.id};
      const oldBalance=Number(ent.balance)||0;
      const newBalance=isDebt?oldBalance+amount:oldBalance-amount;
      const bt=writeBatch(db);
      bt.set(newLedgerRef(),ledgerData(
        isDebt?'debt':'payment',
        isDebt?'دين':'دفعة',
        amount,
        isDebt?'out':'in',
        isDebt?0:(isCust?amount:-amount),
        {...extra,note:$('#nt').value.trim()}
      ));
      bt.update(doc(db,col,ent.id),{balance:newBalance});
      await bt.commit();
      closeModal();
      toast('✅ تم التسجيل بنجاح');

      // إرسال إشعار الويب (Push Notification) بالتنسيق المطلوب
      const noteValue = $('#nt').value.trim();
      const statusText = isDebt ? 'دين' : 'دفعة';
      let pushMsg = `تم تسجيل ${statusText} ${amount}`;
      
      if (noteValue) {
        pushMsg += `\nملاحظات: ${noteValue}`;
      }
      
      pushMsg += `\nإجمالي حسابك: ${newBalance}`;
      
      if (isCust && window.notifyCustomer) {
        window.notifyCustomer(ent.id, pushMsg);
      }

      // إشعار واتساب
      if(isCust&&ent.phone){
        setTimeout(()=>notifyDebt(ent.name,ent.phone,amount,newBalance,isDebt?'debt':'payment'),400);
      }
    }catch(e){
      console.error(e);
      $('#err').textContent='فشل: '+(e.code||e.message||'خطأ');
      $('#err').style.display='block';
      svBtn.disabled=false;svBtn.textContent='تأكيد';
    }
  };
}

function drawCart(){
  const t=S.cart.reduce((n,i)=>n+i.qty*i.price,0);
  $('#cart').innerHTML=S.cart.map((i,idx)=>`<div class="tx"><div><b>${esc(i.name)}</b><br><small>${n2(i.qty)} × ${n2(i.price)}</small></div>

  $('#tot').textContent=n2(t)+' '+S.settings.currency;
  $('#cart').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.cart.splice(+b.dataset.del,1);drawCart()});
}
async function saveSale(){
  if(!S.cart.length)return toast('أضف أصنافاً');
  const custId=$('#cust').value,cust=S.customers.find(c=>c.id===custId);
  const total=S.cart.reduce((n,i)=>n+i.qty*i.price,0);
  const paid=Math.max(0,Math.min(Number($('#paid').value)||0,total));
  const due=total-paid;
  if(due>0&&!cust)return toast('اختر عميلاً للبيع الآجل');
  const bt=writeBatch(db);
  const saleRef=doc(collection(db,'sales'));
  bt.set(saleRef,{owner:S.user.uid,ts:Date.now(),customerId:custId||null,customerName:cust?.name||'عميل نقدي',
    items:S.cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price})),total,paid,due});
  S.cart.forEach(i=>bt.update(doc(db,'products',i.id),{stock:increment(-i.qty)}));
  if(paid>0)bt.set(newLedgerRef(),ledgerData('sale','فاتورة بيع',paid,'in',paid,{ref:saleRef.id}));
  if(due>0){
    bt.set(newLedgerRef(),ledgerData('sale','فاتورة بيع آجل',due,'out',0,{accountId:custId,ref:saleRef.id}));
    bt.update(doc(db,'accounts',custId),{balance:increment(due)});
  }
  await bt.commit();
  const savedSale={id:saleRef.id,ts:Date.now(),customerName:cust?.name||'عميل نقدي',items:[...S.cart],total,paid,due};
  S.formOpen=false;S.cart=[];
  toast('✅ تم حفظ الفاتورة');
  go('sales');
  // عرض خيار طباعة الفاتورة
  setTimeout(()=>{
    modal(`<h2>تم حفظ الفاتورة ✅</h2>
    <p style="margin:10px 0;font-size:.9rem">هل تريد طباعة الفاتورة؟</p>
    <div class="row"><button class="btn o w" onclick="closeModal()">إغلاق</button><button class="btn w" id="pv-print">🖨️ طباعة PDF</button></div>`);
    $('#pv-print').onclick=()=>{closeModal();invoicePDF(savedSale,'sale')};
  },500);
}

async function savePurchase(){
  if(!S.cart.length)return toast('أضف أصنافاً');
  const supId=$('#sup').value,sup=S.suppliers.find(s=>s.id===supId);
  const total=S.cart.reduce((n,i)=>n+i.qty*i.price,0);
  const paid=Math.max(0,Math.min(Number($('#paid').value)||0,total));
  const due=total-paid;
  if(due>0&&!sup)return toast('اختر مورداً للشراء الآجل');
  const bt=writeBatch(db);
  const ref=doc(collection(db,'purchases'));
  bt.set(ref,{owner:S.user.uid,ts:Date.now(),supplierId:supId||null,supplierName:sup?.name||'مورد نقدي',
    items:S.cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price})),total,paid,due});
  S.cart.forEach(i=>bt.update(doc(db,'products',i.id),{stock:increment(i.qty),cost:i.price}));
  if(paid>0)bt.set(newLedgerRef(),ledgerData('purchase','فاتورة شراء',paid,'out',-paid,{ref:ref.id}));
  if(due>0){
    bt.set(newLedgerRef(),ledgerData('purchase','فاتورة شراء آجل',due,'out',0,{supplierId:supId,ref:ref.id}));
    bt.update(doc(db,'suppliers',supId),{balance:increment(due)});
  }
  await bt.commit();
  const savedPur={id:ref.id,ts:Date.now(),supplierName:sup?.name||'مورد نقدي',items:[...S.cart],total,paid,due};
  S.formOpen=false;S.cart=[];
  toast('✅ تم حفظ الفاتورة');
  go('purchases');
  setTimeout(()=>{
    modal(`<h2>تم حفظ الفاتورة ✅</h2>
    <p style="margin:10px 0;font-size:.9rem">هل تريد طباعة الفاتورة؟</p>
    <div class="row"><button class="btn o w" onclick="closeModal()">إغلاق</button><button class="btn w" id="pv-print">🖨️ طباعة PDF</button></div>`);
    $('#pv-print').onclick=()=>{closeModal();invoicePDF(savedPur,'purchase')};
  },500);
}

/* ===== PDF ===== */
function exportPDF(title,html){
  const box=document.createElement('div');
  box.style.cssText='font-family:Tahoma,Arial;direction:rtl;padding:20px;color:#111;background:#fff;width:760px';
  box.innerHTML=`<h2 style="color:#0f7a55;text-align:center;margin:0">${esc(S.settings.name)}</h2>
  <h3 style="text-align:center;margin:6px 0 18px">${esc(title)}</h3>${html}
  <div style="margin-top:28px;text-align:center;font-size:11px;color:#888">تم الإنشاء: ${new Date().toLocaleString('ar-EG')}</div>`;
  document.body.appendChild(box);
  html2pdf().set({margin:10,filename:title.replace(/[^\w\u0600-\u06FF]+/g,'_')+'.pdf',html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}})
    .from(box).save().then(()=>box.remove()).catch(()=>{box.remove();toast('تعذّر التصدير')});
}
function statementPDF(ent,txs,kind){
  const rows=txs.map(l=>`<tr><td>${dOnly(l.ts)}</td><td>${esc(l.label)}</td><td>${esc(l.note||'')}</td>
    <td style="color:${l.dir==='in'?'#0f7a55':'#d6383d'}">${l.dir==='in'?'+':'-'}${n2(l.amount)}</td></tr>`).join('');
  exportPDF((kind==='customer'?'كشف حساب عميل - ':'كشف حساب مورد - ')+ent.name,
  `<table border="1" cellspacing="0" cellpadding="6" style="width:100%;border-collapse:collapse;font-size:12px">
  <tr style="background:#eef3f0"><th>التاريخ</th><th>البيان</th><th>ملاحظة</th><th>المبلغ</th></tr>${rows||'<tr><td colspan="4">لا توجد حركات</td></tr>'}</table>
  <h3 style="margin-top:14px;color:${(ent.balance||0)>0?'#d6383d':'#0f7a55'}">الرصيد الحالي: ${fmt(ent.balance||0)}</h3>`);
}

  const rows=txs.map(l=>`<tr><td>${dOnly(l.ts)}</td><td>${esc(l.label)}</td><td>${esc(l.note||'')}</td>
    <td style="color:${l.type==='advance'||l.type==='deduction'?'#7a4ddb':'#0f7a55'}">${n2(l.amount)}</td></tr>`).join('');

    <div><b>الهاتف:</b> ${esc(emp.phone||'—')}</div>
    <div><b>الراتب:</b> ${fmt(emp.salary||0)}</div>
  </div>
  <table border="1" cellspacing="0" cellpadding="6" style="width:100%;border-collapse:collapse;font-size:12px">
  <tr style="background:#eef3f0"><th>التاريخ</th><th>البيان</th><th>ملاحظة</th><th>المبلغ</th></tr>${rows||'<tr><td colspan="4">لا توجد حركات</td></tr>'}</table>
  <h3 style="margin-top:14px;color:${(emp.balance||0)>0?'#7a4ddb':'#0f7a55'}">الرصيد: ${fmt(emp.balance||0)}</h3>`);

function invoicePDF(rec,kind){
  const isSale=kind==='sale';
  const rows=rec.items.map((i,idx)=>`<tr>
    <td style="text-align:center">${idx+1}</td>
    <td>${esc(i.name)}</td>
    <td style="text-align:center">${n2(i.qty)}</td>
    <td style="text-align:center">${n2(i.price)}</td>
    <td style="text-align:center">${n2(i.qty*i.price)}</td>
  </tr>`).join('');
  const party=isSale?(rec.customerName||'عميل نقدي'):(rec.supplierName||'مورد نقدي');
  const partyLabel=isSale?'العميل':'المورد';
  const title=(isSale?'فاتورة بيع':'فاتورة شراء')+' رقم '+(rec.id||'').slice(-6).toUpperCase();
  exportPDF(title,
  `<div style="display:flex;justify-content:space-between;margin-bottom:14px;font-size:13px">
    <div><b>${partyLabel}:</b> ${esc(party)}</div>
    <div><b>التاريخ:</b> ${dt(rec.ts)}</div>
  </div>
  <table border="1" cellspacing="0" cellpadding="8" style="width:100%;border-collapse:collapse;font-size:12px">
    <tr style="background:#0f7a55;color:#fff">
      <th style="width:40px">#</th>
      <th>الصنف</th>
      <th style="width:70px">الكمية</th>
      <th style="width:80px">السعر</th>
      <th style="width:100px">الإجمالي</th>
    </tr>
    ${rows}
    <tr style="background:#f8faf9;font-weight:bold">
      <td colspan="4" style="text-align:left">الإجمالي</td>
      <td style="text-align:center">${fmt(rec.total)}</td>
    </tr>
    <tr>
      <td colspan="4" style="text-align:left">المدفوع</td>
      <td style="text-align:center;color:#0f7a55">${fmt(rec.paid)}</td>
    </tr>
    ${rec.due>0?`<tr>
      <td colspan="4" style="text-align:left">المتبقي (آجل)</td>
      <td style="text-align:center;color:#d6383d;font-weight:bold">${fmt(rec.due)}</td>
    </tr>`:''}
  </table>
  <p style="margin-top:20px;text-align:center;font-size:12px;color:#6b7b72">
    شكراً لتعاملكم معنا 🌹<br>${esc(S.settings.name)} ${S.settings.phone?'· '+esc(S.settings.phone):''}
  </p>`);
}

/* ===== واجهة العميل العامة ===== */
function publicView(tk){
  N.innerHTML='';
  A.innerHTML=`
    <div class="pub-header">
      <div class="pub-logo">📒</div>
      <h1>كشف حساب</h1>
      <p id="pub-store">جاري التحميل...</p>
    </div>
    <div class="pub-card pub-balance-card" id="acc"><div class="hint">جاري تحميل البيانات...</div></div>
    <div class="pub-card" id="pub-summary" style="display:none">
      <div class="grid2">
        <div class="pub-stat"><small>إجمالي الديون</small><b class="due" id="pub-debt">0</b></div>
        <div class="pub-stat"><small>إجمالي الدفعات</small><b class="ok" id="pub-pay">0</b></div>
      </div>
    </div>
    <div class="pub-card">
      <h3 style="margin-bottom:10px;font-size:.95rem">سجل الحركات</h3>
      <div id="txs"><p class="hint" style="text-align:center">لا توجد حركات بعد</p></div>
    </div>
    <button class="btn w" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
    <p style="text-align:center;margin-top:15px;font-size:.7rem;color:#888">تم الإنشاء بواسطة ${esc(S.settings.name)}</p>
  `;
  onSnapshot(doc(db,'accounts',tk),s=>{
    if(!s.exists()){$('#acc').innerHTML='<p class="hint">الرابط غير صحيح.</p>';return}
    const a=s.data();
    $('#pub-store').textContent=S.settings.name||'كشف حسابي';
    $('#acc').innerHTML=`
      <div class="avatar" style="margin:0 auto 10px;width:60px;height:60px;font-size:1.5rem;background:#eaf5f0;color:#0f7a55">${esc(initials(a.name))}</div>
      <h2>${esc(a.name)}</h2>
      <div class="big ${(a.balance||0)>0?'due':'ok'}" style="margin:10px 0">${n2(Math.abs(a.balance||0))} ${esc(a.currency||'')}</div>
      <div class="pub-status ${(a.balance||0)>0?'due':(a.balance||0)<0?'ok':''}">${(a.balance||0)>0?'المبلغ المطلوب منك':(a.balance||0)<0?'رصيد لك':'الحساب مسدد'}</div>`;
  });
  const processTx = (arr) => arr.map(d => {
    const x = d.data ? d.data() : d;
    return {id:d.id,type:x.type||'debt',amount:Number(x.amount)||0,
      label:x.label||(x.type==='debt'?'دين':'دفعة'),note:x.note||'',
      ts:x.ts||Date.now(),dir:x.dir||(x.type==='debt'?'out':'in')};
  });
  let allTxs={ledger:[],old:[]};
  const renderTxs=()=>{
    const merged=[...allTxs.ledger,...allTxs.old].sort((a,b)=>b.ts-a.ts);
    const totalDebt=merged.filter(t=>t.dir==='out').reduce((n,t)=>n+t.amount,0);
    const totalPay=merged.filter(t=>t.dir==='in').reduce((n,t)=>n+t.amount,0);
    $('#pub-debt').textContent=fmt(totalDebt);
    $('#pub-pay').textContent=fmt(totalPay);
    $('#pub-summary').style.display=merged.length?'block':'none';
    $('#txs').innerHTML=merged.length?merged.map(t=>`
      <div class="pub-tx">
        <div class="pub-tx-icon ${t.dir==='in'?'ok':'due'}">${t.dir==='in'?'↓':'↑'}</div>
        <div class="pub-tx-info"><b>${esc(t.label)}</b><small>${dt(t.ts)} ${t.note?'· '+esc(t.note):''}</small></div>
        <div class="pub-tx-amount ${t.dir==='in'?'ok':'due'}">${t.dir==='in'?'-':'+'}${n2(t.amount)}</div>
      </div>`).join(''):'<p class="hint" style="text-align:center;padding:20px 0">لا توجد حركات مسجلة بعد</p>';
  };
  onSnapshot(query(collection(db,'ledger'),where('accountId','==',tk)),s=>{allTxs.ledger=processTx(s.docs);renderTxs()});
  onSnapshot(query(collection(db,'accounts',tk,'tx'),orderBy('ts','desc')),s=>{allTxs.old=processTx(s.docs);renderTxs()},e=>console.log('no old tx'));
}

/* ===== التهيئة ===== */
async function loadSettings(){
  try{const d=await getDoc(doc(db,'settings',S.user.uid));if(d.exists())S.settings={...S.settings,...d.data()}}catch(e){}
}
function attach(){
  S.unsubs.forEach(u=>u());S.unsubs=[];
  const u=S.user.uid;
  const sub=(col,cb)=>S.unsubs.push(onSnapshot(query(collection(db,col),where('owner','==',u)),s=>{
    cb(s.docs.map(d=>({id:d.id,...d.data()}))); if(!S.formOpen)render();
  }));
  sub('accounts',d=>S.customers=d);
  sub('suppliers',d=>S.suppliers=d);
  sub('products',d=>S.products=d);
  sub('sales',d=>S.sales=d.sort((a,b)=>b.ts-a.ts));
  sub('purchases',d=>S.purchases=d.sort((a,b)=>b.ts-a.ts));
  sub('expenses',d=>S.expenses=d.sort((a,b)=>b.ts-a.ts));
  sub('ledger',d=>S.ledger=d.sort((a,b)=>b.ts-a.ts));
  sub('employees',d=>S.employees=d.sort((a,b)=>a.name.localeCompare(b.name)));
}

const tk=new URLSearchParams(location.search).get('c');
if(tk)publicView(tk);
else onAuthStateChanged(auth,async u=>{
  S.user=u;
  if(u){await loadSettings();attach();render()}
  else{S.unsubs.forEach(x=>x());S.unsubs=[];render()}
});
</script>
