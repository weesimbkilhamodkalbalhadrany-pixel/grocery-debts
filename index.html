<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>الكامل سوفت — نظام محاسبي متكامل</title>
<style>
:root{--ink:#14283b;--ink2:#1f4466;--am:#f4a93a;--bg:#f3f5f8;--c:#fff;--t:#14212e;--m:#6c7a89;--bd:#e3e8ee;--red:#e5484d;--grn:#1f9d6b;--blu:#3b7de0;--pur:#7a5af8;--org:#e8862b}
:root[data-theme=dark]{--bg:#0e1822;--c:#16242f;--t:#e8eef4;--m:#8da0b2;--bd:#233443}
*{box-sizing:border-box;margin:0;padding:0;font-family:Cairo,Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);max-width:520px;margin:auto;min-height:100vh;padding:12px 14px 110px;overflow-x:hidden}
h1{font-size:1.25rem;font-weight:800}h2{font-size:1.05rem;font-weight:800}small{color:var(--m);font-size:.76rem}
.card{background:var(--c);border-radius:18px;padding:14px;margin:10px 0;border:1px solid var(--bd);animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{border:0;border-radius:14px;padding:12px 14px;font-size:.92rem;background:var(--ink);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;transition:transform .1s}
.btn:active{transform:scale(.97)}
:root[data-theme=dark] .btn{background:var(--ink2)}
.btn.am{background:var(--am);color:#2a1d05}.btn.r{background:var(--red)}.btn.gr{background:var(--grn)}
.btn.o{background:transparent;color:var(--t);border:1.5px solid var(--bd)}.btn.g{background:var(--bg);color:var(--t)}
.btn.sm{padding:7px 11px;font-size:.78rem;border-radius:10px}.w{width:100%}.btn:disabled{opacity:.6}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:13px;margin:5px 0;font-size:.95rem;background:var(--c);color:var(--t)}
input:focus,select:focus{outline:0;border-color:var(--am)}
label{font-size:.8rem;color:var(--m);display:block;margin-top:6px}
.due{color:var(--red)}.ok{color:var(--grn)}.warn{color:var(--org)}.purple{color:var(--pur)}.blue{color:var(--blu)}
.big{font-size:1.8rem;font-weight:800}.hint{font-size:.78rem;color:var(--m);padding:14px 0;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 4px}
.ic{width:38px;height:38px;border-radius:12px;background:var(--c);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;margin-right:6px}
.hero{background:linear-gradient(150deg,var(--ink),var(--ink2));color:#fff;border-radius:22px;padding:18px;margin:10px 0}
.hero small{color:#b9cadb}.hero .big{color:var(--am);margin:2px 0 12px}
.hero .mini{background:rgba(255,255,255,.09);border-radius:14px;padding:10px}.hero .mini b{display:block;font-size:1rem}
.act{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:12px 4px;text-align:center;cursor:pointer;font-size:.74rem;font-weight:600}
.act i{display:block;font-style:normal;font-size:1.5rem;margin-bottom:3px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 6px;font-weight:800;font-size:.95rem}
.stat{background:var(--c);border-radius:16px;padding:12px;border:1px solid var(--bd)}.stat .l{font-size:.72rem;color:var(--m)}.stat .n{font-size:1.02rem;font-weight:800;margin-top:3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}.chip{padding:7px 14px;border-radius:20px;background:var(--c);border:1px solid var(--bd);font-size:.8rem;white-space:nowrap;cursor:pointer;font-weight:600}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);cursor:pointer}.item:last-child{border:0}
.av{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-size:1.05rem}
.bar{height:5px;border-radius:5px;background:var(--bd);margin-top:5px;overflow:hidden;width:90px}.bar i{display:block;height:100%;background:var(--grn)}
.tx{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--bd)}.tx:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right}
#nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:var(--c);border-top:1px solid var(--bd);display:flex;align-items:flex-end;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:50}
#nav a{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--m);font-size:.68rem;padding:4px;flex:1;cursor:pointer;font-weight:600}
#nav a span{font-size:1.25rem}#nav a.on{color:var(--t)}#nav a.on small{color:var(--t);font-weight:800}
#nav .fab{background:var(--am);color:#2a1d05;width:56px;height:56px;border-radius:20px;flex:none;margin-top:-26px;box-shadow:0 8px 18px rgba(244,169,58,.45);justify-content:center;font-size:1.9rem;font-weight:800}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;display:none;z-index:300;font-size:.85rem;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(8,18,28,.55);display:none;align-items:flex-end;justify-content:center;z-index:200}.modal.open{display:flex}
.modal-box{background:var(--c);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px;max-height:88vh;overflow:auto;animation:up .22s}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.lg{width:80px;height:80px;border-radius:24px;display:block;margin:0 auto 10px;box-shadow:0 10px 24px rgba(20,40,59,.28)}
.nc{background:linear-gradient(150deg,var(--ink),var(--ink2));color:#fff;text-align:center;padding:18px}.nc p{font-size:.78rem;opacity:.9;margin:6px 0 12px}.nc .bell{font-size:2.2rem}
.nc button{background:var(--am);color:#2a1d05;border:0;border-radius:12px;padding:12px;font-weight:800;width:100%;font-size:.92rem;cursor:pointer}
#offbar{display:none;position:fixed;top:0;left:0;right:0;background:var(--org);color:#fff;text-align:center;font-size:.76rem;padding:6px;z-index:400;font-weight:600}
body.offline #offbar{display:block}body.offline{padding-top:36px}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.68rem;font-weight:800;margin-right:4px}
.badge.local{background:#fff2d9;color:#8a5a00}.badge.sync{background:#d9f3e6;color:#0f6a41}
@media print{#nav,.btn,.nc,.ic{display:none!important}body{background:#fff;padding:0}}
</style>
</head>
<body>
<div id="offbar">📡 وضع بدون إنترنت — كل العمليات تُحفظ على الهاتف وترفع تلقائياً عند العودة</div>
<div id="app"></div><nav id="nav"></nav><div id="toast"></div>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')history.back()"><div class="modal-box" id="modalBox"></div></div>

<script>
/* ============================================================
   1) IndexedDB — قاعدة البيانات المحلية (تعمل بدون إنترنت)
   ============================================================ */
const LDB = {
  db: null, ready: null,
  init() {
    if (this.ready) return this.ready;
    this.ready = new Promise((res, rej) => {
      const r = indexedDB.open('kamalsoft_db', 1);
      r.onupgradeneeded = e => {
        const db = e.target.result;
        ['accounts','suppliers','products','sales','purchases','expenses','ledger','employees']
          .forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
    return this.ready;
  },
  async all(store) {
    await this.init();
    return new Promise((res, rej) => {
      const q = this.db.transaction(store, 'readonly').objectStore(store).getAll();
      q.onsuccess = () => res(q.result || []);
      q.onerror = () => rej(q.error);
    });
  },
  async put(store, data) {
    await this.init();
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, 'readwrite');
      tx.objectStore(store).put(data);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  async bulk(ops) {
    await this.init();
    return new Promise((res, rej) => {
      const stores = [...new Set(ops.map(o => o.s))];
      const tx = this.db.transaction(stores, 'readwrite');
      ops.forEach(o => {
        const st = tx.objectStore(o.s);
        if (o.del) o.del.forEach(id => st.delete(id));
        if (o.put) (Array.isArray(o.put) ? o.put : [o.put]).forEach(d => st.put(d));
      });
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  async clear() {
    await this.init();
    const stores = ['accounts','suppliers','products','sales','purchases','expenses','ledger','employees'];
    const tx = this.db.transaction(stores, 'readwrite');
    stores.forEach(s => tx.objectStore(s).clear());
    return new Promise(r => tx.oncomplete = r);
  }
};

/* ============================================================
   2) طبقة المزامنة مع السحابة (اختيارية تماماً)
   ============================================================ */
const Cloud = {
  get queue() { try { return JSON.parse(localStorage.pendingOps || '[]'); } catch { return []; } },
  set queue(v) { localStorage.pendingOps = JSON.stringify(v); },
  push(store, id, data, op = 'set') {
    const q = this.queue; q.push({ store, id, data, op, t: Date.now() }); this.queue = q;
    this.flush();
  },
  async flush() {
    if (!window._fb || !navigator.onLine || !window._user) return;
    const q = this.queue; if (!q.length) return;
    const rem = [];
    for (const p of q) {
      try {
        const { doc, setDoc, deleteDoc } = window._fbmod;
        if (p.op === 'delete') await deleteDoc(doc(window._db, p.store, p.id));
        else await setDoc(doc(window._db, p.store, p.id), p.data, { merge: true });
      } catch (e) {
        if (e.code !== 'unavailable' && e.code !== 'deadline-exceeded') console.warn('sync err', e.code);
        rem.push(p);
      }
    }
    this.queue = rem;
    if (!rem.length) toast('☁️ تمت المزامنة');
  }
};
window.addEventListener('online', () => { Cloud.flush(); });
window.addEventListener('offline', () => {});

/* ============================================================
   3) نظام زر الرجوع (Back Button) — Navigator Stack
   ============================================================ */
const Nav = {
  stack: [],
  current: { view: 'dashboard', id: null },
  init() {
    history.replaceState({ __app: true, view: 'dashboard', id: null }, '');
    window.addEventListener('popstate', e => {
      // 1) لو فيه Modal مفتوح → أغلقها فقط
      if ($('#modal').classList.contains('open')) {
        closeModal(true); // silent
        return;
      }
      // 2) لو الحالة تعود لشاشة معروفة → انتقل لها
      if (e.state && e.state.__app) {
        S.view = e.state.view || 'dashboard';
        if (e.state.view === 'customer') S.customerId = e.state.id;
        if (e.state.view === 'supplier') S.supplierId = e.state.id;
        if (e.state.view === 'employee') S.employeeId = e.state.id;
        S.formOpen = false; S.cart = [];
        render(true);
      } else {
        // ما فيه حالة داخل التطبيق — اسمح بالخروج
        if (confirm('هل تريد الخروج من التطبيق؟')) history.go(-2);
        else history.pushState({ __app: true, view: S.view, id: currentId() }, '');
      }
    });
  },
  push(view, id) {
    history.pushState({ __app: true, view, id: id || null }, '');
    this.current = { view, id };
  }
};
function currentId() {
  if (S.view === 'customer') return S.customerId;
  if (S.view === 'supplier') return S.supplierId;
  if (S.view === 'employee') return S.employeeId;
  return null;
}

/* ============================================================
   4) أدوات مساعدة
   ============================================================ */
const $ = s => document.querySelector(s), A = $('#app'), N = $('#nav');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const n2 = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const fmt = n => n2(n) + ' ' + S.settings.currency;
const dt = ts => new Date(ts).toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' });
const dOnly = ts => new Date(ts).toLocaleDateString('ar-EG');
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2600); };
const newToken = () => [...crypto.getRandomValues(new Uint8Array(20))].map(b => b.toString(16).padStart(2, '0')).join('');
const link = t => location.origin + location.pathname + '?c=' + t;
const initials = s => (s || '?').trim()[0] || '?';
const startDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
const sum = (a, f) => a.reduce((n, x) => n + (f(x) || 0), 0);
const pos = b => Math.max(b || 0, 0);
const off = () => false; // ← لم نعد نحتاج حظر العمليات عند انقطاع النت
const setNet = () => document.body.classList.toggle('offline', !navigator.onLine);
addEventListener('online', setNet); addEventListener('offline', setNet); setNet();
try { document.documentElement.dataset.theme = localStorage.th || ''; } catch {}

/* ============================================================
   5) حالة التطبيق
   ============================================================ */
const S = {
  user: null, view: 'dashboard', _authTab: 'login',
  customerId: null, supplierId: null, employeeId: null,
  customers: [], suppliers: [], products: [], sales: [], purchases: [],
  expenses: [], ledger: [], employees: [],
  settings: { name: 'الكامل سوفت', currency: 'ر.ي', phone: '', address: '', autoWhatsApp: true },
  cart: [], formOpen: false, q: '', cf: 'all', per: 'd', lt: '', unsubs: [], chart: null,
  _loaded: false
};

/* ============================================================
   6) طبقة البيانات الموحدة — Local First
   ============================================================ */
const mapStore = { customer: 'accounts', supplier: 'suppliers', product: 'products', sale: 'sales', purchase: 'purchases', expense: 'expenses', ledger: 'ledger', employee: 'employees' };
async function dbSave(store, data) {
  data.id = data.id || newToken();
  data.owner = S.user?.uid || 'local';
  data._updated = Date.now();
  await LDB.put(store, data);
  // حدّث الذاكرة
  const k = { accounts:'customers', suppliers:'suppliers', products:'products', sales:'sales', purchases:'purchases', expenses:'expenses', ledger:'ledger', employees:'employees' }[store];
  if (k && S[k]) {
    const i = S[k].findIndex(x => x.id === data.id);
    if (i >= 0) S[k][i] = data; else S[k].unshift(data);
  }
  // ادفع للسحابة (لو مسجل دخول + فيه نت)
  if (S.user && !S.user.isAnonymous) Cloud.push(store, data.id, data, 'set');
  return data;
}
async function dbDelete(store, id) {
  await LDB.bulk([{ s: store, del: [id] }]);
  const k = { accounts:'customers', suppliers:'suppliers', products:'products', sales:'sales', purchases:'purchases', expenses:'expenses', ledger:'ledger', employees:'employees' }[store];
  if (k && S[k]) S[k] = S[k].filter(x => x.id !== id);
  if (S.user && !S.user.isAnonymous) Cloud.push(store, id, null, 'delete');
}

/* ============================================================
   7) تحميل البيانات — من IndexedDB أولاً
   ============================================================ */
async function loadAll() {
  const [customers, suppliers, products, sales, purchases, expenses, ledger, employees] = await Promise.all([
    LDB.all('accounts'), LDB.all('suppliers'), LDB.all('products'), LDB.all('sales'),
    LDB.all('purchases'), LDB.all('expenses'), LDB.all('ledger'), LDB.all('employees')
  ]);
  const byTs = a => a.sort((x, y) => (y.ts || 0) - (x.ts || 0));
  S.customers = customers; S.suppliers = suppliers; S.products = products;
  S.sales = byTs(sales); S.purchases = byTs(purchases); S.expenses = byTs(expenses);
  S.ledger = byTs(ledger); S.employees = employees.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  S._loaded = true;
}

/* ============================================================
   8) قائمة الأصناف + الـ Navigation
   ============================================================ */
const V = {
  dashboard: () => dash(), customers: () => customersList(), customer: () => partyPage('customer'),
  suppliers: () => suppliersList(), supplier: () => partyPage('supplier'),
  products: () => productsList(), sales: () => docList('sale'), 'sale-new': () => invNew('sale'),
  purchases: () => docList('purchase'), 'purchase-new': () => invNew('purchase'),
  expenses: () => expensesList(), employees: () => employeesList(), employee: () => employeePage(),
  reports: () => reportsView(), ledger: () => ledgerView(), settings: () => settingsView(),
  more: () => moreView(), login: () => loginView()
};
function render(silent) {
  nav();
  (V[S.view] || V.dashboard)();
}
function nav() {
  const grp = { customer: 'customers', sale: 'sales', 'sale-new': 'sales' };
  const cur = grp[S.view] || (['dashboard','customers','sales'].includes(S.view) ? S.view : 'more');
  const it = [['dashboard','🏠','الرئيسية'],['customers','👥','العملاء'],['fab','+',''],['sales','🧾','المبيعات'],['more','☰','المزيد']];
  N.innerHTML = it.map(([v, i, l]) => v === 'fab'
    ? `<a class="fab" data-v="fab">+</a>`
    : `<a class="${cur === v ? 'on' : ''}" data-v="${v}"><span>${i}</span><small>${l}</small></a>`).join('');
  N.querySelectorAll('[data-v]').forEach(e => e.onclick = () => {
    if (e.dataset.v === 'fab') return quickSheet();
    if (e.dataset.v === S.view) return;
    S.view = e.dataset.v; S.formOpen = false; S.q = ''; S.cart = [];
    Nav.push(e.dataset.v, null);
    window.scrollTo(0, 0); render();
  });
}
function go(v, id, push = true) {
  S.view = v; S.formOpen = false; S.q = ''; S.cart = [];
  if (v === 'customer') S.customerId = id;
  if (v === 'supplier') S.supplierId = id;
  if (v === 'employee') S.employeeId = id;
  if (push) Nav.push(v, id);
  window.scrollTo(0, 0); render();
}
window.go = go;

/* ============================================================
   9) Modal
   ============================================================ */
function modal(h) {
  $('#modalBox').innerHTML = h;
  $('#modal').classList.add('open');
  history.pushState({ __modal: true }, '');
}
window.closeModal = (silent) => {
  if (!$('#modal').classList.contains('open')) return;
  $('#modal').classList.remove('open');
  if (!silent) history.back(); // يخلي زر الرجوع متزامن
};
const btns = (ok = 'حفظ') => `<div class="row" style="margin-top:12px"><button class="btn o w" onclick="closeModal()">إلغاء</button><button class="btn w" id="sv">${ok}</button></div>`;

/* ============================================================
   10) المكوّنات المشتركة
   ============================================================ */
const ledgerData = (type, label, amount, dir, cash, extra = {}) => ({ id: newToken(), owner: S.user?.uid || 'local', ts: Date.now(), type, label, amount: Math.abs(amount), dir, cash: cash || 0, ...extra });
const rowH = (col, t, s, v, vc, id, x = '') => `<div class="item" data-id="${id}"><div class="row" style="gap:11px"><div class="av" style="background:${col}22;color:${col}">${esc(initials(t))}</div><div><b>${esc(t)}</b><br><small>${s}</small></div></div><div style="text-align:left"><b class="${vc}">${v}</b>${x}</div></div>`;
function txRow(l) { const i = l.dir === 'in'; return `<div class="tx"><div><b style="font-size:.86rem">${esc(l.label || l.type)}</b><br><small>${dt(l.ts)}${l.note ? ' · ' + esc(l.note) : ''}</small></div><b class="${i ? 'ok' : 'due'}">${i ? '+' : '-'}${n2(l.amount)}</b></div>`; }
function listPage(o) {
  A.innerHTML = `<div class="top"><h1>${o.title}</h1>${o.add ? `<button class="btn am sm" id="add">${o.add}</button>` : ''}</div>${o.head || ''}
  ${o.chips ? `<div class="chips">${o.chips.map(([v, l]) => `<div class="chip ${o.cur === v ? 'on' : ''}" data-c="${v}">${l}</div>`).join('')}</div>` : ''}
  <input id="sr" placeholder="🔎 بحث" value="${esc(S.q)}"><div class="card" id="lst"></div>`;
  const draw = () => { $('#lst').innerHTML = o.rows(S.q.toLowerCase()) || '<p class="hint">لا توجد نتائج</p>'; $('#lst').querySelectorAll('[data-id]').forEach(e => e.onclick = () => o.click(e.dataset.id)); };
  if ($('#add')) $('#add').onclick = o.onAdd;
  A.querySelectorAll('[data-c]').forEach(e => e.onclick = () => o.onChip(e.dataset.c));
  $('#sr').oninput = e => { S.q = e.target.value; draw(); };
  draw();
}

/* ============================================================
   11) WhatsApp
   ============================================================ */
function whatsappSend(phone, name, msg) {
  if (!phone) return toast('لا يوجد رقم هاتف مسجل');
  let p = phone.replace(/[^\d]/g, ''); if (p.startsWith('00')) p = p.slice(2);
  if (!p.startsWith('967')) p = '967' + p.replace(/^0+/, '');
  window.open('https://wa.me/' + p + '?text=' + encodeURIComponent(`السلام عليكم ${name} 🌟\n\n${msg}\n\n— ${S.settings.name}`), '_blank');
}
const remind = c => whatsappSend(c.phone, c.name, `نذكّرك بأن رصيد حسابك المستحق *${n2(c.balance)} ${S.settings.currency}*.\nكشف حسابك: ${link(c.id)}`);

function dash() {
  const cash = sum(S.ledger, l => l.cash), recv = sum(S.customers, c => pos(c.balance)), pay = sum(S.suppliers, s => pos(s.balance));
  const inv = sum(S.products, p => (p.stock || 0) * (p.cost || 0)), adv = sum(S.employees, e => pos(e.balance));
  const t0 = startDay(Date.now()), tS = sum(S.sales.filter(s => s.ts >= t0), s => s.total), tE = sum(S.expenses.filter(e => e.ts >= t0), e => e.amount);
  const tP = sum(S.ledger.filter(l => l.ts >= t0 && l.type === 'payment' && l.dir === 'in'), l => l.amount);
  const top = S.customers.filter(c => (c.balance || 0) > 0).sort((a, b) => b.balance - a.balance).slice(0, 3);
  const low = S.products.filter(p => (p.stock || 0) <= (p.min || 0));
  const h = new Date().getHours();
  const pending = Cloud.queue.length;
  A.innerHTML = `<div class="top"><div><small>${h < 12 ? 'صباح الخير ☀️' : 'مساء الخير 🌙'}</small><h1>${esc(S.settings.name)}</h1></div>
  <div><span class="ic" id="th">🌓</span><span class="ic" id="lg">📒</span></div></div>
  ${pending ? `<div class="card" style="background:#fff8e6;border-color:#f0c674"><small>⏳ ${pending} عملية في انتظار المزامنة — ستُرفع تلقائياً عند توفر الإنترنت</small></div>` : ''}
  <div class="hero"><small>المستحق لك عند العملاء</small><div class="big">${fmt(recv)}</div>
  <div class="g3"><div class="mini"><small>الصندوق</small><b>${n2(cash)}</b></div><div class="mini"><small>مبيعات اليوم</small><b>${n2(tS)}</b></div><div class="mini"><small>دفعات اليوم</small><b>${n2(tP)}</b></div></div></div>
  <div class="g4"><div class="act" data-q="debt"><i>🔴</i>دين</div><div class="act" data-q="payment"><i>🟢</i>دفعة</div><div class="act" data-q="sale"><i>🧾</i>بيع</div><div class="act" data-q="exp"><i>💸</i>مصروف</div></div>
  ${top.length ? `<div class="sec">أعلى المديونين <small>اضغط للتذكير</small></div><div class="card">${top.map(c => rowH('#e5484d', c.name, esc(c.phone || '—'), fmt(c.balance), 'due', c.id, `<br><a class="btn g sm" data-rm="${c.id}" style="margin-top:4px">📱 تذكير</a>`)).join('')}</div>` : ''}
  ${low.length ? `<div class="card row" style="cursor:pointer" id="lowc"><div><b class="warn">⚠️ ${low.length} منتج قارب على النفاد</b><br><small>${esc(low.slice(0, 3).map(p => p.name).join('، '))}</small></div><span>‹</span></div>` : ''}
  <div class="g2"><div class="stat"><div class="l">مستحق للموردين</div><div class="n warn">${fmt(pay)}</div></div><div class="stat"><div class="l">قيمة المخزون</div><div class="n blue">${fmt(inv)}</div></div>
  <div class="stat"><div class="l">سحبيات الموظفين</div><div class="n purple">${fmt(adv)}</div></div><div class="stat"><div class="l">مصروفات اليوم</div><div class="n due">${fmt(tE)}</div></div></div>
  <div class="sec">آخر الحركات <a class="btn g sm" id="lg2">الكل</a></div><div class="card">${S.ledger.slice(0, 6).map(txRow).join('') || '<p class="hint">لا توجد حركات بعد — اضغط + للبدء</p>'}</div>`;
  $('#th').onclick = () => { const d = document.documentElement.dataset.theme === 'dark' ? '' : 'dark'; document.documentElement.dataset.theme = d; try { localStorage.th = d; } catch {} };
  $('#lg').onclick = $('#lg2').onclick = () => go('ledger');

  A.querySelectorAll('[data-rm]').forEach(b => b.onclick = e => { e.stopPropagation(); remind(S.customers.find(c => c.id === b.dataset.rm)); });
}

function customerForm(c) {
  const e = !!c;
  modal(`<h2>${e ? 'تعديل عميل' : 'عميل جديد'}</h2><label>الاسم *</label><input id="n" value="${esc(c?.name || '')}">
  <label>الهاتف (لإشعار واتساب)</label><input id="ph" type="tel" value="${esc(c?.phone || '')}" placeholder="7771234567">
  <label>سقف الدين (اختياري)</label><input id="lm" type="number" value="${c?.limit || ''}" placeholder="بدون سقف">
  ${e ? '' : `<label>رصيد افتتاحي (دين سابق)</label><input id="op" type="number" placeholder="0">`}${btns()}`);
  $('#sv').onclick = async () => {
    const name = $('#n').value.trim(); if (!name) return toast('اكتب الاسم');
    const d = { name, phone: $('#ph').value.trim(), limit: Number($('#lm').value) || 0 };
    if (e) { d.id = c.id; d.balance = c.balance; await dbSave('accounts', d); }
    else {
      const op = Number($('#op').value) || 0;
      const acc = { id: newToken(), name, phone: d.phone, limit: d.limit, balance: op, currency: S.settings.currency, createdAt: Date.now() };
      const ops = [{ s: 'accounts', put: acc }];
      if (op > 0) ops.push({ s: 'ledger', put: ledgerData('debt', 'رصيد افتتاحي', op, 'out', 0, { accountId: acc.id }) });
      await LDB.bulk(ops);
      await loadAll();
      if (S.user && !S.user.isAnonymous) {
        Cloud.push('accounts', acc.id, acc);
        if (op > 0) Cloud.push('ledger', ops[1].put.id, ops[1].put);
      }
    }
    closeModal(true); toast('تم الحفظ'); render();
  };
}

function amountForm(type, ent, kind) {
  const isDebt = type === 'debt', isCust = kind === 'customer';
  modal(`<h2>${isDebt ? 'تسجيل دين على' : 'تسجيل دفعة ' + (isCust ? 'من' : 'إلى')} ${esc(ent.name)}</h2>
  <small>الرصيد الحالي: ${fmt(ent.balance || 0)}</small>
  <label>المبلغ</label><input id="am" type="number" inputmode="decimal" placeholder="0" autofocus>
  ${!isDebt && isCust && ent.balance > 0 ? `<button class="btn g sm" id="full" style="margin:4px 0">تسديد كامل (${n2(ent.balance)})</button>` : ''}
  <label>ملاحظة</label><input id="nt" placeholder="اختياري"><div id="err" style="color:var(--red);font-size:.8rem;display:none"></div>${btns('تأكيد')}`);
  if ($('#full')) $('#full').onclick = () => $('#am').value = ent.balance;
  $('#sv').onclick = async () => {
    const amount = Number($('#am').value);
    if (!(amount > 0)) return toast('أدخل مبلغاً صحيحاً');
    const oldB = Number(ent.balance) || 0;
    const newB = isDebt ? oldB + amount : oldB - amount;
    if (isDebt && isCust && ent.limit > 0 && newB > ent.limit && !confirm('هذا الدين يتجاوز سقف العميل (' + n2(ent.limit) + '). متابعة؟')) return;
    const svBtn = $('#sv'); svBtn.disabled = true; svBtn.textContent = 'جارٍ الحفظ...';
    try {

        { ...(isCust ? { accountId: ent.id } : { supplierId: ent.id }), note: $('#nt').value.trim() });

      m += `📊 إجمالي حسابك الحالي: ${newB} ${cur}\n📅 التاريخ: ${now.toLocaleDateString('ar-EG')} - ${now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}\n\n` + (isDebt ? 'شكراً لثقتكم بنا 🌹' : 'شكراً لالتزامكم بالسداد 💚');
      if (isCust && ent.phone && S.settings.autoWhatsApp) setTimeout(() => whatsappSend(ent.phone, ent.name, m), 500);
    } catch (e) {
      console.error(e);
      $('#err').textContent = 'فشل: ' + (e.message || 'خطأ');
      $('#err').style.display = 'block';
      svBtn.disabled = false; svBtn.textContent = 'تأكيد';

async function saveInv(kind) {
  if (!S.cart.length) return toast('أضف أصنافاً');
  const sl = kind === 'sale', pid = $('#party').value;
  const p = (sl ? S.customers : S.suppliers).find(x => x.id === pid);
  const total = sum(S.cart, i => i.qty * i.price);
  const paid = Math.max(0, Math.min(Number($('#paid').value) || 0, total));
  const due = total - paid;
  if (due > 0 && !p) return toast(sl ? 'اختر عميلاً للبيع الآجل' : 'اختر مورداً للشراء الآجل');
  const ref = newToken();
  const invData = {
    id: ref, ts: Date.now(),
    [sl ? 'customerId' : 'supplierId']: pid || null,
    [sl ? 'customerName' : 'supplierName']: p?.name || (sl ? 'عميل نقدي' : 'مورد نقدي'),
    items: S.cart.map(i => ({ id: i.id, name: i.name, qty: i.qty, price: i.price })), total, paid, due
  };
  const ops = [{ s: sl ? 'sales' : 'purchases', put: invData }];
  // تحديث المخزون
  for (const it of S.cart) {
    const prod = S.products.find(x => x.id === it.id); if (!prod) continue;
    const upd = sl
      ? { ...prod, stock: (prod.stock || 0) - it.qty }
      : { ...prod, stock: (prod.stock || 0) + it.qty, cost: it.price };
    ops.push({ s: 'products', put: upd });
  }
  // سجل الفاتورة + دفع/دين
  if (paid > 0) ops.push({ s: 'ledger', put: ledgerData(sl ? 'sale' : 'purchase', sl ? 'فاتورة بيع' : 'فاتورة شراء', paid, sl ? 'in' : 'out', sl ? paid : -paid, { ref }) });
  if (due > 0 && p) {
    ops.push({ s: 'ledger', put: ledgerData(sl ? 'sale' : 'purchase', sl ? 'فاتورة بيع آجل' : 'فاتورة شراء آجل', due, 'out', 0, { ...(sl ? { accountId: pid } : { supplierId: pid }), ref }) });
    const col = sl ? 'accounts' : 'suppliers';
    ops.push({ s: col, put: { ...p, balance: (Number(p.balance) || 0) + due } });
  }
  await LDB.bulk(ops);
  await loadAll();
  if (S.user && !S.user.isAnonymous) ops.forEach(o => o.put && !Array.isArray(o.put) && Cloud.push(o.s, o.put.id, o.put));
  S.formOpen = false; S.cart = []; toast('✅ تم حفظ الفاتورة');
  history.back();
  setTimeout(() => { modal(`<h2>تم حفظ الفاتورة ✅</h2><p style="margin:10px 0;font-size:.9rem">هل تريد طباعة الفاتورة؟</p><div class="row"><button class="btn o w" onclick="closeModal()">إغلاق</button><button class="btn w" id="pv">🖨️ طباعة PDF</button></div>`);
    $('#pv').onclick = () => { closeModal(); invoicePDF(invData, kind); }; }, 300);
}

  <div class="card"><b>المبيعات آخر 7 أيام</b><canvas id="ch" height="150"></canvas></div>
  <div class="card"><b>الوضع المالي الحالي</b><table>${[['النقدية بالصندوق', cash, 'ok'], ['ديون العملاء', recv, 'due'], ['مستحق للموردين', pay, 'warn'], ['سحبيات الموظفين', adv, 'purple'], ['قيمة المخزون', inv, 'blue']].map(([l, v, c]) => `<tr><td>${l}</td><td class="${c}"><b>${fmt(v)}</b></td></tr>`).join('')}</table></div>`;
  A.querySelectorAll('[data-p]').forEach(e => e.onclick = () => { S.per = e.dataset.p; reportsView(); });
  $('#pd').onclick = () => exportPDF('تقرير مالي شامل', `<table border="1" cellspacing="0" cellpadding="8" style="width:100%;border-collapse:collapse;font-size:13px"><tr style="background:#eef3f0"><th>البند</th><th>المبلغ</th></tr>${[['المبيعات', sa], ['المشتريات', pu], ['المصروفات', ex], ['صافي الربح التقديري', prof], ['النقدية بالصندوق', cash], ['ديون العملاء', recv], ['مستحق للموردين', pay], ['سحبيات الموظفين', adv], ['قيمة المخزون', inv]].map(([l, v]) => `<tr><td>${l}</td><td>${fmt(v)}</td></tr>`).join('')}</table>`);

const LIBS = { qr: ['https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js', () => window.QRCode], chart: ['https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js', () => window.Chart], pdf: ['https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js', () => window.html2pdf] };
const _lp = {};
const need = k => { const [u, t] = LIBS[k]; if (t()) return Promise.resolve(); return _lp[k] || (_lp[k] = new Promise((ok, no) => { const e = document.createElement('script'); e.src = u; e.onload = ok; e.onerror = () => { delete _lp[k]; no(); }; document.head.appendChild(e); })); };
function exportPDF(title, html) {
  const box = document.createElement('div'); box.style.cssText = 'font-family:Tahoma,Arial;direction:rtl;padding:20px;color:#111;background:#fff;width:760px';
  box.innerHTML = `<h2 style="color:#14283b;text-align:center;margin:0">${esc(S.settings.name)}</h2><h3 style="text-align:center;margin:6px 0 18px">${esc(title)}</h3>${html}<div style="margin-top:28px;text-align:center;font-size:11px;color:#888">تم الإنشاء: ${new Date().toLocaleString('ar-EG')}</div>`;
  document.body.appendChild(box);
  need('pdf').then(() => html2pdf().set({ margin: 10, filename: title.replace(/[^\w\u0600-\u06FF]+/g, '_') + '.pdf', html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(box).save().then(() => box.remove()).catch(() => { box.remove(); toast('تعذّر التصدير'); })).catch(() => { box.remove(); toast('تعذّر تحميل المكتبة — تحقق من الاتصال'); });
}
const tbl = (h, r) => `<table border="1" cellspacing="0" cellpadding="6" style="width:100%;border-collapse:collapse;font-size:12px"><tr style="background:#eef3f0">${h.map(x => `<th>${x}</th>`).join('')}</tr>${r || `<tr><td colspan="${h.length}">لا توجد حركات</td></tr>`}</table>`;
function statementPDF(ent, txs, kind) {
  exportPDF((kind === 'customer' ? 'كشف حساب عميل - ' : 'كشف حساب مورد - ') + ent.name,
    tbl(['التاريخ','البيان','ملاحظة','المبلغ'], txs.map(l => `<tr><td>${dOnly(l.ts)}</td><td>${esc(l.label)}</td><td>${esc(l.note || '')}</td><td style="color:${l.dir === 'in' ? '#1f9d6b' : '#e5484d'}">${l.dir === 'in' ? '+' : '-'}${n2(l.amount)}</td></tr>`).join('')) +
    `<h3 style="margin-top:14px">الرصيد الحالي: ${fmt(ent.balance || 0)}</h3>`);
}
function employeeStatementPDF(emp, txs) {
  exportPDF('كشف حساب موظف - ' + emp.name, `<p style="font-size:13px;margin-bottom:10px"><b>الوظيفة:</b> ${esc(emp.position || '—')} &nbsp; <b>الراتب:</b> ${fmt(emp.salary || 0)}</p>` +
    tbl(['التاريخ','البيان','ملاحظة','المبلغ'], txs.map(l => `<tr><td>${dOnly(l.ts)}</td><td>${esc(l.label)}</td><td>${esc(l.note || '')}</td><td>${n2(l.amount)}</td></tr>`).join('')) +
    `<h3 style="margin-top:14px">الرصيد: ${fmt(emp.balance || 0)}</h3>`);
}
function invoicePDF(rec, kind) {
  const sl = kind === 'sale', party = sl ? (rec.customerName || 'عميل نقدي') : (rec.supplierName || 'مورد نقدي');
  exportPDF((sl ? 'فاتورة بيع' : 'فاتورة شراء') + ' رقم ' + (rec.id || '').slice(-6).toUpperCase(),
    `<div style="display:flex;justify-content:space-between;margin-bottom:14px;font-size:13px"><div><b>${sl ? 'العميل' : 'المورد'}:</b> ${esc(party)}</div><div><b>التاريخ:</b> ${dt(rec.ts)}</div></div>
    ${tbl(['#','الصنف','الكمية','السعر','الإجمالي'], rec.items.map((i, x) => `<tr><td>${x + 1}</td><td>${esc(i.name)}</td><td>${n2(i.qty)}</td><td>${n2(i.price)}</td><td>${n2(i.qty * i.price)}</td></tr>`).join('') +
      `<tr style="font-weight:bold"><td colspan="4">الإجمالي</td><td>${fmt(rec.total)}</td></tr><tr><td colspan="4">المدفوع</td><td>${fmt(rec.paid)}</td></tr>${rec.due > 0 ? `<tr><td colspan="4">المتبقي (آجل)</td><td style="color:#e5484d;font-weight:bold">${fmt(rec.due)}</td></tr>` : ''}`)}
    <p style="margin-top:20px;text-align:center;font-size:12px;color:#6b7b72">شكراً لتعاملكم معنا 🌹<br>${esc(S.settings.name)} ${S.settings.phone ? '· ' + esc(S.settings.phone) : ''}</p>`);
}

function publicView(tk) {
  N.innerHTML = '';
  A.innerHTML = `<div style="text-align:center;padding:18px 0 6px"><img class="lg" src="icon-192.png" alt=""><h1>كشف حساب</h1><small id="pub-store">جاري التحميل...</small></div>
  <div class="hero" id="acc" style="text-align:center"><small>جاري تحميل البيانات...</small></div>
  <div class="g2" id="pub-summary" style="display:none"><div class="stat"><div class="l">إجمالي الديون</div><div class="n due" id="pub-debt">0</div></div><div class="stat"><div class="l">إجمالي الدفعات</div><div class="n ok" id="pub-pay">0</div></div></div>
  <div class="sec">سجل الحركات</div><div class="card" id="txs"><p class="hint">لا توجد حركات بعد</p></div>
  <button class="btn w" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>`;
  // في الوضع المحلي، اجلب من Firestore فقط إذا كان المستخدم مسجلاً
  if (!window._db) { $('#acc').innerHTML = '<small>هذه الصفحة تحتاج اتصالاً بالسحابة.</small>'; return; }
  window._fbmod.onSnapshot(window._fbmod.doc(window._db, 'accounts', tk), s => {
    if (!s.exists()) { $('#acc').innerHTML = '<small>الرابط غير صحيح.</small>'; return; }
    const a = s.data(), b = a.balance || 0; $('#pub-store').textContent = a.owner || 'كشف حسابي';
    $('#acc').innerHTML = `<div class="av" style="margin:0 auto 8px;width:58px;height:58px;background:rgba(255,255,255,.12);color:#fff">${esc(initials(a.name))}</div><h2>${esc(a.name)}</h2>
    <div class="big" style="margin:6px 0">${n2(Math.abs(b))} ${esc(a.currency || '')}</div><small>${b > 0 ? 'المبلغ المطلوب منك' : b < 0 ? 'رصيد لك' : 'الحساب مسدد ✅'}</small>`;
  });
  const pt = arr => arr.map(d => { const x = d.data ? d.data() : d; return { amount: Number(x.amount) || 0, label: x.label || (x.type === 'debt' ? 'دين' : 'دفعة'), note: x.note || '', ts: x.ts || Date.now(), dir: x.dir || (x.type === 'debt' ? 'out' : 'in') }; });
  const { query, collection, where, orderBy } = window._fbmod;
  window._fbmod.onSnapshot(query(collection(window._db, 'ledger'), where('accountId', '==', tk)), s => {
    const m = pt(s.docs).sort((a, b) => b.ts - a.ts);
    $('#pub-debt').textContent = fmt(sum(m.filter(t => t.dir === 'out'), t => t.amount));
    $('#pub-pay').textContent = fmt(sum(m.filter(t => t.dir === 'in'), t => t.amount));
    $('#pub-summary').style.display = m.length ? 'grid' : 'none';
    $('#txs').innerHTML = m.map(t => `<div class="tx"><div><b style="font-size:.88rem">${esc(t.label)}</b><br><small>${dt(t.ts)} ${t.note ? '· ' + esc(t.note) : ''}</small></div><b class="${t.dir === 'in' ? 'ok' : 'due'}">${t.dir === 'in' ? '−' : '+'}${n2(t.amount)}</b></div>`).join('') || '<p class="hint">لا توجد حركات مسجلة بعد</p>';
  });
}

/* ============================================================
   26) Firebase (اختياري — فقط للمزامنة السحابية)
   ============================================================ */
let _fbInit = null;
async function initFirebase() {
  if (_fbInit) return _fbInit;
  _fbInit = (async () => {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const authMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    const fsMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const fb = initializeApp({ apiKey: "AIzaSyDaLsIF93OD-Lr9y51j_s4wB9OzahLUiTQ", authDomain: "grocery-debts.firebaseapp.com", projectId: "grocery-debts", storageBucket: "grocery-debts.firebasestorage.app", messagingSenderId: "484535933298", appId: "1:484535933298:web:87f8e2ea08a6d26231e5eb" });
    const auth = authMod.getAuth(fb);
    let db;
    try { db = fsMod.initializeFirestore(fb, { localCache: fsMod.persistentLocalCache({ tabManager: fsMod.persistentMultipleTabManager() }) }); } catch { db = fsMod.getFirestore(fb); }
    window._fb = fb; window._db = db; window._auth = auth;
    window._fbmod = { ...fsMod, ...authMod, doc: fsMod.doc, setDoc: fsMod.setDoc, deleteDoc: fsMod.deleteDoc, collection: fsMod.collection, query: fsMod.query, where: fsMod.where, orderBy: fsMod.orderBy, onSnapshot: fsMod.onSnapshot };
    return { fb, auth, db, fsMod, authMod };
  })();
  return _fbInit;
}

/* ============================================================
   27) Login (اختياري)
   ============================================================ */
function authErr(e) {
  const m = { 'auth/invalid-email': 'البريد غير صحيح', 'auth/user-not-found': 'لا يوجد حساب', 'auth/wrong-password': 'كلمة المرور خاطئة', 'auth/invalid-credential': 'البريد أو كلمة المرور خطأ', 'auth/email-already-in-use': 'البريد مستخدم', 'auth/weak-password': 'كلمة المرور قصيرة', 'auth/too-many-requests': 'حاول لاحقاً', 'auth/network-request-failed': 'تعذّر الاتصال', 'auth/popup-closed-by-user': 'أُغلقت النافذة', 'auth/popup-blocked': 'المتصفح منع النافذة', 'auth/missing-name': 'اكتب اسمك' };
  return m[e?.code] || ('خطأ: ' + (e?.code || ''));
}
function loginView() {
  const reg = S._authTab === 'register';
  A.innerHTML = `<div class="top"><button class="btn g sm" id="bk">→ رجوع</button></div>
  <div style="text-align:center;padding:20px 0 12px"><img class="lg" src="icon-192.png" alt=""><h1>المزامنة السحابية</h1><small>بياناتك محفوظة على هاتفك دائماً. التسجيل اختياري فقط لمزامنة الأجهزة.</small></div>
  <div class="card"><div class="row" style="margin-bottom:10px"><button class="btn ${reg ? 'g' : ''} w" id="tl">دخول</button><button class="btn ${reg ? '' : 'g'} w" id="tr">حساب جديد</button></div>
  ${reg ? '<label>الاسم الكامل</label><input id="a-name">' : ''}
  <label>البريد الإلكتروني</label><input id="a-email" type="email" autocomplete="email">
  <label>كلمة المرور</label><input id="a-pass" type="password" autocomplete="current-password">
  <button class="btn am w" id="a-go" style="margin-top:12px">${reg ? 'إنشاء الحساب' : 'تسجيل الدخول'}</button>
  ${reg ? '' : '<div style="text-align:center;margin-top:10px"><a id="a-forgot" style="font-size:.82rem;cursor:pointer">نسيت كلمة المرور؟</a></div>'}
  <div class="hint">أو</div><button class="btn o w" id="g">المتابعة بحساب جوجل</button></div>
  <div class="card" style="background:#fff8e6;border-color:#f0c674"><small>💡 بعد تسجيل الدخول، ستُرفع بياناتك المحلية تلقائياً للسحابة ويمكنك استرجاعها من أي جهاز.</small></div>`;
  $('#bk').onclick = () => history.back();
  $('#tl').onclick = () => { S._authTab = 'login'; loginView(); };
  $('#tr').onclick = () => { S._authTab = 'register'; loginView(); };
  $('#a-go').onclick = async () => {
    const email = $('#a-email').value.trim(), pass = $('#a-pass').value;
    if (!email || !pass) return toast('أدخل البريد وكلمة المرور');
    $('#a-go').disabled = true;
    try {
      const { auth, authMod } = await initFirebase();
      await authMod.setPersistence(auth, authMod.browserLocalPersistence);
      if (reg) {
        const name = $('#a-name').value.trim(); if (!name) throw { code: 'auth/missing-name' };
        const cr = await authMod.createUserWithEmailAndPassword(auth, email, pass);
        const { setDoc, doc } = window._fbmod;
        await setDoc(doc(window._db, 'settings', cr.user.uid), { name, currency: 'ر.ي', phone: '', address: '', autoWhatsApp: true }, { merge: true });
      } else {
        await authMod.signInWithEmailAndPassword(auth, email, pass);
      }
      toast('✅ تم الدخول — جارٍ المزامنة');
      S.view = 'dashboard'; history.pushState({ __app: true, view: 'dashboard' }, ''); render();
    } catch (e) { $('#a-go').disabled = false; toast(authErr(e)); }
  };
  $('#a-pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('#a-go').click(); });
  if ($('#a-forgot')) $('#a-forgot').onclick = async () => {
    const em = $('#a-email').value.trim(); if (!em) return toast('اكتب بريدك');
    try { const { auth, authMod } = await initFirebase(); await authMod.sendPasswordResetEmail(auth, em); toast('تم إرسال رابط الاستعادة'); } catch (e) { toast(authErr(e)); }
  };
  $('#g').onclick = async () => {
    try {
      const { auth, authMod } = await initFirebase();
      await authMod.setPersistence(auth, authMod.browserLocalPersistence);
      await authMod.signInWithPopup(auth, new authMod.GoogleAuthProvider());
    } catch (e) { toast(authErr(e)); }
  };
}
async function logout() {
  if (!confirm('هل تريد تسجيل الخروج؟ (بياناتك تبقى على الهاتف)')) return;
  try { const { auth, authMod } = await initFirebase(); await authMod.signOut(auth); toast('تم الخروج'); S.view = 'dashboard'; history.pushState({ __app: true, view: 'dashboard' }, ''); render(); } catch (e) { toast('تعذّر الخروج'); }
}

try { Object.assign(S.settings, JSON.parse(localStorage.st || '{}')); } catch {}
try { Object.assign(S.settings, JSON.parse(localStorage.st || '{}')); } catch {}

(async () => {
